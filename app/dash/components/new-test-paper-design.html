<!--
  Paper.design source for the New test chat.
  Written to Paper canvas rules: flex only, inline styles, no grid, no margins, no tables.
  Tokens from https://paper.design (paper cream #EDEBE1, off-black #222222, logo blue #81ACEC).
-->
<div layer-name="New test chat artboard" style="display:flex;flex-direction:column;width:1440px;height:900px;background:#EDEBE1;color:#222222;font-family:'Avenir Next','Segoe UI',sans-serif;">
  <div layer-name="Top bar" style="display:flex;flex-direction:row;align-items:center;justify-content:space-between;height:56px;padding:0 28px;border-bottom:1px solid rgba(0,0,0,0.08);">
    <div style="display:flex;flex-direction:row;align-items:center;gap:10px;">
      <div layer-name="Paper mark" style="display:block;width:18px;height:18px;background:#81ACEC;"></div>
      <div style="display:block;font-size:15px;font-weight:600;letter-spacing:-0.02em;">New test</div>
    </div>
    <div style="display:block;font-size:12px;opacity:0.55;">paper.design</div>
  </div>
  <div layer-name="Canvas" style="display:flex;flex-direction:column;flex:1;align-items:center;padding:36px 24px 28px;">
    <div layer-name="Sheet" style="display:flex;flex-direction:column;width:720px;flex:1;background:#FFFFFF;border:1px solid rgba(0,0,0,0.08);border-radius:6px;">
      <div layer-name="Empty copy" style="display:flex;flex-direction:column;flex:1;justify-content:center;padding:48px 40px;gap:16px;">
        <div style="display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.45;">Albert chat</div>
        <div style="display:block;font-size:34px;font-weight:500;letter-spacing:-0.03em;line-height:1.15;">Ask the business a clean question</div>
        <div style="display:block;font-size:16px;line-height:1.5;opacity:0.62;max-width:460px;">A test surface designed on paper. Answers stream here with the same Albert runtime as the main chat.</div>
      </div>
      <div layer-name="Composer" style="display:flex;flex-direction:row;align-items:center;gap:10px;padding:16px;border-top:1px solid rgba(0,0,0,0.08);">
        <div layer-name="Input" style="display:flex;flex:1;align-items:center;height:44px;padding:0 14px;background:#F7F6F1;border:1px solid rgba(0,0,0,0.08);border-radius:6px;color:#6B6B63;">Ask about sales, cash, stock, or customers</div>
        <div layer-name="Send" style="display:flex;align-items:center;justify-content:center;height:36px;padding:0 16px;background:#222222;color:#FFFFFF;border-radius:999px;font-size:13px;font-weight:600;">Send</div>
      </div>
    </div>
  </div>
</div>
