views:
  - name: xero_balance_sheet_analytics
    title: Balance sheet (Xero)
    description: >
      Xero's own standard-layout Balance Sheet at month-end grain, landed from
      Xero's report through Fivetran: total assets, total liabilities, net
      assets and equity, bank total, accounts receivable / payable, GST control
      balance, inventory and current-year earnings per as-at date (trailing 24
      month ends, current month rendered through the last refresh).
      Unprefixed members are one-row-per-date headline positions; line_*
      members are the individual statement lines for account drill-down.
    meta:
      ai_context: >
        Use for balance sheet / statement of financial position / net assets /
        equity / what we own and owe / total assets or liabilities / bank
        total / accounts receivable or payable BALANCES / GST control balance /
        inventory value / loan and owner-loan balances / PAYG or super payable
        at a month end or financial-year end (30 June). Pick ONE as_at date
        (the newest row = latest month end, current month through last
        refresh); never sum across dates. For individual accounts use line_*
        members with line_is_account_line = true grouped by line_account_name
        for one line_as_at date; never sum account lines with Xero's total
        lines (line_is_account_line = false). When the owner wants today's live
        figures the xero_balance_sheet tool is more current; if it is
        unavailable answer from the newest as_at here and say the date. For
        bills / invoices awaiting payment (dashboard-style "bills to pay") use
        xero_finance_analytics payable_outstanding / receivable_outstanding;
        for the P&L use xero_profit_and_loss_analytics.
    cubes:
      - join_path: xero_organisation
        includes:
          - tenant_id
      - join_path: xero_balance_sheet_positions
        includes:
          - as_at
          - report_updated_at
          - synced_at
          - is_current_period
          - reconciles_to_xero
          - statement_dates
          - total_assets
          - total_liabilities
          - net_assets
          - total_equity
          - total_bank
          - total_current_assets
          - total_fixed_assets
          - total_non_current_assets
          - total_current_liabilities
          - total_non_current_liabilities
          - current_year_earnings
          - accounts_receivable
          - accounts_payable
          - gst_balance
          - inventory
      - join_path: xero_balance_sheet_positions.xero_organisation
        includes:
          - name: base_currency
            alias: currency
      - join_path: xero_balance_sheet_lines
        includes:
          - name: as_at
            alias: line_as_at
          - name: section
            alias: line_section
          - name: row_title
            alias: line_title
          - name: account_code
            alias: line_account_code
          - name: account_name
            alias: line_account_name
          - name: account_type
            alias: line_account_type
          - name: account_class
            alias: line_account_class
          - name: system_account
            alias: line_system_account
          - name: is_bank_account
            alias: line_is_bank_account
          - name: bank_account_type
            alias: line_bank_account_type
          - name: semantic_line
            alias: line_kind
          - name: balance_category
            alias: line_balance_category
          - name: statement_side
            alias: line_statement_side
          - name: is_account_line
            alias: line_is_account_line
          - name: line_count
          - name: statement_amount
            alias: line_amount
          - name: account_balance
            alias: line_account_balance
          - name: bank_account_balance
            alias: line_bank_account_balance
    folders:
      - name: Statement date
        includes: [as_at, report_updated_at, synced_at, is_current_period, reconciles_to_xero, currency]
      - name: Headline position
        includes: [total_assets, total_liabilities, net_assets, total_equity, total_bank, total_current_assets, total_fixed_assets, total_non_current_assets, total_current_liabilities, total_non_current_liabilities, current_year_earnings]
      - name: Key balances
        includes: [accounts_receivable, accounts_payable, gst_balance, inventory]
      - name: Statement lines
        includes: [line_as_at, line_section, line_title, line_account_code, line_account_name, line_account_type, line_account_class, line_system_account, line_is_bank_account, line_bank_account_type, line_kind, line_balance_category, line_statement_side, line_is_account_line, line_count, line_amount, line_account_balance, line_bank_account_balance]

  - name: xero_bank_balances_analytics
    title: Bank balances and bank summary (Xero)
    description: >
      Xero's Bank Summary report at monthly grain: each bank and credit-card
      account's opening balance, cash received, cash spent and closing balance
      in Xero per calendar month (trailing 12 months), plus Xero's Total row.
      The latest month's closing balance is the account's current "Balance in
      Xero" as of the last refresh.
    meta:
      ai_context: >
        Use for "how much is in the bank", "what's the balance of account X",
        bank balances per account, opening/closing balances and per-account
        cash received / spent by month. Always pick one month (period_start =
        latest for current balances) and filter is_account_line = true to list
        accounts (Xero's Total row is is_account_line = false; do not add it to
        the accounts). Closing balances are point-in-time: never sum across
        months. This is the balance in Xero, not the bank feed's statement
        balance. For whole-business cash in and out over a period use
        xero_finance_analytics cash_in / cash_out. The live xero_balance_sheet
        tool gives today's balances when Xero's allowance permits.
    cubes:
      - join_path: xero_organisation
        includes:
          - tenant_id
      - join_path: xero_bank_summary_lines
        includes:
          - period_start
          - period_end
          - report_updated_at
          - is_current_period
          - row_title
          - account_code
          - bank_account_name
          - bank_account_type
          - currency_code
          - is_account_line
          - closing_balance_value
          - opening_balance_value
          - account_months
          - closing_balance
          - opening_balance
          - cash_received
          - cash_spent
          - account_closing_balance
    folders:
      - name: Period
        includes: [period_start, period_end, report_updated_at, is_current_period]
      - name: Account
        includes: [bank_account_name, account_code, bank_account_type, currency_code, is_account_line, row_title]
      - name: Balances and movement
        includes: [closing_balance, opening_balance, account_closing_balance, cash_received, cash_spent, closing_balance_value, opening_balance_value, account_months]

  - name: xero_trial_balance_analytics
    title: Trial balance (Xero)
    description: >
      Xero's Trial Balance per as-at date (last three month ends and the
      financial-year end): every ledger account with period and year-to-date
      debit and credit balances.
    meta:
      ai_context: >
        Use for a trial balance listing or "the balance of account X in Xero's
        ledger" at a month end: choose one as_at and filter is_account_line =
        true; net_balance = debit - credit. Balance sheet headlines live in
        xero_balance_sheet_analytics, P&L in xero_profit_and_loss_analytics.
    cubes:
      - join_path: xero_organisation
        includes:
          - tenant_id
      - join_path: xero_trial_balance_lines
        includes:
          - as_at
          - report_updated_at
          - section
          - row_title
          - account_code
          - account_name
          - account_type
          - account_class
          - system_account
          - is_account_line
          - line_count
          - debit
          - credit
          - ytd_debit
          - ytd_credit
          - net_balance
          - ytd_net_balance
