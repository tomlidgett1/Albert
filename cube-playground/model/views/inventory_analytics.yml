views:
  - name: inventory_analytics
    title: Inventory analytics
    description: >
      The stock surface: current stock on hand and value (at cost and at
      retail list price) per item, store and supplier, sales velocity and
      weeks of cover per position, reorder alerts, stock movement history,
      serial numbers registered to customers, inter-store transfers, customer
      special orders and stocktake variances, plus catalogue enrichment (price
      lists per price type and assembly components). Unprefixed members are
      the current stock position (item-store grain); inventory_logs_* are
      movement events; transfer_items_* / transfers_* are transfer lines and
      their documents; special_orders_*, serialized_units_* and stocktake_*
      are their own grains.
    meta:
      ai_context: >
        Use this view for "stock", "inventory", "on hand", "out of stock",
        "reorder", "stocktake", "shrinkage", "transfers" and "special orders".
        Current levels = units_on_hand / stock_value (snapshot, no time
        dimension). "Aged inventory" / "old stock" = group units_on_hand and
        stock_value by stock_age_band (or days_since_last_receipt) with the
        in_stock segment; one query gives the whole report. Age is days since
        the item's last stock-in movement at the store. "Dead stock", "slow
        movers", "items in stock with no sales in N days" = a DIFFERENT
        question: sales recency, not receipt age. Answer it in one query from
        this view: segments in_stock plus unsold_90_days / unsold_180_days /
        unsold_365_days (or filter days_since_last_sale gte N OR last_sold_at
        notSet — never-sold items have a null last_sold_at), dimensions
        items_name and categories_name (plus last_sold_at or
        sales_recency_band), measures units_on_hand and stock_value ordered by
        stock_value desc; drop the item dimensions for the category totals.
        Never present stock_age_band as "no sales". "What should we reorder",
        "what will we run out of", "how long will stock last": reorder points
        are set on only 4 of 17,251 positions for this tenant, so
        positions_below_reorder / needs_reorder answer "4" and are NOT a
        reorder list; instead rank in_stock positions by weeks_of_cover
        ascending with units_sold_90d, quantity_on_hand and
        sell_through_90d_pct (weekly_sales_rate is the trailing-90-day rate).
        Stock history = inventory_logs_* members with
        inventory_logs_occurred_at as the time dimension; movement dollars =
        inventory_logs_value_change_estimate (cost_change is never recorded),
        and shrinkage dollars = stocktake_value_adjusted (populated) rather
        than inventory_logs_net_value_change. Combine any grain with items_*,
        categories_*, manufacturers_*, vendors_*, shops_* or employees_*
        reference dimensions, but do not mix two different event grains (for
        example inventory_logs_* with transfer_items_*) in one query. Stock
        value: stock_value is at cost (ex tax); stock_retail_value is at the
        Default list price; markup_pct / stock_markup_pct compare the two.
        "Stock value by supplier" = stock_value grouped by vendors_name.
        items_default_price / items_msrp / items_online_price are the current
        list prices and sit on every stock row (no second query needed);
        item_prices_* is the raw price-list grain for "what price types does X
        have" and cannot be combined with stock members. Bundle contents use
        item_components_*. serialized_units_* are serial numbers registered to
        customers (their own bikes), not serialised stock: in_stock_serials is
        about 1 for this tenant. special_orders_created_at is the special-order
        time dimension. For a selling-price fallback on items that are unpriced,
        completed sale-line normal_unit_price / unit_price /
        average_selling_price in product_sales_analytics are observed prices,
        not catalogue truth.

    cubes:
      # items owns the view's tenant_id: every grain in this view reaches
      # items via a declared many_to_one join, so the injected tenant pin
      # never breaks join-path resolution regardless of which grain is queried.
      - join_path: items
        includes:
          - tenant_id
          - name: item_id
            alias: items_item_id
          - name: name
            alias: items_name
          - name: full_path_name
            alias: items_full_path_name
          - name: system_sku
            alias: items_system_sku
          - name: custom_sku
            alias: items_custom_sku
          - name: item_type
            alias: items_item_type
          - name: serialized
            alias: items_serialized
          - name: archived
            alias: items_archived
          - name: default_cost
            alias: items_default_cost
          - name: average_cost
            alias: items_average_cost
          - name: default_price
            alias: items_default_price
          - name: msrp
            alias: items_msrp
          - name: online_price
            alias: items_online_price
          - name: model_year
            alias: items_model_year
      - join_path: item_shops
        includes:
          - quantity_on_hand
          - sellable_quantity
          - backorder_quantity
          - reorder_point
          - reorder_level
          - average_unit_cost
          - retail_unit_price
          - markup_pct
          - stock_status
          - last_received_at
          - days_since_last_receipt
          - stock_age_band
          - last_sold_at
          - days_since_last_sale
          - weekly_sales_rate
          - weeks_of_cover
          - sell_through_90d_pct
          - sales_recency_band
          - unsold_90_days
          - unsold_180_days
          - unsold_365_days
          - snapshot_updated_at
          - units_on_hand
          - sellable_units
          - backordered_units
          - stock_value
          - stock_retail_value
          - stock_markup_pct
          - units_sold_90d
          - units_sold_365d
          - stocked_positions
          - out_of_stock_positions
          - negative_stock_positions
          - positions_below_reorder
          - distinct_items_in_stock
          - store_positions
          - in_stock
          - needs_reorder
      - join_path: items.categories
        prefix: true
        includes:
          - name
          - full_path_name
          - node_depth
      - join_path: items.manufacturers
        prefix: true
        includes:
          - name
      - join_path: items.vendors
        prefix: true
        includes:
          - name
      - join_path: shops
        prefix: true
        includes:
          - name
      - join_path: employees
        prefix: true
        includes:
          - full_name
      - join_path: inventory_logs
        prefix: true
        includes:
          - occurred_at
          - quantity_change
          - value_change
          - reason
          - is_automated
          - caused_negative_stock
          - movement_source
          - movement_count
          - units_added
          - units_removed
          - net_units_change
          - net_value_change
          - value_change_estimate
          - manual_adjustments
          - negative_stock_events
          - stock_in
          - stock_out
          - manual_movements
      - join_path: serialized_units
        prefix: true
        includes:
          - serial_number
          - unit_description
          - color_name
          - size_name
          - is_sold
          - updated_at
          - serial_count
          - sold_serials
          - in_stock_serials
          - unsold_serials
      # Transfer headers are reached through their lines so the items-rooted
      # tenant pin stays resolvable (transfers has no direct item link).
      - join_path: transfer_items.transfers
        prefix: true
        includes:
          - transfer_id
          - transfer_status
          - is_sent
          - is_received
          - archived
          - sent_at
          - needed_by
          - note
          - transfer_count
          - transfers_in_transit
          - transfers_received
          - draft_transfers
          - in_transit
      - join_path: transfer_items
        prefix: true
        includes:
          - quantity_to_send
          - quantity_sent
          - quantity_received
          - transfer_line_count
          - units_requested
          - units_sent
          - units_received
          - value_sent
          - value_received
      - join_path: special_orders
        prefix: true
        includes:
          - created_at
          - unit_quantity
          - customer_contacted
          - is_completed
          - special_order_count
          - outstanding_special_orders
          - completed_special_orders
          - awaiting_contact
          - special_order_units
          - open_special_orders
      # Stocktake grains carry short stocktake_* aliases so view-qualified SQL
      # aliases stay under Postgres's 63-character identifier limit.
      - join_path: inventory_count_calcs
        includes:
          - name: expected_quantity
            alias: stocktake_expected_quantity
          - name: counted_quantity
            alias: stocktake_counted_quantity
          - name: counted_at
            alias: stocktake_counted_at
          - name: inventory_count_id
            alias: stocktake_session_id
          - name: counted_item_count
            alias: stocktake_items_counted
          - name: expected_units
            alias: stocktake_expected_units
          - name: counted_units
            alias: stocktake_counted_units
          - name: variance_units
            alias: stocktake_variance_units
          - name: items_with_variance
            alias: stocktake_items_with_variance
      - join_path: inventory_count_items
        includes:
          - name: scanned_quantity
            alias: stocktake_scanned_quantity
          - name: scanned_at
            alias: stocktake_scanned_at
          - name: scan_count
            alias: stocktake_scan_count
          - name: scanned_units
            alias: stocktake_scanned_units
      - join_path: inventory_count_reconciles
        includes:
          - name: reconciled_at
            alias: stocktake_reconciled_at
          - name: quantity_adjustment
            alias: stocktake_qty_adjustment
          - name: value_adjustment
            alias: stocktake_value_adjustment
          - name: reconcile_count
            alias: stocktake_adjustment_count
          - name: units_adjusted
            alias: stocktake_units_adjusted
          - name: value_adjusted
            alias: stocktake_value_adjusted
      - join_path: item_prices
        prefix: true
        includes:
          - price_type
          - amount
          - price_entry_count
      - join_path: item_components
        prefix: true
        includes:
          - component_quantity
          - component_item_id
          - component_count

    folders:
      - name: Stock on hand
        includes:
          - units_on_hand
          - sellable_units
          - backordered_units
          - stock_value
          - stock_retail_value
          - stock_markup_pct
          - distinct_items_in_stock
          - stocked_positions
          - quantity_on_hand
          - average_unit_cost
          - retail_unit_price
          - markup_pct
          - stock_status
          - snapshot_updated_at
      - name: Sales velocity and cover
        includes:
          - units_sold_90d
          - units_sold_365d
          - weekly_sales_rate
          - weeks_of_cover
          - sell_through_90d_pct
          - last_sold_at
          - days_since_last_sale
          - sales_recency_band
      - name: Stock ageing
        includes:
          - stock_age_band
          - days_since_last_receipt
          - last_received_at
      - name: Reorder and availability alerts
        includes:
          - positions_below_reorder
          - out_of_stock_positions
          - negative_stock_positions
          - reorder_point
          - reorder_level
      - name: Stock movements
        includes:
          - inventory_logs_movement_count
          - inventory_logs_units_added
          - inventory_logs_units_removed
          - inventory_logs_net_units_change
          - inventory_logs_net_value_change
          - inventory_logs_value_change_estimate
          - inventory_logs_manual_adjustments
          - inventory_logs_negative_stock_events
          - inventory_logs_occurred_at
          - inventory_logs_movement_source
          - inventory_logs_reason
      - name: Stocktakes and shrinkage
        includes:
          - stocktake_items_counted
          - stocktake_expected_units
          - stocktake_counted_units
          - stocktake_variance_units
          - stocktake_items_with_variance
          - stocktake_units_adjusted
          - stocktake_value_adjusted
          - stocktake_reconciled_at
          - stocktake_scan_count
          - stocktake_scanned_units
      - name: Transfers between stores
        includes:
          - transfers_transfer_count
          - transfers_transfers_in_transit
          - transfers_transfers_received
          - transfers_draft_transfers
          - transfers_transfer_status
          - transfers_sent_at
          - transfer_items_units_sent
          - transfer_items_units_received
          - transfer_items_value_sent
          - transfer_items_value_received
      - name: Special orders
        includes:
          - special_orders_created_at
          - special_orders_special_order_count
          - special_orders_outstanding_special_orders
          - special_orders_completed_special_orders
          - special_orders_awaiting_contact
          - special_orders_special_order_units
      - name: Serialised units
        includes:
          - serialized_units_serial_count
          - serialized_units_sold_serials
          - serialized_units_in_stock_serials
          - serialized_units_serial_number
          - serialized_units_is_sold
      - name: Pricing and catalogue enrichment
        includes:
          - item_prices_price_type
          - item_prices_amount
          - item_prices_price_entry_count
          - item_components_component_quantity
          - item_components_component_count
      - name: Product and store reference
        includes:
          - items_name
          - items_full_path_name
          - items_system_sku
          - items_item_type
          - items_default_price
          - items_msrp
          - items_online_price
          - items_default_cost
          - items_average_cost
          - categories_name
          - categories_full_path_name
          - manufacturers_name
          - vendors_name
          - shops_name
          - employees_full_name
