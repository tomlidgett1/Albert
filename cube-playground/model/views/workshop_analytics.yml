views:
  - name: workshop_analytics
    title: Workshop analytics
    description: >
      The workshop / service surface: job intake, due dates, statuses, warranty
      work, labour hours, parts usage and which staff member or store the work
      belongs to. Workorder members are job grain; labour_* members are labour
      line grain; parts_* members are part-row grain. Revenue actually charged
      for workshop work lives in product_sales_analytics (is_workorder = true)
      and sales_analytics, not here.
    meta:
      ai_context: >
        Use this view for "workshop", "service", "repairs", "jobs" and "parts
        used on jobs". Default time dimension: checked_in_at. Job status =
        workorder_statuses_name. Labour HOURS are not recorded for this kind of
        setup: workorder_lines_labour_hours is entered on 10 of 24,721 lines
        (workorder_lines_labour_lines_with_hours shows the coverage), so say so
        and measure labour by revenue instead - product_sales_analytics with
        is_workorder = true and items_item_type = non_inventory (parts = item
        type default). Two staff attributions: employees_full_name is the job
        owner on the workorder, technicians_full_name is the employee on each
        labour line; they differ on about half of lines, so state which one is
        used. Combine workorder_lines_* or workorder_items_* members with job,
        store and staff dimensions freely, but not workorder_lines_* with
        workorder_items_* in one query (different grains). For workshop revenue
        use product_sales_analytics with is_workorder = true.

    cubes:
      - join_path: workorders
        includes:
          - tenant_id
          - workorder_id
          - checked_in_at
          - promised_at
          - updated_at
          - note
          - is_warranty
          - archived
          - serviced_item_description
          - serviced_item_serial
          - is_invoiced
          - workorder_count
          - open_workorders
          - closed_workorders
          - warranty_workorders
          - invoiced_workorders
          - overdue_workorders
          - avg_promised_turnaround_days
          - open_jobs
          - warranty_jobs
          - invoiced_jobs
      - join_path: workorders.workorder_statuses
        prefix: true
        includes:
          - name
          - sort_order
      - join_path: workorders.customers
        prefix: true
        includes:
          - full_name
          - company
      - join_path: workorders.employees
        prefix: true
        includes:
          - full_name
      - join_path: workorders.shops
        prefix: true
        includes:
          - name
      # Technician on each labour line, distinct from the job owner.
      - join_path: workorder_lines.employees
        includes:
          - name: full_name
            alias: technicians_full_name
      - join_path: workorder_lines
        prefix: true
        includes:
          - workorder_line_id
          - note
          - labour_hours_entry
          - unit_price_override
          - unit_quantity
          - unit_cost
          - is_done
          - is_approved
          - is_warranty
          - updated_at
          - labour_line_count
          - labour_hours
          - labour_lines_with_hours
          - lines_done
          - lines_pending
          - lines_approved
          - warranty_lines
          - labour_cost
          - done_lines
          - outstanding_lines
      - join_path: workorder_items
        prefix: true
        includes:
          - workorder_item_id
          - unit_price
          - unit_quantity
          - is_approved
          - is_warranty
          - is_special_order
          - note
          - part_line_count
          - parts_quantity
          - parts_value
          - approved_part_lines
          - special_order_part_lines
      - join_path: workorder_items.items
        prefix: true
        includes:
          - name
          - full_path_name
          - system_sku
          - item_type

    folders:
      - name: Job pipeline
        includes:
          - workorder_count
          - open_workorders
          - closed_workorders
          - overdue_workorders
          - invoiced_workorders
          - warranty_workorders
          - avg_promised_turnaround_days
          - workorder_statuses_name
          - workorder_statuses_sort_order
      - name: Job detail and timing
        includes:
          - workorder_id
          - checked_in_at
          - promised_at
          - archived
          - is_warranty
          - is_invoiced
          - serviced_item_description
          - serviced_item_serial
          - note
      - name: Labour
        includes:
          - workorder_lines_labour_line_count
          - workorder_lines_labour_hours
          - workorder_lines_labour_lines_with_hours
          - technicians_full_name
          - workorder_lines_lines_done
          - workorder_lines_lines_pending
          - workorder_lines_lines_approved
          - workorder_lines_warranty_lines
          - workorder_lines_labour_cost
          - workorder_lines_is_done
          - workorder_lines_is_approved
          - workorder_lines_note
      - name: Parts
        includes:
          - workorder_items_part_line_count
          - workorder_items_parts_quantity
          - workorder_items_parts_value
          - workorder_items_approved_part_lines
          - workorder_items_special_order_part_lines
          - workorder_items_is_special_order
          - items_name
          - items_full_path_name
          - items_system_sku
          - items_item_type
      - name: Customer, staff and store
        includes:
          - customers_full_name
          - customers_company
          - employees_full_name
          - technicians_full_name
          - shops_name
