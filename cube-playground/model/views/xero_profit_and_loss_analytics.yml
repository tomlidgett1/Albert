views:
  - name: xero_profit_and_loss_analytics
    title: Profit and Loss (Xero)
    description: >
      Authoritative monthly accrual Profit and Loss from Xero's own
      standard-layout report, landed by Fivetran. Safe headline income, cost of
      sales, gross profit, operating expense, wage, superannuation, Net Profit
      and margin measures in the organisation's base currency.
    meta:
      ai_context: >
        Use FIRST for P&L, income statement, whole-business profit/loss, income,
        cost of sales, gross profit, expenses, wages in profit and margins.
        Net Profit is Xero's reported total and ALREADY deducts wages, super,
        depreciation, interest and tax expenses; never subtract payroll again.
        Default is accrual basis. Sum monthly rows over period_start for
        quarter/FY/YTD; the current month is partial through report_updated_at.
        Use xero_profit_and_loss_account_analytics for named account rankings.
        Do not use xero_finance_analytics pnl_* members for a statement.
    cubes:
      - join_path: xero_organisation
        includes:
          - tenant_id
      - join_path: xero_profit_and_loss_periods
        includes:
          - basis
          - period_start
          - period_end
          - report_updated_at
          - synced_at
          - is_current_partial_period
          - reconciles_to_xero
          - report_periods
          - sales_revenue
          - other_income
          - total_income
          - cost_of_sales
          - gross_profit
          - operating_expenses
          - total_expenses
          - wage_expenses
          - direct_wage_expenses
          - operating_wage_expenses
          - employer_super_expenses
          - net_profit
          - net_profit_before_mapped_wages
          - gross_margin_pct
          - net_profit_margin_pct
          - net_profit_reconciliation_variance
          - gross_profit_reconciliation_variance
          - complete_periods
          - reconciled_periods
      - join_path: xero_profit_and_loss_periods.xero_organisation
        includes:
          - name: base_currency
            alias: currency
    folders:
      - name: Statement period
        includes: [period_start, period_end, basis, currency, report_updated_at, synced_at, is_current_partial_period]
      - name: Income and gross profit
        includes: [sales_revenue, other_income, total_income, cost_of_sales, gross_profit, gross_margin_pct]
      - name: Expenses and wages
        includes: [operating_expenses, total_expenses, wage_expenses, direct_wage_expenses, operating_wage_expenses, employer_super_expenses]
      - name: Net profit
        includes: [net_profit, net_profit_margin_pct, net_profit_before_mapped_wages]
      - name: Quality
        includes: [reconciles_to_xero, net_profit_reconciliation_variance, gross_profit_reconciliation_variance, report_periods]

  - name: xero_profit_and_loss_account_analytics
    title: Profit and Loss accounts (Xero)
    description: >
      Authoritative leaf account rows from Xero's monthly accrual Profit and
      Loss report. Use for expense/revenue rankings and wage-account drill-down;
      report subtotal and formula rows are excluded to prevent double counting.
    meta:
      ai_context: >
        Use for biggest expenses, income/expense accounts, rent, fees, interest,
        wages or super by month. Group statement_amount by account_name,
        account_type, profit_category or section. Wage flags come from official
        Xero report codes, not names. This view is ACCOUNT BREAKDOWN only: never
        calculate Net Profit by summing it. Headline Net/Gross Profit and margins
        live in xero_profit_and_loss_analytics. period_start is the time axis;
        amounts are accrual basis in base currency and current month is partial.
    cubes:
      - join_path: xero_organisation
        includes:
          - tenant_id
      - join_path: xero_profit_and_loss_account_lines
        includes:
          - period_start
          - period_end
          - report_updated_at
          - synced_at
          - section
          - account_code
          - account_name
          - account_type
          - account_class
          - account_status
          - reporting_code
          - reporting_code_name
          - profit_category
          - is_wage_expense
          - is_direct_wage_expense
          - is_employer_super_expense
          - account_lines
          - statement_amount
          - sales_revenue
          - other_income
          - cost_of_sales
          - operating_expenses
          - wage_expenses
          - employer_super_expenses
      - join_path: xero_profit_and_loss_account_lines.xero_organisation
        includes:
          - name: base_currency
            alias: currency
    folders:
      - name: Account
        includes: [account_code, account_name, account_type, account_class, account_status, reporting_code, reporting_code_name, profit_category]
      - name: Period
        includes: [period_start, period_end, currency, report_updated_at, synced_at]
      - name: Amounts
        includes: [statement_amount, sales_revenue, other_income, cost_of_sales, operating_expenses, wage_expenses, employer_super_expenses, account_lines]
      - name: Employment mapping
        includes: [is_wage_expense, is_direct_wage_expense, is_employer_super_expense]
