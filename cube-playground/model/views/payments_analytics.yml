views:
  - name: payments_analytics
    title: Payments analytics
    description: >
      Tender-level surface: how customers pay (payment mix), tips, refund
      tenders, card charge outcomes and card processing fees. Fact grain is one
      row per payment event on completed, non-voided sales; card charge and
      processing-fee members ride on their own event grains.
    meta:
      ai_context: >
        Use for payment mix, tips, card acceptance and fee-cost questions.
        Default time dimension: completed_at (or charges_charged_at /
        fees_processed_at for card events). Tender is tax-inclusive money
        movement, not merchandise revenue. Card acceptance cost = fees_total_fees
        (fixed + variable), never fees_processed_payment_amount.

    cubes:
      - join_path: sale_payments
        includes:
          - tenant_id
          - sale_payment_id
          - sale_id
          - created_at
          - completed_at
          - sale_completed
          - sale_voided
          - archived
          - remote_reference
          - is_refund_tender
          - payment_count
          - tender_total
          - tips_total
          - refund_tender_total
          - average_payment_amount
          - active_payments
          - refund_tenders
      - join_path: sale_payments.payment_types
        prefix: true
        includes:
          - payment_type_id
          - name
          - type
          - archived
          - internal_reserved
          - requires_customer
      - join_path: sale_payments.shops
        prefix: true
        includes:
          - name
      - join_path: sale_payments.registers
        prefix: true
        includes:
          - name
      - join_path: sale_payments.employees
        prefix: true
        includes:
          - full_name
      - join_path: sale_payments.credit_accounts
        prefix: true
        includes:
          - name
          - is_gift_card
      - join_path: cc_charges
        prefix: true
        includes:
          - cc_charge_id
          - sale_id
          - charged_at
          - declined
          - voided
          - auth_only
          - entry_method
          - cardholder_name
          - charge_count
          - approved_charge_count
          - declined_charge_count
          - decline_rate_pct
          - charged_amount
          - refunded_amount
      - join_path: processing_fees
        prefix: true
        includes:
          - processing_fee_id
          - sale_payment_id
          - processor
          - processed_at
          - variable_rate_pct
          - fee_record_count
          - total_fees
          - fixed_fees
          - variable_fees
          - interchange_fees
          - scheme_fees
          - processed_payment_amount
          - effective_fee_rate_pct
      - join_path: sale_accounts
        prefix: true
        includes:
          - sale_account_id
          - credit_account_id
          - entry_kind
          - entry_count

    folders:
      - name: Payment mix
        includes:
          - payment_count
          - tender_total
          - average_payment_amount
          - payment_types_name
          - payment_types_type
      - name: Tips and refunds
        includes:
          - tips_total
          - refund_tender_total
          - is_refund_tender
      - name: Card charges
        includes:
          - cc_charges_charge_count
          - cc_charges_approved_charge_count
          - cc_charges_declined_charge_count
          - cc_charges_decline_rate_pct
          - cc_charges_charged_amount
          - cc_charges_refunded_amount
          - cc_charges_entry_method
          - cc_charges_charged_at
      - name: Processing fees
        includes:
          - processing_fees_total_fees
          - processing_fees_fixed_fees
          - processing_fees_variable_fees
          - processing_fees_interchange_fees
          - processing_fees_scheme_fees
          - processing_fees_effective_fee_rate_pct
          - processing_fees_processor
          - processing_fees_processed_at
      - name: On-account activity
        includes:
          - sale_accounts_entry_count
          - sale_accounts_entry_kind
          - credit_accounts_name
          - credit_accounts_is_gift_card
      - name: Stores and staff
        includes:
          - shops_name
          - registers_name
          - employees_full_name
