        sql: tenant_id
        type: string
        public: false
      - name: leave_rule_id
        sql: leave_rule_id
        type: number
        public: false
      - name: rule_name
        sql: rule_name
        type: string
        title: Leave type
        description: The kind of leave (Annual Leave, Sick Leave, Time Off In Lieu...).
