cubes:
  # ---------------------------------------------------------------------------
  # Deputy (workforce management) staging cubes.
  #
  # Source: source_deputy.dp_* views, which stamp tenant_id, enforce the
  # capability check and normalise Deputy's API fields to snake_case. Field
  # semantics follow the Deputy Resource API (developer.deputy.com):
  # a Timesheet is actual worked (or leave) time, a Roster is a scheduled
  # shift, Leave is a request spanning one or more days.
  #
  # TIMESTAMP TRAP (Fivetran re-types columns without warning). These dp_*
  # columns are VARCHAR today and MUST be cast with ::timestamptz wherever
  # they are compared, filtered, bucketed or coalesced - uncast, every time
  # filter fails with "operator does not exist: character varying >=
  # timestamp with time zone" (15 production failures on 2026-09-01):
  #   source_deputy.dp_rosters : shift_date, starts_at, ends_at,
  #                              created_at, modified_at         (varchar)
  #   (raw source_deputy_fivetran.roster: date, start_time_localized,
  #    end_time_localized, created, modified, meal_break are varchar; the
  #    "<name>-deprecated-<uuid>" timestamptz columns beside them are dead.
  #    Values arrive in two renderings, '2026-08-10T00:00:00+10:00' and
  #    '2026-08-02 14:00:00+00' - both are instants, so ::timestamptz is the
  #    right cast; never trust the string's own offset or compare as text.)
  # Every other dp_* time column is a real timestamptz / date today:
  #   dp_timesheets : shift_date, started_at, ended_at, created_at, modified_at
  #   dp_employees  : started_on, terminated_on, created_at, modified_at
  #   dp_leave      : starts_on, ends_on, created_at, modified_at
  #   dp_leave_days : leave_day, starts_on_local, ends_on_local
  # When the next re-type lands, information_schema.columns for
  # table_schema = 'source_deputy' shows the new varchar: add the cast here and
  # in deputy_efficiency.yml, and extend
  # tests/contracts/deputy-roster-instants.contract.test.ts.
  #
  # TIME ZONE: weekday and hour-of-day members render instants in the
  # Postgres session time zone, which cube.js pins to the business zone
  # (storeTimezone = ALBERT_CUBE_SESSION_TIMEZONE, ADR 0107). Cube converts
  # only `time` dimensions itself, so string/number members make the session
  # rendering explicit with AT TIME ZONE current_setting('TimeZone') rather
  # than hard-coding a zone.
  #
  # TENANT HUB: deputy_business is one row per tenant. Every Deputy fact and
  # reference cube joins to it on tenant_id alone so the view-level tenant pin
  # (queryRewrite adds `<view>.tenant_id = ...`) resolves for grains with no
  # staff member - the daily labour-to-sales bridge and unfilled open shifts.
  # Facts never join to each other; the shift reconciliation cube in
  # deputy_efficiency.yml is the only grain that holds rosters and timesheets.
  # ---------------------------------------------------------------------------

  - name: deputy_business
    title: Deputy business (tenant hub)
    public: false
    description: >
      One row per connected Deputy business (tenant). Internal join hub that
      owns workforce_analytics.tenant_id; it carries no business attributes.
    sql: >
      SELECT hub.tenant_id, hub.tenant_id AS row_key
      FROM (
        SELECT tenant_id FROM source_deputy.dp_companies
        UNION
        SELECT tenant_id FROM source_deputy.dp_employees
      ) hub
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false

  - name: deputy_employees
    title: Staff (Deputy)
    public: false
    description: >
      One row per person in Deputy, the workforce management system: name,
      position, whether they are an active team member, and their start and
      termination dates. This is the authoritative staff roster for hours,
      rosters and leave.
    meta:
      ai_context: >
        The staff list for workforce questions. "Team", "staff", "employees"
        by name resolve here via display_name. active = true means currently
        employed. "How many staff started / left in <period>" =
        started_staff_count with started_on (terminated_staff_count with
        terminated_on) as the time dimension. Names may differ slightly from
        the Lightspeed POS staff list (e.g. "Thomas" vs "Tom"); match
        colloquially per tool, never join across tools by exact string.
    sql: SELECT * FROM source_deputy.dp_employees

    joins:
      - name: deputy_business
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_business}.tenant_id
      - name: deputy_employee_roles
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_employee_roles}.tenant_id
          AND {CUBE}.role_id = {deputy_employee_roles}.role_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: employee_id
        sql: employee_id
        type: number
        public: false
      - name: display_name
        sql: display_name
        type: string
        title: Staff member
        description: The person's display name in Deputy.
      - name: position
        sql: position
        type: string
        description: Job title / position recorded in Deputy, when set.
      - name: active
        sql: active
        type: boolean
        title: Currently employed
        description: True while the person is an active team member in Deputy.
      - name: started_on
        sql: started_on
        type: time
        description: Employment start date, when recorded in Deputy.
      - name: terminated_on
        sql: terminated_on
        type: time
        description: Termination date; null while still employed.

    measures:
      - name: staff_count
        type: count
        title: Staff members
        description: Number of people on the Deputy staff list (including former staff).
      - name: active_staff_count
        type: count
        title: Active staff
        description: People currently employed (active in Deputy).
        filters:
          - sql: "{CUBE}.active"
      - name: started_staff_count
        type: count
        title: Staff started
        description: People with a recorded Deputy start date; date-range it on started_on to count starters in a period.
        meta:
          ai_context: >
            "How many staff started in <period>" = this measure with
            started_on as the time dimension / date range. Only people
            with a recorded start date count.
        filters:
          - sql: "{CUBE}.started_on IS NOT NULL"
      - name: terminated_staff_count
        type: count
        title: Staff terminated
        description: People with a Deputy termination date; date-range it on terminated_on to count leavers in a period.
        meta:
          ai_context: >
            "How many staff left / were terminated in <period>" = this
            measure with terminated_on as the time dimension / date range.
        filters:
          - sql: "{CUBE}.terminated_on IS NOT NULL"

  - name: deputy_employee_roles
    title: Staff roles (Deputy)
    public: false
    description: One row per Deputy permission role (System Administrator, Employee...).
    sql: SELECT * FROM source_deputy.dp_employee_roles
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: role_id
        sql: role_id
        type: number
        public: false
      - name: role_name
        sql: role_name
        type: string
        title: Deputy role
        description: Deputy access role (an access level, not a job title).

  - name: deputy_operational_units
    title: Work areas (Deputy)
    public: false
    description: >
      One row per Deputy operational unit: the area / location shifts are
      scheduled against (for example "Retail" or "RACE DAY"), with its parent
      company (workplace).
    sql: SELECT * FROM source_deputy.dp_operational_units
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: operational_unit_id
        sql: operational_unit_id
        type: number
        public: false
      - name: unit_name
        sql: unit_name
        type: string
        title: Work area
        description: The area / department shifts are worked in.
      - name: company_name
        sql: company_name
        type: string
        title: Workplace
        description: The workplace (location) this area belongs to.
      - name: active
        sql: active
        type: boolean

  - name: deputy_timesheets
    title: Timesheets (Deputy, actual worked time)
    public: false
    description: >
      One row per Deputy timesheet: actual time a staff member worked (or took
      as leave when is_leave is true). paid_hours is Deputy's TotalTime: the
      hours paid for the shift, i.e. clock-on to clock-off net of unpaid meal
      breaks. wage_cost is Deputy's Cost field: the shift priced at the
      employee's contract pay rate, 0 when the employee has no pay rate in
      Deputy (an uncosted shift); loaded_cost is Deputy's OnCost field and
      equals wage_cost when no on-cost rules are configured. Voided
      (discarded) timesheets are excluded at source. time_approved and
      pay_approved track the two-step supervisor approval.
    meta:
      ai_context: >
        The authoritative record of hours actually worked. "Hours worked",
        "how many hours did X do" = hours_worked; "wage cost", "labour cost"
        = wage_cost, grouped by employee_name or unit_name, with shift_date
        as the business date. WAGE COST BASIS: Deputy wage cost is the
        operational roster/timesheet estimate - costed shifts only, at the
        pay rate on the employee's Deputy contract, no superannuation or
        on-costs (loaded_wage_cost equals wage_cost when Deputy has no
        on-cost rules, as for this tenant). Staff with no Deputy pay rate
        work uncosted shifts: hours_worked counts them, wage_cost does not,
        so quote costed_hours / uncosted_hours with any wage total and use
        avg_hourly_wage_cost (worked wage cost / costed hours) for an hourly
        rate. The paid wage bill lives in Xero
        (xero_profit_and_loss_analytics wage_expenses +
        employer_super_expenses); never present one as the other.
        PAY RULES: no overtime rule exists in this Deputy - never infer
        overtime from shift length. Pay rates are day-type loadings
        (Weekday / Saturday / Sunday / Public Holiday rates), so weekend
        loading questions group by shift_weekday; the pay rule itself is not
        exposed as a dimension. Worked hours by hour of day = hours_worked
        grouped by start_hour_of_day (each shift counts at its clock-on
        hour; hour-by-hour coverage across a shift is not modelled).
        Leave-generated timesheets are excluded from hours_worked and
        worked_wage_cost (paid_hours_total / leave_hours_paid / wage_cost
        include them). For scheduled shifts use deputy_rosters; for
        roster-vs-actual per shift use deputy_shift_reconciliation; for
        leave requests deputy_leave. FRESHNESS: timesheets land through a
        daily sync, so the newest one or two days can be missing - say so
        when a recent day looks empty.
    sql: SELECT * FROM source_deputy.dp_timesheets

    joins:
      - name: deputy_business
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_business}.tenant_id
      - name: deputy_employees
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_employees}.tenant_id
          AND {CUBE}.employee_id = {deputy_employees}.employee_id
      - name: deputy_operational_units
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_operational_units}.tenant_id
          AND {CUBE}.operational_unit_id = {deputy_operational_units}.operational_unit_id
      - name: deputy_leave_rules
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_leave_rules}.tenant_id
          AND {CUBE}.leave_rule_id = {deputy_leave_rules}.leave_rule_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: timesheet_id
        sql: timesheet_id
        type: number
        public: false
      - name: employee_id
        sql: employee_id
        type: number
        public: false
      - name: employee_name
        sql: employee_name
        type: string
        title: Staff member
        description: Display name of the person who worked the shift.
      - name: shift_date
        sql: shift_date
        type: time
        title: Shift date
        description: The date of the shift. Business date for hours and wage analysis.
      - name: started_at
        sql: started_at
        type: time
        description: When the shift started (local time).
      - name: ended_at
        sql: ended_at
        type: time
        description: When the shift ended (local time). Null while still on shift.
      - name: shift_hours
        sql: paid_hours
        type: number
        title: Shift length (paid hours)
        description: Paid hours on this single timesheet (clock-on to clock-off net of unpaid meal breaks). A per-shift attribute; use hours_worked for totals.
      - name: is_leave
        sql: is_leave
        type: boolean
        title: Leave timesheet
        description: True when this timesheet was generated by a leave request rather than worked time.
      - name: time_approved
        sql: time_approved
        type: boolean
        description: True once a supervisor approved the time component.
      - name: pay_approved
        sql: pay_approved
        type: boolean
        description: True once the timesheet is approved for payroll export.
      - name: in_progress
        sql: in_progress
        type: boolean
        title: Currently on shift
        description: True while the employee is clocked on and the timesheet is still open.
      - name: unit_name
        sql: unit_name
        type: string
        title: Work area
        description: The Deputy area / department the shift was worked in.
      - name: company_name
        sql: company_name
        type: string
        title: Workplace
        description: The workplace (location) of the shift.
      # Weekday / hour members render the timestamptz instant in the pinned
      # session (business) time zone; see the TIME ZONE note at the top.
      - name: shift_weekday
        sql: "to_char(({CUBE}.shift_date AT TIME ZONE current_setting('TimeZone')), 'FMDay')"
        type: string
        title: Day of week
        description: Weekday name of the shift date (Monday ... Sunday) in the business time zone. Group by this for "which day do we work the most hours".
      - name: shift_weekday_number
        sql: "EXTRACT(ISODOW FROM ({CUBE}.shift_date AT TIME ZONE current_setting('TimeZone')))"
        type: number
        title: Day of week (1 = Monday)
        description: ISO weekday number, for ordering weekday breakdowns Monday to Sunday.
      - name: start_hour_of_day
        sql: "EXTRACT(HOUR FROM ({CUBE}.started_at AT TIME ZONE current_setting('TimeZone')))"
        type: number
        title: Clock-on hour (0-23)
        description: Hour of the day (store local time, 0-23) the shift was clocked on.
        meta:
          ai_context: >
            Worked hours by hour of day = group hours_worked by
            start_hour_of_day; each shift counts at its clock-on hour,
            hour-by-hour coverage across a shift is not modelled.

    measures:
      - name: hours_worked
        type: sum
        sql: paid_hours
        title: Hours worked
        description: >
          Total paid hours actually worked (net of unpaid meal breaks;
          leave-generated timesheets excluded). Includes uncosted shifts.
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false)"
      - name: paid_hours_total
        type: sum
        sql: paid_hours
        title: Paid hours (incl. leave)
        description: Total paid hours including paid leave timesheets.
      - name: leave_hours_paid
        type: sum
        sql: paid_hours
        title: Leave hours (from timesheets)
        description: Paid hours on leave-generated timesheets.
        filters:
          - sql: "COALESCE({CUBE}.is_leave, false)"
      - name: wage_cost
        type: sum
        sql: wage_cost
        format: currency
        title: Wage cost
        description: >
          Deputy's cost of the timesheets at each employee's contract pay
          rate (Deputy Cost field), paid-leave timesheets included. Costed
          shifts only: shifts for staff with no pay rate in Deputy add 0, so
          this covers costed_hours, not hours_worked. No super or on-costs.
      # Filters below name the raw column (wage_cost) rather than
      # {CUBE}.wage_cost: that reference would resolve to the measure.
      - name: worked_wage_cost
        type: sum
        sql: wage_cost
        format: currency
        title: Wage cost of worked shifts
        description: wage_cost restricted to worked timesheets (leave-generated timesheets excluded).
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false)"
      - name: loaded_wage_cost
        type: sum
        sql: loaded_cost
        format: currency
        title: Wage cost incl. on-costs
        description: Deputy OnCost field. Equals wage cost when Deputy has no on-cost rules (this tenant); it never adds superannuation from payroll.
      - name: costed_hours
        type: sum
        sql: paid_hours
        title: Costed hours
        description: Worked hours on timesheets that carry a wage cost - the hours wage_cost actually covers.
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false) AND COALESCE(wage_cost, 0) > 0"
      - name: uncosted_hours
        type: sum
        sql: paid_hours
        title: Uncosted hours
        description: Worked hours on timesheets with no wage cost (the employee has no pay rate in Deputy); counted in hours_worked, absent from wage_cost.
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false) AND COALESCE(wage_cost, 0) <= 0"
      - name: uncosted_shift_count
        type: count
        title: Uncosted shifts
        description: Worked timesheets with no wage cost.
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false) AND COALESCE(wage_cost, 0) <= 0"
      - name: avg_hourly_wage_cost
        type: number
        sql: "{worked_wage_cost} / NULLIF({costed_hours}, 0)"
        format: currency
        title: Average hourly wage cost
        description: Wage cost of worked shifts divided by costed hours (uncosted hours are excluded from the denominator).
      - name: worked_shift_count
        type: count
        title: Shifts worked
        description: Number of worked timesheets (leave excluded).
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false)"
      - name: avg_shift_hours
        type: avg
        sql: paid_hours
        title: Average shift length (hours)
        description: Average paid hours per worked shift.
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false)"
      - name: unapproved_shift_count
        type: count
        title: Shifts awaiting time approval
        description: Worked timesheets whose time is not yet supervisor-approved.
        filters:
          - sql: "NOT COALESCE({CUBE}.is_leave, false) AND NOT COALESCE({CUBE}.time_approved, false)"
      - name: on_shift_now_count
        type: count
        title: Currently on shift
        description: Timesheets still open (employee clocked on right now).
        filters:
          - sql: "COALESCE({CUBE}.in_progress, false)"

    segments:
      - name: worked_shifts
        sql: "NOT COALESCE({CUBE}.is_leave, false)"
        description: Timesheets for actually worked time (excludes leave).
      - name: leave_timesheets
        sql: "COALESCE({CUBE}.is_leave, false)"
        description: Timesheets generated by leave requests.

  - name: deputy_rosters
    title: Rosters (Deputy, scheduled shifts)
    public: false
    description: >
      One row per Deputy rostered (scheduled) shift: who is meant to work,
      when, in which area, and the scheduled hours and cost. published means
      staff can see the shift; open_shift means it is unassigned and offered
      for pickup; matched_timesheet_id links to the timesheet once the shift
      was actually worked.
    meta:
      ai_context: >
        The schedule / roster. "Who is rostered on", "who works tomorrow",
        "scheduled hours", "planned labour cost" = rostered measures here,
        grouped by employee_name or unit_name, with shift_date as the
        business date. rostered_cost is Deputy's planned cost at contract
        pay rates: costed shifts only, no superannuation or on-costs (0 when
        the person has no pay rate in Deputy). Rostered hours by hour of day
        = group rostered_hours by start_hour_of_day (each shift counts at
        its start hour; hour-by-hour coverage across a shift is not
        modelled). For actual worked hours use deputy_timesheets; rostered
        vs actual per shift (late, no-show, unfilled) is
        deputy_shift_reconciliation in one query, not a two-query
        comparison.
    sql: SELECT * FROM source_deputy.dp_rosters

    joins:
      - name: deputy_business
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_business}.tenant_id
      - name: deputy_employees
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_employees}.tenant_id
          AND {CUBE}.employee_id = {deputy_employees}.employee_id
      - name: deputy_operational_units
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_operational_units}.tenant_id
          AND {CUBE}.operational_unit_id = {deputy_operational_units}.operational_unit_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: roster_id
        sql: roster_id
        type: number
        public: false
      - name: employee_id
        sql: employee_id
        type: number
        public: false
      - name: employee_name
        sql: employee_name
        type: string
        title: Staff member
        description: Who the shift is scheduled for. Null on unassigned open shifts.
      - name: shift_date
        # dp_rosters stores its instants as text; cast so time comparisons work.
        sql: "({CUBE}.shift_date)::timestamptz"
        type: time
        title: Rostered date
        description: The date of the scheduled shift.
      - name: starts_at
        sql: "({CUBE}.starts_at)::timestamptz"
        type: time
        description: Scheduled start (local time).
      - name: ends_at
        sql: "({CUBE}.ends_at)::timestamptz"
        type: time
        description: Scheduled end (local time).
      - name: scheduled_shift_length
        sql: scheduled_hours
        type: number
        title: Scheduled shift length (hours)
        description: Scheduled hours on this single rostered shift. A per-shift attribute; use the rostered_hours measure for totals.
      - name: published
        sql: published
        type: boolean
        description: True once the shift is published and visible to staff.
      - name: open_shift
        sql: open_shift
        type: boolean
        title: Open (unassigned) shift
        description: True when the shift is offered for pickup rather than assigned.
      - name: unit_name
        sql: unit_name
        type: string
        title: Work area
      - name: company_name
        sql: company_name
        type: string
        title: Workplace
        description: The workplace (location) the shift is rostered at.
      # Weekday / hour members cast the varchar instant, then render it in the
      # pinned session (business) time zone; see the notes at the top.
      - name: rostered_weekday
        sql: "to_char((({CUBE}.shift_date)::timestamptz AT TIME ZONE current_setting('TimeZone')), 'FMDay')"
        type: string
        title: Day of week
        description: Weekday name of the rostered date (Monday ... Sunday) in the business time zone. Group by this for "which day do we roster the most hours".
      - name: rostered_weekday_number
        sql: "EXTRACT(ISODOW FROM (({CUBE}.shift_date)::timestamptz AT TIME ZONE current_setting('TimeZone')))"
        type: number
        title: Day of week (1 = Monday)
        description: ISO weekday number, for ordering weekday breakdowns Monday to Sunday.
      - name: start_hour_of_day
        sql: "EXTRACT(HOUR FROM (({CUBE}.starts_at)::timestamptz AT TIME ZONE current_setting('TimeZone')))"
        type: number
        title: Rostered start hour (0-23)
        description: Hour of the day (store local time, 0-23) the rostered shift starts.
        meta:
          ai_context: >
            Rostered hours by hour of day = group rostered_hours by
            start_hour_of_day; each shift counts at its start hour,
            hour-by-hour coverage across a shift is not modelled.
      - name: shift_timing
        sql: >
          CASE
            WHEN ({CUBE}.starts_at)::timestamptz <= NOW() AND COALESCE(({CUBE}.ends_at)::timestamptz, ({CUBE}.starts_at)::timestamptz + interval '12 hours') >= NOW() THEN 'On now'
            WHEN COALESCE(({CUBE}.ends_at)::timestamptz, ({CUBE}.starts_at)::timestamptz) < NOW() THEN 'Finished'
            ELSE 'Upcoming'
          END
        type: string
        title: Shift timing
        description: >
          Relative to the current moment: 'On now' (the rostered shift covers
          right now), 'Finished' or 'Upcoming'. "Who is on shift right now" =
          today's roster with shift_timing 'On now'.

    measures:
      - name: rostered_shift_count
        type: count
        title: Rostered shifts
        description: Number of scheduled shifts.
      - name: rostered_hours
        type: sum
        sql: scheduled_hours
        title: Rostered hours
        description: Total scheduled hours.
      - name: rostered_cost
        type: sum
        sql: scheduled_cost
        format: currency
        title: Rostered wage cost
        description: >
          Deputy's planned cost of scheduled shifts at contract pay rates.
          Costed shifts only (0 for staff with no pay rate in Deputy), no
          superannuation or on-costs; equals the loaded cost when Deputy has
          no on-cost rules (this tenant).
      - name: open_shift_count
        type: count
        title: Open shifts
        description: Scheduled shifts not yet assigned to anyone.
        filters:
          - sql: "COALESCE({CUBE}.open_shift, false)"
      - name: on_now_count
        type: count
        title: Rostered on right now
        description: Rostered shifts whose scheduled span covers the current moment.
        filters:
          - sql: "({CUBE}.starts_at)::timestamptz <= NOW() AND COALESCE(({CUBE}.ends_at)::timestamptz, ({CUBE}.starts_at)::timestamptz + interval '12 hours') >= NOW()"

    segments:
      - name: open_shifts
        sql: "COALESCE({CUBE}.open_shift, false)"
        description: Unassigned shifts offered for pickup.
      - name: on_now
        sql: "({CUBE}.starts_at)::timestamptz <= NOW() AND COALESCE(({CUBE}.ends_at)::timestamptz, ({CUBE}.starts_at)::timestamptz + interval '12 hours') >= NOW()"
        description: Rostered shifts covering the current moment.

  - name: deputy_leave
    title: Leave requests (Deputy)
    public: false
    description: >
      One row per Deputy leave request: who, the date span, how many days and
      hours it represents, its approval status (Awaiting approval, Approved,
      Declined, Cancelled) and the leave type via the leave rule.
    meta:
      ai_context: >
        Leave and absence. "Who is on leave", "upcoming holidays", "annual
        leave taken" = leave measures here. status = 'Approved' is the normal
        filter for actual leave; starts_on is the business date. The leave
        type name (Annual Leave, Sick Leave...) comes from the joined leave
        rule. Leave BALANCES (accrued / remaining entitlement) are NOT
        available anywhere in Albert - Deputy exposes only leave requested,
        approved and taken - so say so rather than estimating one.
    sql: SELECT * FROM source_deputy.dp_leave

    joins:
      - name: deputy_business
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_business}.tenant_id
      - name: deputy_employees
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_employees}.tenant_id
          AND {CUBE}.employee_id = {deputy_employees}.employee_id
      - name: deputy_leave_rules
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_leave_rules}.tenant_id
          AND {CUBE}.leave_rule_id = {deputy_leave_rules}.leave_rule_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: leave_id
        sql: leave_id
        type: number
        public: false
      - name: employee_id
        sql: employee_id
        type: number
        public: false
      - name: employee_name
        sql: employee_name
        type: string
        title: Staff member
      - name: starts_on
        sql: starts_on
        type: time
        title: Leave starts
        description: First day of the leave request. Business date for leave analysis.
      - name: ends_on
        sql: ends_on
        type: time
        title: Leave ends
      - name: status
        sql: status
        type: string
        title: Approval status
        description: "Awaiting approval, Approved, Declined, Cancelled, Date approved or Pay approved."
      - name: comment
        sql: comment
        type: string
        description: Comment left with the request.

    measures:
      - name: leave_request_count
        type: count
        title: Leave requests
      - name: leave_days
        type: sum
        sql: days
        title: Leave days
        description: Total days requested (fractional for part days).
      - name: leave_hours
        type: sum
        sql: total_hours
        title: Leave hours
        description: Total hours represented by the leave requests.
      - name: approved_leave_days
        type: sum
        sql: days
        title: Approved leave days
        description: Days on requests whose status is Approved.
        filters:
          - sql: "{CUBE}.status = 'Approved'"

    segments:
      - name: approved_leave
        sql: "{CUBE}.status = 'Approved'"
        description: Leave requests that have been approved.
      - name: pending_leave
        sql: "{CUBE}.status = 'Awaiting approval'"
        description: Leave requests still awaiting approval.

  - name: deputy_leave_days
    title: Leave days (Deputy, one row per person per day on leave)
    public: false
    description: >
      Every calendar day covered by a Deputy leave request (local dates), one
      row per request per day, with the request's status and leave type. This
      is the grain for "who is on leave in <period>" - a request that starts
      in July and ends in August is on leave in both months.
    meta:
      ai_context: >
        Use for who is on leave / away on a day, in a week or month, upcoming
        leave, days of leave by type (sick, annual) in a period: filter
        leave_day to the period and status = 'Approved' (approved_* measures
        do that for you). leave_day is the business date. For request-level
        detail (days requested, comments) use deputy_leave. Leave BALANCES
        (accrued / remaining entitlement) are NOT available - only leave
        taken, requested and approved - so say so rather than estimating.
    sql: SELECT * FROM source_deputy.dp_leave_days

    joins:
      - name: deputy_business
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_business}.tenant_id
      - name: deputy_employees
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_employees}.tenant_id
          AND {CUBE}.employee_id = {deputy_employees}.employee_id
      - name: deputy_leave_rules
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_leave_rules}.tenant_id
          AND {CUBE}.leave_rule_id = {deputy_leave_rules}.leave_rule_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: leave_id
        sql: leave_id
        type: number
        public: false
      - name: employee_id
        sql: employee_id
        type: number
        public: false
      - name: employee_name
        sql: employee_name
        type: string
        title: Staff member
      - name: leave_day
        sql: leave_day
        type: time
        title: Day on leave
        description: A calendar day (local) covered by the leave request.
      - name: starts_on_local
        sql: starts_on_local
        type: time
        title: Leave starts
      - name: ends_on_local
        sql: ends_on_local
        type: time
        title: Leave ends
      - name: status
        sql: status
        type: string
        title: Approval status
        description: "Awaiting approval, Approved, Declined, Cancelled, Date approved or Pay approved."
      - name: span_days
        sql: span_days
        type: number
        title: Calendar days in request
        public: false

    measures:
      - name: leave_day_count
        type: count
        title: Person-days on leave
        description: Rows = people x days covered by leave requests in the selection (any status).
      - name: approved_leave_day_count
        type: count
        title: Approved person-days on leave
        description: People x calendar days covered by APPROVED leave in the selection.
        filters:
          - sql: "{CUBE}.status = 'Approved'"
      - name: people_on_leave
        type: count_distinct
        sql: employee_id
        title: People on leave
        description: Distinct staff with leave (any status) covering the selected days.
      - name: approved_people_on_leave
        type: count_distinct
        sql: employee_id
        title: People on approved leave
        filters:
          - sql: "{CUBE}.status = 'Approved'"
      - name: approved_leave_days_taken
        type: sum
        sql: days_per_day
        title: Approved leave days
        description: Leave days (Deputy's requested days, spread evenly across the request's span) on approved requests within the selected days.
        filters:
          - sql: "{CUBE}.status = 'Approved'"
      - name: approved_leave_hours_taken
        type: sum
        sql: hours_per_day
        title: Approved leave hours
        description: Leave hours (spread evenly across the request's span) on approved requests within the selected days.
        filters:
          - sql: "{CUBE}.status = 'Approved'"
      - name: pending_leave_day_count
        type: count
        title: Person-days awaiting approval
        filters:
          - sql: "{CUBE}.status = 'Awaiting approval'"

    segments:
      - name: approved
        sql: "{CUBE}.status = 'Approved'"
      - name: pending
        sql: "{CUBE}.status = 'Awaiting approval'"

  - name: deputy_leave_rules
    title: Leave types (Deputy)
    public: false
    description: >
      One row per Deputy leave rule: the leave type (Annual Leave, Sick Leave,
      Long Service Leave...) and whether it is paid.
    sql: SELECT * FROM source_deputy.dp_leave_rules
    dimensions:
