             NULLIF(to_jsonb(t)->>'created_at', '')::timestamptz AS cc_created_at,
             NULLIF(to_jsonb(t)->>'updated_at', '')::timestamptz AS cc_updated_at,
             NULLIF(to_jsonb(t)->>'starts_at', '')::timestamptz AS cc_starts_at,
             NULLIF(to_jsonb(t)->>'ends_at', '')::timestamptz AS cc_ends_at,
             NULLIF(to_jsonb(t)->>'total_sales', '')::numeric AS cc_total_sales,
             NULLIF(to_jsonb(t)->>'usage_limit', '')::numeric AS cc_usage_limit,
             NULLIF(to_jsonb(t)->>'async_usage_count', '')::numeric AS cc_usage_count
      FROM source_shopify.shopify_discounts t
      WHERE NOT t.tombstone
        AND NOT EXISTS (
          SELECT 1 FROM quality.shopify_connection_queryability_blocks b
          WHERE b.tenant_id=t.tenant_id AND b.connection_id=t.connection_id
        )
    joins:
      - name: shopify_shop
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {shopify_shop}.tenant_id
          AND {CUBE}.connection_id = {shopify_shop}.connection_id
    dimensions:
      - name: row_key
        sql: namespaced_source_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: connection_id
        sql: connection_id
        type: string
        public: false
      - name: discount_id
        sql: cc_discount_id
        type: string
      - name: discount_type
        sql: cc_typename
        type: string
      - name: title
        sql: "to_jsonb({CUBE})->>'title'"
        type: string
      - name: status
        sql: cc_status
        type: string
      - name: discount_classes
        sql: "COALESCE(to_jsonb({CUBE})->>'discount_classes', '[]')"
        type: string
      - name: combines_with
        sql: "COALESCE(to_jsonb({CUBE})->>'combines_with', jsonb_build_object()::text)"
        type: string
      - name: created_at
        sql: cc_created_at
        type: time
      - name: updated_at
        sql: cc_updated_at
        type: time
      - name: starts_at
        sql: cc_starts_at
        type: time
      - name: ends_at
        sql: cc_ends_at
        type: time
      - name: lifecycle
        sql: >
          CASE
            WHEN {CUBE}.cc_status IN ('EXPIRED', 'DISABLED') THEN INITCAP(LOWER({CUBE}.cc_status))
            WHEN {CUBE}.cc_starts_at IS NOT NULL AND {CUBE}.cc_starts_at > NOW() THEN 'Scheduled'
            WHEN {CUBE}.cc_ends_at IS NOT NULL AND {CUBE}.cc_ends_at < NOW() THEN 'Expired'
            ELSE 'Active'
          END
        type: string
    measures:
      - name: discount_definitions
        type: count
      - name: active_discounts
        type: count
        filters:
          - sql: >
              {CUBE}.cc_status NOT IN ('EXPIRED', 'DISABLED')
              AND ({CUBE}.cc_starts_at IS NULL OR {CUBE}.cc_starts_at <= NOW())
              AND ({CUBE}.cc_ends_at IS NULL OR {CUBE}.cc_ends_at >= NOW())
      - name: scheduled_discounts
        type: count
        filters:
          - sql: "{CUBE}.cc_starts_at > NOW()"
      - name: attributed_discount_sales
        type: sum
        sql: cc_total_sales
        format: currency
      - name: discount_uses
        type: sum
        sql: cc_usage_count
      - name: average_sales_per_use
        type: number
        sql: "{attributed_discount_sales} / NULLIF({discount_uses}, 0)"
        format: currency
      - name: remaining_usage_capacity
        type: sum
        sql: "GREATEST(COALESCE({CUBE}.cc_usage_limit, 0) - COALESCE({CUBE}.cc_usage_count, 0), 0)"
        filters:
          - sql: "{CUBE}.cc_usage_limit IS NOT NULL"
