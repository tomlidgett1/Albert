  - name: shopify_fulfillments
    title: Shopify fulfilments
    public: false
    description: One row per Shopify fulfilment with status, quantity, carrier tracking and delivery milestones.
    sql: >
      SELECT t.*,
             COALESCE(to_jsonb(t)->>'fulfillment_id', to_jsonb(t)->>'id') AS cc_fulfillment_id,
             to_jsonb(t)->>'order_id' AS cc_order_id,
             to_jsonb(t)->>'location_id' AS cc_location_id,
             UPPER(COALESCE(to_jsonb(t)->>'status', 'UNKNOWN')) AS cc_status,
             UPPER(COALESCE(to_jsonb(t)->>'display_status', 'UNKNOWN')) AS cc_display_status,
             NULLIF(to_jsonb(t)->>'total_quantity', '')::numeric AS cc_quantity,
             NULLIF(to_jsonb(t)->>'created_at', '')::timestamptz AS cc_created_at,
             NULLIF(to_jsonb(t)->>'updated_at', '')::timestamptz AS cc_updated_at,
             NULLIF(to_jsonb(t)->>'delivered_at', '')::timestamptz AS cc_delivered_at,
             NULLIF(to_jsonb(t)->>'estimated_delivery_at', '')::timestamptz AS cc_estimated_delivery_at,
             NULLIF(to_jsonb(t)->>'in_transit_at', '')::timestamptz AS cc_in_transit_at,
             (
               SELECT NULLIF(to_jsonb(o)->>'processed_at', '')::timestamptz
               FROM source_shopify.shopify_orders o
               WHERE o.tenant_id=t.tenant_id AND o.connection_id=t.connection_id
                 AND o.id=t.order_id AND NOT o.tombstone
               LIMIT 1
             ) AS cc_order_processed_at
      FROM source_shopify.shopify_fulfillments t
      WHERE NOT t.tombstone
        AND NOT EXISTS (
          SELECT 1 FROM quality.shopify_connection_queryability_blocks b
          WHERE b.tenant_id=t.tenant_id AND b.connection_id=t.connection_id
        )
        AND COALESCE(t.collection_complete, false) = false
        AND EXISTS (
          SELECT 1 FROM source_shopify.shopify_orders o
          WHERE o.tenant_id=t.tenant_id AND o.connection_id=t.connection_id
            AND o.id=t.order_id AND NOT o.tombstone
        )
    joins:
      - name: shopify_orders
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {shopify_orders}.tenant_id
          AND {CUBE}.connection_id = {shopify_orders}.connection_id
          AND {CUBE}.cc_order_id = {shopify_orders}.cc_order_id
      - name: shopify_locations
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {shopify_locations}.tenant_id
          AND {CUBE}.connection_id = {shopify_locations}.connection_id
          AND {CUBE}.cc_location_id = {shopify_locations}.cc_location_id
    dimensions:
      - name: row_key
        sql: namespaced_source_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: connection_id
        sql: connection_id
        type: string
        public: false
      - name: collection_scan_id
        sql: collection_scan_id
        type: string
        public: false
      - name: collection_complete
        sql: collection_complete
        type: boolean
        public: false
      - name: fulfillment_id
        sql: cc_fulfillment_id
        type: string
      - name: order_id
        sql: cc_order_id
        type: string
        public: false
      - name: location_id
        sql: cc_location_id
        type: string
        public: false
      - name: fulfillment_name
        sql: "to_jsonb({CUBE})->>'name'"
        type: string
      - name: status
        sql: cc_status
        type: string
      - name: display_status
        sql: cc_display_status
        type: string
      - name: service_handle
        sql: "to_jsonb({CUBE})->>'service_handle'"
        type: string
      - name: tracking_info
        sql: "COALESCE(to_jsonb({CUBE})->>'tracking_info', '[]')"
        type: string
      - name: created_at
        sql: cc_created_at
        type: time
      - name: updated_at
        sql: cc_updated_at
        type: time
      - name: in_transit_at
        sql: cc_in_transit_at
        type: time
      - name: delivered_at
        sql: cc_delivered_at
        type: time
      - name: estimated_delivery_at
        sql: cc_estimated_delivery_at
        type: time
      - name: delivery_timeliness
        sql: >
          CASE
            WHEN {CUBE}.cc_delivered_at IS NULL THEN 'Not delivered'
            WHEN {CUBE}.cc_estimated_delivery_at IS NULL THEN 'No estimate'
            WHEN {CUBE}.cc_delivered_at <= {CUBE}.cc_estimated_delivery_at THEN 'On time'
            ELSE 'Late'
          END
        type: string
    measures:
      - name: distinct_protected_subjects
        type: count_distinct
        sql: cc_order_id
        public: false
        description: "Private k-anonymity population at the distinct order subject grain."
      - name: fulfillments
        type: count
      - name: fulfilled_units
        type: sum
        sql: cc_quantity
      - name: delivered_fulfillments
        type: count
        filters:
          - sql: "{CUBE}.cc_delivered_at IS NOT NULL"
      - name: open_fulfillments
        type: count
        filters:
          - sql: "{CUBE}.cc_delivered_at IS NULL AND {CUBE}.cc_status NOT IN ('CANCELLED', 'FAILURE')"
      - name: late_deliveries
        type: count
        filters:
          - sql: >
              {CUBE}.cc_delivered_at IS NOT NULL
              AND {CUBE}.cc_estimated_delivery_at IS NOT NULL
              AND {CUBE}.cc_delivered_at > {CUBE}.cc_estimated_delivery_at
      - name: on_time_deliveries
        type: count
        filters:
          - sql: >
              {CUBE}.cc_delivered_at IS NOT NULL
              AND {CUBE}.cc_estimated_delivery_at IS NOT NULL
              AND {CUBE}.cc_delivered_at <= {CUBE}.cc_estimated_delivery_at
      - name: deliveries_with_estimate
        type: count
        filters:
          - sql: >
              {CUBE}.cc_delivered_at IS NOT NULL
              AND {CUBE}.cc_estimated_delivery_at IS NOT NULL
      - name: average_hours_to_fulfil
        type: avg
        sql: >
          EXTRACT(EPOCH FROM ({CUBE}.cc_created_at - {CUBE}.cc_order_processed_at)) / 3600.0
        filters:
          - sql: "{CUBE}.cc_created_at IS NOT NULL AND {CUBE}.cc_order_processed_at IS NOT NULL"
      - name: average_hours_to_deliver
        type: avg
        sql: "EXTRACT(EPOCH FROM ({CUBE}.cc_delivered_at - {CUBE}.cc_created_at)) / 3600.0"
        filters:
          - sql: "{CUBE}.cc_delivered_at IS NOT NULL AND {CUBE}.cc_created_at IS NOT NULL"
      - name: on_time_delivery_rate_pct
        type: number
        sql: "100.0 * {on_time_deliveries} / NULLIF({deliveries_with_estimate}, 0)"
        format: percent

