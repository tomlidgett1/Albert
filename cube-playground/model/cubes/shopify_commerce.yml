    sql: >
      SELECT t.*,
             COALESCE(to_jsonb(t)->>'discount_id', to_jsonb(t)->>'id') AS cc_discount_id,
             COALESCE(to_jsonb(t)->>'typename', to_jsonb(t)->>'type') AS cc_typename,
