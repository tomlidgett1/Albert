  - name: shopify_transactions
    title: Shopify payment transactions
    public: false
    description: One row per Shopify order transaction, including sale, capture, refund, void and gateway outcome.
    sql: >
      SELECT t.*,
             COALESCE(to_jsonb(t)->>'transaction_id', to_jsonb(t)->>'id') AS cc_transaction_id,
             to_jsonb(t)->>'order_id' AS cc_order_id,
             to_jsonb(t)->>'parent_transaction_id' AS cc_parent_transaction_id,
             UPPER(COALESCE(to_jsonb(t)->>'kind', 'UNKNOWN')) AS cc_kind,
             UPPER(COALESCE(to_jsonb(t)->>'status', 'UNKNOWN')) AS cc_status,
             to_jsonb(t)->>'location_id' AS cc_location_id,
             to_jsonb(t)->>'channel_name' AS cc_channel_name,
             to_jsonb(t)->>'source_name' AS cc_source_name,
             NULLIF(to_jsonb(t)->>'amount', '')::numeric AS cc_amount,
             COALESCE(to_jsonb(t)->>'currency_code', to_jsonb(t)->>'currency') AS cc_currency,
             NULLIF(to_jsonb(t)->>'created_at', '')::timestamptz AS cc_created_at,
             NULLIF(to_jsonb(t)->>'processed_at', '')::timestamptz AS cc_processed_at,
             COALESCE((to_jsonb(t)->>'test')::boolean, false) AS cc_test
      FROM source_shopify.shopify_transactions t
      WHERE NOT t.tombstone
        AND NOT EXISTS (
          SELECT 1 FROM quality.shopify_connection_queryability_blocks b
          WHERE b.tenant_id=t.tenant_id AND b.connection_id=t.connection_id
        )
        AND COALESCE(t.collection_complete, false) = false
        AND EXISTS (
          SELECT 1 FROM source_shopify.shopify_orders o
          WHERE o.tenant_id=t.tenant_id AND o.connection_id=t.connection_id
            AND o.id=t.order_id AND NOT o.tombstone
        )
    joins:
      - name: shopify_orders
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {shopify_orders}.tenant_id
          AND {CUBE}.connection_id = {shopify_orders}.connection_id
          AND {CUBE}.cc_order_id = {shopify_orders}.cc_order_id
    dimensions:
      - name: row_key
        sql: namespaced_source_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: connection_id
        sql: connection_id
        type: string
        public: false
      - name: collection_scan_id
        sql: collection_scan_id
        type: string
        public: false
      - name: collection_complete
        sql: collection_complete
        type: boolean
        public: false
      - name: transaction_id
        sql: cc_transaction_id
        type: string
      - name: order_id
        sql: cc_order_id
        type: string
        public: false
      - name: parent_transaction_id
        sql: cc_parent_transaction_id
        type: string
      - name: created_at
        sql: cc_created_at
        type: time
      - name: processed_at
        sql: cc_processed_at
        type: time
      - name: kind
        sql: cc_kind
        type: string
      - name: status
        sql: cc_status
        type: string
      - name: location_id
        sql: cc_location_id
        type: string
        public: false
      - name: channel_name
        sql: cc_channel_name
        type: string
      - name: source_name
        sql: cc_source_name
        type: string
      - name: gateway
        sql: "COALESCE(to_jsonb({CUBE})->>'gateway', 'Unknown')"
        type: string
      - name: payment_method
        sql: "COALESCE(to_jsonb({CUBE})->>'payment_method', 'Unknown')"
        type: string
      - name: payment_id
        sql: "to_jsonb({CUBE})->>'payment_id'"
        type: string
      - name: authorization_code
        sql: "to_jsonb({CUBE})->>'authorization_code'"
        type: string
        public: false
      - name: currency_code
        sql: cc_currency
        type: string
      - name: amount
        sql: cc_amount
        type: number
        format: currency
      - name: test
        sql: cc_test
        type: boolean
      - name: manually_capturable
        sql: "COALESCE((to_jsonb({CUBE})->>'manually_capturable')::boolean, false)"
        type: boolean
      - name: maximum_refundable
        sql: "NULLIF(to_jsonb({CUBE})->>'maximum_refundable', '')::numeric"
        type: number
        format: currency
    measures:
      - name: distinct_protected_subjects
        type: count_distinct
        sql: cc_order_id
        public: false
        description: "Private k-anonymity population at the distinct order subject grain."
      - name: transaction_count
        type: count
        filters:
          - sql: "NOT {CUBE}.cc_test"
      - name: successful_transactions
        type: count
        filters:
          - sql: "NOT {CUBE}.cc_test AND {CUBE}.cc_status = 'SUCCESS'"
      - name: failed_transactions
        type: count
        filters:
          - sql: "NOT {CUBE}.cc_test AND {CUBE}.cc_status IN ('FAILURE', 'ERROR')"
      - name: captured_amount
        type: sum
        sql: cc_amount
        format: currency
        filters:
          - sql: >
              NOT {CUBE}.cc_test AND {CUBE}.cc_status = 'SUCCESS'
              AND {CUBE}.cc_kind IN ('SALE', 'CAPTURE')
      - name: captured_transactions
        type: count
        filters:
          - sql: >
              NOT {CUBE}.cc_test AND {CUBE}.cc_status = 'SUCCESS'
              AND {CUBE}.cc_kind IN ('SALE', 'CAPTURE')
      - name: authorised_amount
        type: sum
        sql: cc_amount
        format: currency
        filters:
          - sql: >
              NOT {CUBE}.cc_test AND {CUBE}.cc_status = 'SUCCESS'
              AND {CUBE}.cc_kind = 'AUTHORIZATION'
      - name: refunded_transaction_amount
        type: sum
        sql: cc_amount
        format: currency
        filters:
          - sql: >
              NOT {CUBE}.cc_test AND {CUBE}.cc_status = 'SUCCESS'
              AND {CUBE}.cc_kind = 'REFUND'
      - name: voided_transactions
        type: count
        filters:
          - sql: "NOT {CUBE}.cc_test AND {CUBE}.cc_kind = 'VOID'"
      - name: payment_success_rate_pct
        type: number
        sql: "100.0 * {successful_transactions} / NULLIF({transaction_count}, 0)"
        format: percent
      - name: average_capture_amount
        type: number
        sql: "{captured_amount} / NULLIF({captured_transactions}, 0)"
        format: currency

