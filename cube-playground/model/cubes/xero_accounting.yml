        public: false
      - name: overpayment_id
        sql: overpayment_id
        type: string
        public: false
      - name: overpayment_type
        sql: overpayment_type
        type: string
        description: >
          RECEIVE-OVERPAYMENT means a customer overpaid us, so they hold
          credit with us. SPEND-OVERPAYMENT means we overpaid a supplier, so
          we hold credit with them. When asked "does anyone have credit",
          check BOTH directions and report which way the credit runs.
      - name: status
        sql: status
        type: string
        description: "AUTHORISED (credit still open), PAID (fully allocated or refunded) or VOIDED."
      - name: contact_id
        sql: contact_id
        type: string
        public: false
      - name: contact_name
        sql: contact_name
        type: string
      - name: occurred_on
        sql: occurred_on
        type: time
