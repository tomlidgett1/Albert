        sql: remaining_credit
        type: number
        title: Remaining credit
      - name: currency_code
        sql: currency_code
        type: string
      - name: updated_at
        sql: updated_at
        type: time
        public: false
    measures:
      - name: overpayment_count
        type: count
      - name: total_overpaid
        type: sum
        sql: total
        format: currency
      - name: total_remaining_credit
        type: sum
        sql: remaining_credit
        format: currency
        title: Remaining credit
        description: Unallocated credit still on the books. Excludes voided overpayments.
        filters:
          - sql: "{CUBE}.status <> 'VOIDED'"

