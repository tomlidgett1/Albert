  - name: xero_bank_transaction_line_items
    title: Bank transaction lines (Xero)
    public: false
    description: >
      One row per line on a Xero bank transaction, with the GL account each
      slice of the spend/receive was coded to.
    meta:
      ai_context: >
        Category-level bank activity: use total_line_amount for ex-tax spend or
        total_line_amount_including_tax for cash value, grouped by account_code
        (join xero_accounts for name). transaction_type SPEND% = outgoings,
        RECEIVE% = inflows. Filter transaction_status AUTHORISED and one currency.
    sql: >
      SELECT
        line.*,
        transaction.line_amount_types AS source_line_amount_types,
        transaction.currency_code AS source_currency_code,
        transaction.status AS transaction_status,
        CASE
          WHEN transaction.line_amount_types = 'Inclusive'
            THEN line.line_amount - COALESCE(line.tax_amount, 0)
          ELSE line.line_amount
        END AS line_amount_ex_tax,
        CASE
          WHEN transaction.line_amount_types = 'Inclusive' THEN line.line_amount
          ELSE line.line_amount + COALESCE(line.tax_amount, 0)
        END AS line_amount_including_tax
      FROM source_xero_official.xo_bank_transaction_line_items AS line
      JOIN source_xero_official.xo_bank_transactions AS transaction
        ON transaction.tenant_id = line.tenant_id
       AND transaction.bank_transaction_id = line.bank_transaction_id
    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_bank_transactions
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_bank_transactions}.tenant_id
          AND {CUBE}.bank_transaction_id = {xero_bank_transactions}.bank_transaction_id
      - name: xero_accounts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_accounts}.tenant_id
          AND {CUBE}.account_id = {xero_accounts}.account_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: line_item_id
        sql: line_item_id
        type: string
        public: false
      - name: bank_transaction_id
        sql: bank_transaction_id
        type: string
        public: false
      - name: transaction_type
        sql: transaction_type
        type: string
        description: SPEND/RECEIVE and their prepayment/overpayment variants.
      - name: transaction_status
        sql: transaction_status
        type: string
        description: AUTHORISED or DELETED; financial analysis uses AUTHORISED.
      - name: occurred_on
        sql: occurred_on
        type: time
        title: Transaction date
      - name: contact_name
        sql: contact_name
        type: string
        title: Payee / payer
      - name: bank_account_name
        sql: bank_account_name
        type: string
        title: Bank account
      - name: description
        sql: description
        type: string
      - name: quantity
        sql: quantity
        type: number
      - name: unit_amount
        sql: unit_amount
        type: number
        description: Source unit amount; tax inclusion follows line_amount_types.
      - name: line_amount_value
        sql: line_amount_ex_tax
        type: number
        title: Line amount (excl. GST)
        description: Source LineAmount normalized to exclude tax exactly once.
      - name: line_amount_including_tax_value
        sql: line_amount_including_tax
        type: number
        title: Line amount (incl. GST)
        description: Source LineAmount normalized to include tax exactly once.
      - name: source_line_amount_value
        sql: line_amount
        type: number
        public: false
      - name: line_amount_types
        sql: source_line_amount_types
        type: string
        title: Source tax basis
        description: Inclusive, Exclusive or NoTax for the parent bank transaction.
      - name: currency_code
        sql: source_currency_code
        type: string
        title: Line currency
        description: Currency of the parent bank transaction.
      - name: tax_amount_value
        sql: tax_amount
        type: number
      - name: tax_type
        sql: tax_type
        type: string
      - name: account_code
        sql: account_code
        type: string
        title: Account code
      - name: account_id
        sql: account_id
        type: string
        public: false
    measures:
      - name: line_count
        type: count
        description: Number of bank-transaction coding lines in the selection.
      - name: total_line_amount
        type: sum
        sql: line_amount_ex_tax
        format: currency
        title: Line total (excl. GST)
        description: >
          Sum normalized to exclude GST. Filter transaction_status AUTHORISED
          and one currency_code.
      - name: total_line_amount_including_tax
        type: sum
        sql: line_amount_including_tax
        format: currency
        title: Line total (incl. GST)
        description: >
          Cash-value line total normalized to include GST. Filter one currency.
      - name: total_line_tax
        type: sum
        sql: tax_amount
        format: currency
        title: GST
        description: Tax component recorded by Xero on selected bank lines.

