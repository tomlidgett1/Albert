    public: false
    description: >
      One row per Xero overpayment: money received or paid beyond what was
      owed, held as credit until allocated or refunded.
    sql: SELECT * FROM source_xero_official.xo_overpayments
    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_contacts
