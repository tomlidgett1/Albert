  - name: xero_bank_transactions
    title: Bank transactions (Xero)
    public: false
    description: >
      One row per Xero bank transaction: spend money / receive money recorded
      directly against a bank account (including overpayment and prepayment
      variants), with contact, bank account, totals, GST and reconciliation
      state. This is the day-to-day cash activity that never touches an
      invoice.
    meta:
      ai_context: >
        Direct bank activity. "Money in vs money out", "spending from the bank
        account", "cash received" = total here split by money_direction
        ('Money in' for RECEIVE types, 'Money out' for SPEND types).
        occurred_on is the business date; exclude status DELETED. Per-line GL
        coding lives in xero_bank_transaction_line_items. Payments applied to
        invoices are in xero_payments instead.
    sql: SELECT * FROM source_xero_official.xo_bank_transactions

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_contacts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_contacts}.tenant_id
          AND {CUBE}.contact_id = {xero_contacts}.contact_id
      - name: xero_accounts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_accounts}.tenant_id
          AND {CUBE}.bank_account_id = {xero_accounts}.account_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: bank_transaction_id
        sql: bank_transaction_id
        type: string
        public: false
      - name: transaction_type
        sql: transaction_type
        type: string
        description: "SPEND, RECEIVE, SPEND-OVERPAYMENT, RECEIVE-PREPAYMENT etc."
      - name: money_direction
        sql: money_direction
        type: string
        title: Direction
        description: "'Money in' or 'Money out'."
      - name: status
        sql: status
        type: string
        description: AUTHORISED or DELETED.
      - name: is_reconciled
        sql: is_reconciled
        type: boolean
        title: Reconciled
      - name: reference
        sql: reference
        type: string
      - name: contact_id
        sql: contact_id
        type: string
        public: false
      - name: contact_name
        sql: contact_name
        type: string
        title: Payee / payer
      - name: bank_account_id
        sql: bank_account_id
        type: string
        public: false
      - name: bank_account_code
        sql: bank_account_code
        type: string
        public: false
      - name: bank_account_name
        sql: bank_account_name
        type: string
        title: Bank account
      - name: occurred_on
        sql: occurred_on
        type: time
        title: Transaction date
      - name: subtotal
        sql: subtotal
        type: number
      - name: total_tax_amount
        sql: total_tax
        type: number
      - name: total_amount
        sql: total
        type: number
      - name: currency_code
        sql: currency_code
        type: string
      - name: line_amount_types
        sql: line_amount_types
        type: string
        public: false
      - name: batch_payment_id
        sql: batch_payment_id
        type: string
        public: false
      - name: overpayment_id
        sql: overpayment_id
        type: string
        public: false
      - name: updated_at
        sql: updated_at
        type: time
        public: false

    measures:
      - name: transaction_count
        type: count
        title: Bank transactions
      - name: total_value
        type: sum
        sql: total
        format: currency
        title: Total value
      - name: money_in
        type: sum
        sql: total
        format: currency
        title: Money in
        filters:
          - sql: "{CUBE}.transaction_type LIKE 'RECEIVE%' AND {CUBE}.status <> 'DELETED'"
      - name: money_out
        type: sum
        sql: total
        format: currency
        title: Money out
        filters:
          - sql: "{CUBE}.transaction_type LIKE 'SPEND%' AND {CUBE}.status <> 'DELETED'"
      - name: gst_total
        type: sum
        sql: total_tax
        format: currency
        title: GST
      - name: unreconciled_count
        type: count
        title: Unreconciled transactions
        filters:
          - sql: "NOT COALESCE({CUBE}.is_reconciled, false) AND {CUBE}.status <> 'DELETED'"

    segments:
      - name: money_in_transactions
        sql: "{CUBE}.transaction_type LIKE 'RECEIVE%'"
      - name: money_out_transactions
        sql: "{CUBE}.transaction_type LIKE 'SPEND%'"

