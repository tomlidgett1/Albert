  - name: xero_pnl_lines
    title: Profit and loss lines (Xero)
    public: false
    description: >
      The derived profit-and-loss ledger: every financially-real line coded to
      a REVENUE or EXPENSE class account, unioned from invoice/bill lines,
      spend/receive bank transaction lines, posted manual journal lines and
      credit note lines. Amounts are GST-exclusive. revenue_amount is positive
      when earned, expense_amount positive when incurred, and profit_impact is
      the signed effect on net profit (revenue minus expense).
    meta:
      ai_context: >
        THE source for P&L, profit, net income, margin, and revenue or expense
        by account questions. Do not assemble a P&L from invoice lines alone:
        most trading activity here is posted via journals and bank
        transactions. total_revenue, total_expenses and net_profit over a date
        range on occurred_on give the P&L; group by account_name or
        account_type for the statement rows. IMPORTANT CAVEAT: wage, super and
        payroll tax costs are posted by Xero's system payroll journals, which
        this organisation's API access cannot expose, so they are ABSENT from
        these lines. For a complete P&L, take wages/super from
        xero_payroll_analytics pay runs and present them as a separate labour
        line, and say so. Depreciation auto-journals are similarly absent
        unless posted manually.
    sql: SELECT * FROM source_xero_official.xo_pnl_lines

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: source_kind
        sql: source_kind
        type: string
        title: Source document type
        description: "invoice_line, bank_line, journal_line or credit_note_line."
      - name: occurred_on
        sql: occurred_on
        type: time
        title: Date
        description: The document or journal date (the business date for the P&L).
      - name: contact_name
        sql: contact_name
        type: string
        title: Contact
        description: Customer or supplier where the source document carries one; null on journals.
      - name: description
        sql: description
        type: string
        title: Line description
      - name: account_code
        sql: account_code
        type: string
        title: Account code
      - name: account_name
        sql: account_name
        type: string
        title: Account
        description: The chart-of-accounts name the line is coded to (a P&L statement row).
      - name: account_class
        sql: account_class
        type: string
        title: Account class
        description: REVENUE or EXPENSE (only P&L accounts appear here).
      - name: account_type
        sql: account_type
        type: string
        title: Account type
        description: "REVENUE, SALES, OTHERINCOME, EXPENSE, DIRECTCOSTS, OVERHEADS or DEPRECIATN: use for gross-profit style groupings."
      - name: reporting_code
        sql: reporting_code
        type: string
        title: Reporting code
        description: Xero's statutory reporting code for the account, when set.

    measures:
      - name: pnl_line_count
        type: count
        title: P&L line count
      - name: total_revenue
        sql: revenue_amount
        type: sum
        format: currency
        title: Revenue
        description: GST-exclusive revenue earned (REVENUE-class lines, credits positive).
      - name: total_expenses
        sql: expense_amount
        type: sum
        format: currency
        title: Expenses
        description: GST-exclusive expenses incurred (EXPENSE-class lines, debits positive). Excludes system-posted wages; see ai_context.
      - name: net_profit
        sql: profit_impact
        type: sum
        format: currency
        title: Net profit
        description: Revenue minus expenses across the selected lines (before system-posted wages and depreciation).

  - name: xero_gst_lines
    title: GST lines (Xero)
    public: false
    description: >
      Every tax-bearing document line: GST on invoices, bills, spend/receive
      bank transactions and credit notes, split into gst_collected (on income
      documents) and gst_paid (on purchases, including capital/asset purchases).
      Credit notes reverse their document direction.
    meta:
      ai_context: >
        Source for GST collected vs GST paid and net GST over a period
        (occurred_on), by tax_type, account or contact. IMPORTANT CAVEATS:
        this is derived from document lines, not the BAS. GST paid on
        purchases is reliable. GST collected is UNDERSTATED for this business
        because register sales are posted via system journals that carry no
        GST breakdown, so always disclose that GST collected here only covers
        directly invoiced sales and the true BAS position comes from their
        bookkeeper or Xero's GST return. The organisation's GST basis (cash
        vs accruals) is on xero_organisation.
    sql: SELECT * FROM source_xero_official.xo_gst_lines
    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: source_kind
        sql: source_kind
        type: string
        title: Source document type
        description: "invoice_line, bank_line or credit_note_line."
      - name: occurred_on
        sql: occurred_on
        type: time
        title: Date
      - name: contact_name
        sql: contact_name
        type: string
        title: Contact
      - name: description
        sql: description
        type: string
        title: Line description
      - name: tax_type
        sql: tax_type
        type: string
        title: Tax type
        description: "Xero tax type code, e.g. INPUT (GST on purchases), OUTPUT (GST on income)."
      - name: account_code
        sql: account_code
        type: string
        title: Account code
      - name: account_name
        sql: account_name
        type: string
        title: Account
      - name: account_class
        sql: account_class
        type: string
        title: Account class
        description: Any class can appear here, including ASSET (GST on capital purchases is claimable).
    measures:
      - name: gst_line_count
        type: count
        title: GST line count
      - name: total_taxable_amount
        sql: taxable_amount
        type: sum
        format: currency
        title: Taxable amount
        description: GST-exclusive value of the underlying lines.
      - name: total_gst_collected
        sql: gst_collected
        type: sum
        format: currency
        title: GST collected
        description: GST charged on sales invoices and money received (understated when sales post via journals; disclose).
      - name: total_gst_paid
        sql: gst_paid
        type: sum
        format: currency
        title: GST paid
        description: GST paid on bills, spend money and capital purchases (claimable input credits).
      - name: total_net_gst
        sql: net_gst
        type: sum
        format: currency
        title: Net GST
        description: GST collected minus GST paid across the selected lines.
