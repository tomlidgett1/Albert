  - name: xero_contacts
    title: Contacts (Xero customers and suppliers)
    public: false
    description: >
      One row per Xero contact: customers and suppliers with their live AR/AP
      balances (outstanding and overdue), payment terms and status.
    meta:
      ai_context: >
        The customer/supplier list. "Who owes me money", "top debtors" =
        receivable_outstanding / receivable_overdue (is_customer = true).
        "Who do I owe" = payable_outstanding / payable_overdue (is_supplier =
        true). Balances are Xero's live totals at scrape time. Contact names
        here may differ from names in other tools (Deputy, Lightspeed); never
        join across tools by exact string.
    sql: SELECT * FROM source_xero_official.xo_contacts

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: contact_id
        sql: contact_id
        type: string
        public: false
      - name: contact_name
        sql: contact_name
        type: string
        title: Contact
      - name: first_name
        sql: first_name
        type: string
        public: false
      - name: last_name
        sql: last_name
        type: string
        public: false
      - name: email
        sql: email
        type: string
        public: false
      - name: contact_number
        sql: contact_number
        type: string
        public: false
      - name: status
        sql: status
        type: string
        description: ACTIVE or ARCHIVED.
      - name: is_customer
        sql: is_customer
        type: boolean
        title: Is a customer
        description: True once the contact has been invoiced.
      - name: is_supplier
        sql: is_supplier
        type: boolean
        title: Is a supplier
        description: True once a bill has been received from the contact.
      - name: default_currency
        sql: default_currency
        type: string
        description: >
          Contact's default document currency. Xero's contact balance snapshot
          is not converted to organisation base currency.
      - name: receivable_outstanding_value
        sql: receivable_outstanding
        type: number
        title: Receivable outstanding
        description: Current amount this contact owes, in default_currency.
      - name: receivable_overdue_value
        sql: receivable_overdue
        type: number
        title: Receivable overdue
        description: Current overdue amount this contact owes, in default_currency.
      - name: payable_outstanding_value
        sql: payable_outstanding
        type: number
        title: Payable outstanding
        description: Current amount owed to this contact, in default_currency.
      - name: payable_overdue_value
        sql: payable_overdue
        type: number
        title: Payable overdue
        description: Current overdue amount owed to this contact, in default_currency.
      - name: sales_payment_terms_day
        sql: sales_payment_terms_day
        type: number
        public: false
      - name: sales_payment_terms_type
        sql: sales_payment_terms_type
        type: string
        public: false
      - name: bills_payment_terms_day
        sql: bills_payment_terms_day
        type: number
        public: false
      - name: bills_payment_terms_type
        sql: bills_payment_terms_type
        type: string
        public: false
      - name: updated_at
        sql: updated_at
        type: time
        public: false
    measures:
      - name: contact_count
        type: count
        title: Contacts
        description: Number of Xero contact records in the selection.
      - name: customer_count
        type: count
        title: Customers
        description: Contacts Xero marks as customers because they have sales activity.
        filters:
          - sql: "COALESCE({CUBE}.is_customer, false)"
      - name: supplier_count
        type: count
        title: Suppliers
        description: Contacts Xero marks as suppliers because they have purchase activity.
        filters:
          - sql: "COALESCE({CUBE}.is_supplier, false)"
      - name: total_receivable_outstanding
        type: sum
        sql: receivable_outstanding
        format: currency
        title: Total owed by customers
        description: >
          Sum of Xero's current receivable snapshot. Valid only within one
          contact default currency; Xero does not base-convert these balances.
      - name: total_receivable_overdue
        type: sum
        sql: receivable_overdue
        format: currency
        title: Overdue owed by customers
        description: Sum of overdue receivable snapshot amounts within one contact currency.
      - name: total_payable_outstanding
        type: sum
        sql: payable_outstanding
        format: currency
        title: Total owed to suppliers
        description: >
          Sum of Xero's current payable snapshot. Valid only within one contact
          default currency; supplier credits may reduce this below bill totals.
      - name: total_payable_overdue
        type: sum
        sql: payable_overdue
        format: currency
        title: Overdue owed to suppliers
        description: Sum of overdue payable snapshot amounts within one contact currency.
    segments:
      - name: customers
        sql: "COALESCE({CUBE}.is_customer, false)"
      - name: suppliers
        sql: "COALESCE({CUBE}.is_supplier, false)"
      - name: active_contacts
        sql: "{CUBE}.status = 'ACTIVE'"

