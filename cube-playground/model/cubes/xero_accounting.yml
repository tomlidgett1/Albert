cubes:
  # ---------------------------------------------------------------------------
  # Xero accounting cubes: the transactional finance surface.
  #
  # Source: source_xero_official.xo_* views over the XER_OFFICIAL raw ingest.
  # Views stamp tenant_id, enforce the capability check, snake_case Xero's
  # PascalCase fields and parse the legacy /Date(ms)/ timestamps. Field
  # semantics follow the official Xero Accounting API docs.
  #
  # Document model recap: an Invoice is either a sales invoice (ACCREC, money
  # owed to the business) or a bill (ACCPAY, money the business owes).
  # Payments settle invoices; credit notes offset them via allocations. Bank
  # transactions are spend/receive money recorded directly against a bank
  # account. Manual journals are direct GL postings.
  # ---------------------------------------------------------------------------

  - name: xero_invoices
    title: Invoices and bills (Xero)
    public: false
    description: >
      One row per Xero invoice document: sales invoices (type ACCREC, revenue,
      money owed to the business) and bills (type ACCPAY, expenses, money the
      business owes suppliers). Carries issue/due dates, totals, GST, amounts
      due/paid/credited and status (DRAFT, SUBMITTED, AUTHORISED, PAID, VOIDED,
      DELETED).
    meta:
      ai_context: >
        The core AR/AP surface. "Revenue invoiced", "sales invoices", "what do
        customers owe me", "debtors" = document_kind 'Sales invoice'
        (invoice_type ACCREC). "Bills", "what do I owe suppliers", "creditors"
        = document_kind 'Bill' (ACCPAY). Money still owing = amount_due with
        status AUTHORISED; exclude DRAFT/DELETED/VOIDED for financial totals.
        Overdue and ageing questions use days_overdue / ageing_band (derived
        from due_on and amount_due; Xero's aged reports API is not available).
        issued_on is the business date. For per-line account/item breakdowns
        use xero_invoice_line_items.
    sql: SELECT * FROM source_xero_official.xo_invoices

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_contacts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_contacts}.tenant_id
          AND {CUBE}.contact_id = {xero_contacts}.contact_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: invoice_id
        sql: invoice_id
        type: string
        public: false
      - name: invoice_number
        sql: invoice_number
        type: string
        title: Invoice number
        description: The user-facing invoice or bill number.
      - name: invoice_type
        sql: invoice_type
        type: string
        title: Invoice type code
        description: "ACCREC = sales invoice (receivable); ACCPAY = bill (payable)."
      - name: document_kind
        sql: document_kind
        type: string
        title: Document kind
        description: "'Sales invoice' or 'Bill' (human-readable invoice_type)."
      - name: reference
        sql: reference
        type: string
        description: Free-text reference on the document.
      - name: status
        sql: status
        type: string
        title: Status
        description: "DRAFT, SUBMITTED, AUTHORISED, PAID, VOIDED or DELETED. Only AUTHORISED and PAID are financially real."
      - name: line_amount_types
        sql: line_amount_types
        type: string
        description: Whether line amounts are tax Exclusive, Inclusive or NoTax.
      - name: contact_id
        sql: contact_id
        type: string
        public: false
      - name: contact_name
        sql: contact_name
        type: string
        title: Customer / supplier
        description: The contact the document is issued to (customer) or from (supplier).
      - name: issued_on
        sql: issued_on
        type: time
        title: Issue date
        description: Document date. Business date for revenue/expense analysis.
      - name: due_on
        sql: due_on
        type: time
        title: Due date
      - name: fully_paid_on
        sql: fully_paid_on
        type: time
        title: Fully paid date
        description: When the document was fully settled; null while outstanding.
      - name: subtotal
        sql: subtotal
        type: number
        description: Total excluding GST.
      - name: total_tax_amount
        sql: total_tax
        type: number
        title: GST on document
      - name: total_amount
        sql: total
        type: number
        title: Document total
        description: Total including GST.
      - name: amount_due_value
        sql: amount_due
        type: number
        title: Amount still owing
      - name: amount_paid_value
        sql: amount_paid
        type: number
      - name: amount_credited_value
        sql: amount_credited
        type: number
      - name: currency_code
        sql: currency_code
        type: string
      - name: currency_rate
        sql: currency_rate
        type: number
        public: false
      - name: is_discounted
        sql: is_discounted
        type: boolean
      - name: sent_to_contact
        sql: sent_to_contact
        type: boolean
        description: True once the invoice was emailed/marked sent to the contact.
      - name: repeating_invoice_id
        sql: repeating_invoice_id
        type: string
        public: false
      - name: branding_theme_id
        sql: branding_theme_id
        type: string
        public: false
      - name: has_attachments
        sql: has_attachments
        type: boolean
      - name: updated_at
        sql: updated_at
        type: time
        public: false
      - name: days_overdue
        type: number
        title: Days overdue
        description: >
          Whole days past the due date for documents still carrying an amount
          due (0 when not yet due or nothing owing). Derived from due_on;
          replaces Xero's aged receivables/payables reports.
        sql: >
          CASE
            WHEN COALESCE({CUBE}.amount_due, 0) > 0 AND {CUBE}.due_on IS NOT NULL
            THEN GREATEST(0, (CURRENT_DATE - {CUBE}.due_on::date))
            ELSE 0
          END
      - name: ageing_band
        type: string
        title: Ageing band
        description: >
          Standard AR/AP ageing bucket for documents with an amount due:
          Current (not yet due), 1-30, 31-60, 61-90, 90+ days overdue.
          'Settled' when nothing is owing.
        sql: >
          CASE
            WHEN COALESCE({CUBE}.amount_due, 0) = 0 THEN 'Settled'
            WHEN {CUBE}.due_on IS NULL OR {CUBE}.due_on::date >= CURRENT_DATE THEN 'Current'
            WHEN CURRENT_DATE - {CUBE}.due_on::date <= 30 THEN '1-30 days'
            WHEN CURRENT_DATE - {CUBE}.due_on::date <= 60 THEN '31-60 days'
            WHEN CURRENT_DATE - {CUBE}.due_on::date <= 90 THEN '61-90 days'
            ELSE '90+ days'
          END
      - name: days_to_pay
        type: number
        title: Days to pay
        description: >
          Whole days between the issue date and the fully-paid date; null while
          the document is still outstanding. Basis for average debtor/creditor
          days.
        sql: >
          CASE
            WHEN {CUBE}.fully_paid_on IS NOT NULL AND {CUBE}.issued_on IS NOT NULL
            THEN ({CUBE}.fully_paid_on::date - {CUBE}.issued_on::date)
          END

    measures:
      - name: avg_days_to_pay
        type: avg
        sql: >
          CASE
            WHEN {CUBE}.fully_paid_on IS NOT NULL AND {CUBE}.issued_on IS NOT NULL
            THEN ({CUBE}.fully_paid_on::date - {CUBE}.issued_on::date)
          END
        title: Average days to pay
        description: >
          Average days from issue to full settlement across paid documents.
          Filter to sales invoices for debtor days, bills for creditor days.
      - name: invoice_count
        type: count
        title: Documents
        description: Number of invoice documents (both sales invoices and bills).
      - name: total_invoiced
        type: sum
        sql: total
        format: currency
        title: Total value (incl. GST)
        description: Sum of document totals. Filter by document_kind and exclude DRAFT/VOIDED/DELETED for financial reporting.
      - name: total_excl_tax
        type: sum
        sql: subtotal
        format: currency
        title: Total value (excl. GST)
      - name: total_gst
        type: sum
        sql: total_tax
        format: currency
        title: GST
        description: GST on the documents (collected on sales invoices, paid on bills).
      - name: total_amount_due
        type: sum
        sql: amount_due
        format: currency
        title: Amount outstanding
        description: Total still owing across the selected documents.
      - name: total_amount_paid
        type: sum
        sql: amount_paid
        format: currency
        title: Amount paid
      - name: total_amount_credited
        type: sum
        sql: amount_credited
        format: currency
        title: Amount credited
      - name: overdue_amount
        type: sum
        sql: amount_due
        format: currency
        title: Overdue amount
        description: Amount due on documents past their due date (AUTHORISED only).
        filters:
          - sql: "{CUBE}.status = 'AUTHORISED' AND COALESCE({CUBE}.amount_due, 0) > 0 AND {CUBE}.due_on IS NOT NULL AND {CUBE}.due_on::date < CURRENT_DATE"
      - name: overdue_invoice_count
        type: count
        title: Overdue documents
        filters:
          - sql: "{CUBE}.status = 'AUTHORISED' AND COALESCE({CUBE}.amount_due, 0) > 0 AND {CUBE}.due_on IS NOT NULL AND {CUBE}.due_on::date < CURRENT_DATE"
      - name: avg_invoice_value
        type: avg
        sql: total
        format: currency
        title: Average document value

    segments:
      - name: sales_invoices
        sql: "{CUBE}.invoice_type = 'ACCREC'"
        description: Sales invoices (accounts receivable).
      - name: bills
        sql: "{CUBE}.invoice_type = 'ACCPAY'"
        description: Supplier bills (accounts payable).
      - name: financially_real
        sql: "{CUBE}.status IN ('AUTHORISED', 'PAID')"
        description: Approved documents only (excludes drafts, voided and deleted).
      - name: outstanding
        sql: "{CUBE}.status = 'AUTHORISED' AND COALESCE({CUBE}.amount_due, 0) > 0"
        description: Approved documents with money still owing.

  - name: xero_invoice_line_items
    title: Invoice line items (Xero)
    public: false
    description: >
      One row per line on a Xero invoice or bill: description, quantity, unit
      price, line amount, GST and the GL account and inventory item it was
      coded to. Carries the parent document's type, status, date and contact.
    meta:
      ai_context: >
        The line-level detail behind invoices and bills: "what did we sell",
        "spend by account/category", "which products appear on invoices".
        line_amount is ex-GST. invoice_type ACCREC = sales lines, ACCPAY =
        bill lines; exclude DRAFT/VOIDED/DELETED parent status for financial
        totals. account_code/account_name (via join) give the GL coding;
        item_name gives the inventory item when the line references one.
    sql: SELECT * FROM source_xero_official.xo_invoice_line_items

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_invoices
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_invoices}.tenant_id
          AND {CUBE}.invoice_id = {xero_invoices}.invoice_id
      - name: xero_accounts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_accounts}.tenant_id
          AND {CUBE}.account_id = {xero_accounts}.account_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: line_item_id
        sql: line_item_id
        type: string
        public: false
      - name: invoice_id
        sql: invoice_id
        type: string
        public: false
      - name: invoice_type
        sql: invoice_type
        type: string
        description: "ACCREC = sales line; ACCPAY = bill line."
      - name: invoice_status
        sql: invoice_status
        type: string
        description: Status of the parent document.
      - name: issued_on
        sql: issued_on
        type: time
        title: Document date
      - name: contact_id
        sql: contact_id
        type: string
        public: false
      - name: contact_name
        sql: contact_name
        type: string
        title: Customer / supplier
      - name: description
        sql: description
        type: string
        title: Line description
      - name: quantity
        sql: quantity
        type: number
      - name: unit_amount
        sql: unit_amount
        type: number
        title: Unit price
      - name: line_amount_value
        sql: line_amount
        type: number
        title: Line amount (excl. GST)
      - name: tax_amount_value
        sql: tax_amount
        type: number
        title: GST on line
      - name: tax_type
        sql: tax_type
        type: string
        description: Xero tax type code applied to the line (e.g. OUTPUT, INPUT, EXEMPTEXPENSES).
      - name: account_code
        sql: account_code
        type: string
        title: Account code
        description: GL account code the line is coded to.
      - name: account_id
        sql: account_id
        type: string
        public: false
      - name: item_code
        sql: item_code
        type: string
        description: Inventory item code when the line references one.
      - name: item_id
        sql: item_id
        type: string
        public: false
      - name: item_name
        sql: item_name
        type: string
        title: Item

    measures:
      - name: line_count
        type: count
        title: Lines
      - name: total_line_amount
        type: sum
        sql: line_amount
        format: currency
        title: Line total (excl. GST)
      - name: total_line_tax
        type: sum
        sql: tax_amount
        format: currency
        title: GST
      - name: total_quantity
        type: sum
        sql: quantity
        title: Quantity

    segments:
      - name: sales_lines
        sql: "{CUBE}.invoice_type = 'ACCREC'"
      - name: bill_lines
        sql: "{CUBE}.invoice_type = 'ACCPAY'"

  - name: xero_payments
    title: Payments (Xero)
    public: false
    description: >
      One row per Xero payment: money applied to an invoice, bill, credit
      note, prepayment or overpayment, with the bank account it moved through,
      the date, amount, reconciliation state and the settled document's
      contact.
    meta:
      ai_context: >
        Cash applied against documents. "When did X pay", "payments received /
        made", "cash in vs out" = amount here split by payment_type (ACCRECPAYMENT
        = customer payment received, ACCPAYPAYMENT = supplier payment made).
        paid_on is the business date. status DELETED payments should be
        excluded from totals. For direct bank spend/receive money that never
        touches an invoice use xero_bank_transactions.
    sql: SELECT * FROM source_xero_official.xo_payments

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_invoices
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_invoices}.tenant_id
          AND {CUBE}.invoice_id = {xero_invoices}.invoice_id
      - name: xero_contacts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_contacts}.tenant_id
          AND {CUBE}.contact_id = {xero_contacts}.contact_id
      - name: xero_accounts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_accounts}.tenant_id
          AND {CUBE}.account_id = {xero_accounts}.account_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: payment_id
        sql: payment_id
        type: string
        public: false
      - name: paid_on
        sql: paid_on
        type: time
        title: Payment date
      - name: amount_value
        sql: amount
        type: number
        title: Payment amount
      - name: bank_amount_value
        sql: bank_amount
        type: number
        description: Amount in the bank account's currency.
      - name: currency_rate
        sql: currency_rate
        type: number
        public: false
      - name: payment_type
        sql: payment_type
        type: string
        title: Payment type
        description: >
          ACCRECPAYMENT = customer payment received; ACCPAYPAYMENT = payment
          made to a supplier; ARCREDITPAYMENT/APCREDITPAYMENT refund credit
          notes; AROVERPAYMENTPAYMENT/APPREPAYMENTPAYMENT settle
          overpayments/prepayments.
      - name: status
        sql: status
        type: string
        description: AUTHORISED or DELETED.
      - name: is_reconciled
        sql: is_reconciled
        type: boolean
        title: Reconciled
      - name: reference
        sql: reference
        type: string
      - name: invoice_id
        sql: invoice_id
        type: string
        public: false
      - name: invoice_number
        sql: invoice_number
        type: string
        description: The settled document's number.
      - name: invoice_type
        sql: invoice_type
        type: string
      - name: contact_id
        sql: contact_id
        type: string
        public: false
      - name: contact_name
        sql: contact_name
        type: string
        title: Customer / supplier
      - name: account_id
        sql: account_id
        type: string
        public: false
      - name: account_code
        sql: account_code
        type: string
        description: The bank/clearing account the payment moved through.
      - name: batch_payment_id
        sql: batch_payment_id
        type: string
        public: false
      - name: updated_at
        sql: updated_at
        type: time
        public: false

    measures:
      - name: payment_count
        type: count
        title: Payments
      - name: total_payments
        type: sum
        sql: amount
        format: currency
        title: Payments total
        description: Sum of payment amounts (filter by payment_type for received vs made).
      - name: payments_received
        type: sum
        sql: amount
        format: currency
        title: Customer payments received
        filters:
          - sql: "{CUBE}.payment_type = 'ACCRECPAYMENT' AND {CUBE}.status <> 'DELETED'"
      - name: payments_made
        type: sum
        sql: amount
        format: currency
        title: Supplier payments made
        filters:
          - sql: "{CUBE}.payment_type = 'ACCPAYPAYMENT' AND {CUBE}.status <> 'DELETED'"
      - name: unreconciled_count
        type: count
        title: Unreconciled payments
        filters:
          - sql: "NOT COALESCE({CUBE}.is_reconciled, false) AND {CUBE}.status <> 'DELETED'"

  - name: xero_credit_notes
    title: Credit notes (Xero)
    public: false
    description: >
      One row per Xero credit note: ACCRECCREDIT (issued to a customer,
      reduces receivables) or ACCPAYCREDIT (received from a supplier, reduces
      payables), with totals, remaining credit and status.
    meta:
      ai_context: >
        Credits and refunds. "Credit notes issued", "refunds to customers" =
        document_kind 'Customer credit note'; supplier credits = 'Supplier
        credit note'. remaining_credit is what has not yet been allocated to
        an invoice or refunded. Allocations to specific invoices live in
        xero_credit_note_allocations.
    sql: SELECT * FROM source_xero_official.xo_credit_notes

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_contacts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_contacts}.tenant_id
          AND {CUBE}.contact_id = {xero_contacts}.contact_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: credit_note_id
        sql: credit_note_id
        type: string
        public: false
      - name: credit_note_number
        sql: credit_note_number
        type: string
      - name: credit_note_type
        sql: credit_note_type
        type: string
        description: "ACCRECCREDIT (customer) or ACCPAYCREDIT (supplier)."
      - name: document_kind
        sql: document_kind
        type: string
        title: Credit note kind
      - name: status
        sql: status
        type: string
      - name: reference
        sql: reference
        type: string
      - name: contact_id
        sql: contact_id
        type: string
        public: false
      - name: contact_name
        sql: contact_name
        type: string
        title: Customer / supplier
      - name: issued_on
        sql: issued_on
        type: time
        title: Issue date
      - name: fully_paid_on
        sql: fully_paid_on
        type: time
      - name: subtotal
        sql: subtotal
        type: number
      - name: total_tax_amount
        sql: total_tax
        type: number
      - name: total_amount
        sql: total
        type: number
      - name: remaining_credit_value
        sql: remaining_credit
        type: number
        title: Remaining credit
      - name: currency_code
        sql: currency_code
        type: string
      - name: currency_rate
        sql: currency_rate
        type: number
        public: false
      - name: updated_at
        sql: updated_at
        type: time
        public: false

    measures:
      - name: credit_note_count
        type: count
        title: Credit notes
      - name: total_credited
        type: sum
        sql: total
        format: currency
        title: Credit note total
      - name: total_remaining_credit
        type: sum
        sql: remaining_credit
        format: currency
        title: Unallocated credit

    segments:
      - name: customer_credit_notes
        sql: "{CUBE}.credit_note_type = 'ACCRECCREDIT'"
      - name: supplier_credit_notes
        sql: "{CUBE}.credit_note_type = 'ACCPAYCREDIT'"

  - name: xero_credit_note_line_items
    title: Credit note lines (Xero)
    public: false
    description: One row per line on a Xero credit note, with GL account coding.
    sql: SELECT * FROM source_xero_official.xo_credit_note_line_items
    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_credit_notes
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_credit_notes}.tenant_id
          AND {CUBE}.credit_note_id = {xero_credit_notes}.credit_note_id
      - name: xero_accounts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_accounts}.tenant_id
          AND {CUBE}.account_id = {xero_accounts}.account_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: line_item_id
        sql: line_item_id
        type: string
        public: false
      - name: credit_note_id
        sql: credit_note_id
        type: string
        public: false
      - name: credit_note_type
        sql: credit_note_type
        type: string
      - name: issued_on
        sql: issued_on
        type: time
      - name: contact_name
        sql: contact_name
        type: string
      - name: description
        sql: description
        type: string
      - name: quantity
        sql: quantity
        type: number
      - name: unit_amount
        sql: unit_amount
        type: number
      - name: line_amount_value
        sql: line_amount
        type: number
      - name: tax_amount_value
        sql: tax_amount
        type: number
      - name: tax_type
        sql: tax_type
        type: string
      - name: account_code
        sql: account_code
        type: string
      - name: account_id
        sql: account_id
        type: string
        public: false
    measures:
      - name: line_count
        type: count
      - name: total_line_amount
        type: sum
        sql: line_amount
        format: currency

  - name: xero_credit_note_allocations
    title: Credit note allocations (Xero)
    public: false
    description: >
      One row per allocation of a credit note against an invoice: which
      invoice the credit was applied to, when and how much.
    sql: SELECT * FROM source_xero_official.xo_credit_note_allocations
    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_credit_notes
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_credit_notes}.tenant_id
          AND {CUBE}.credit_note_id = {xero_credit_notes}.credit_note_id
      - name: xero_invoices
        relationship: many_to_one
        sql: >
