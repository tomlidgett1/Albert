cubes:
  - name: sales
    title: Sales (transaction headers)
    public: false
    description: >
      One row per Lightspeed sale transaction (ticket). Includes completed sales,
      refunds (negative totals), voided/cancelled sales and still-open tickets.
      All money comes from Lightspeed's calc_* fields: calc_total is tax-inclusive
      gross takings, calc_subtotal is ex-tax net sales. Default revenue measures
      count only completed, non-voided sales. Refunds are completed sales with a
      negative total and are included in net figures (they reduce revenue).
      Tombstoned (remotely deleted) rows are excluded at source.
    meta:
      ai_context: >
        Use complete_time as the business date for any revenue/turnover question;
        create_time is only when the ticket was opened. "Revenue", "takings",
        "turnover" and "sales" all mean gross_takings (tax inclusive) unless the
        user asks for ex-tax/ex-GST figures, then use net_sales_ex_tax.
        Profitability means gross profit (revenue minus cost of goods); Lightspeed
        has no operating expenses, so answers must say "gross profit/margin".
        Never mix tax-inclusive calc_total with ex-tax calc_subtotal in one ratio.
        net_sales_ex_tax is AFTER discounts (what customers actually paid, ex
        GST); Lightspeed's calc_subtotal is the pre-discount list value and is
        surfaced as net_sales_before_discounts, so net_sales_ex_tax =
        net_sales_before_discounts - discounts_given and gross_profit /
        gross_margin_pct are post-discount. Never hand-subtract discounts again.
        "Busiest day", "best day of the week", "peak hours": group transactions
        or gross_takings by completed_weekday (order by completed_weekday_number)
        or completed_hour_of_day in ONE query; never add up daily rows by hand.
        "Online sales", "web orders" = sales_channel equals Online (the sale was
        settled with the eCom tender); everything else is In store. open_tickets
        are parked or abandoned register tickets, not layaways: layaways in
        progress are open_layaways / layaway_balance, and a negative balance is
        a deposit held ahead of the goods.
    # has_ecom_tender: the web-store integration settles its orders with
    # Lightspeed's eCom payment type. This tenant runs one register for both
    # channels, so the tender (not the register) is what identifies online
    # orders; the flag is precomputed once per sale here.
    sql: >
      WITH ecom_tenders AS MATERIALIZED (
        SELECT sp.tenant_id, sp.sale_id
        FROM source_lightspeed_official.ls_sale_payments sp
        JOIN source_lightspeed_official.ls_payment_types pt
          ON pt.tenant_id = sp.tenant_id
          AND pt.payment_type_id = sp.payment_type_id
          AND NOT pt.tombstone
        WHERE NOT sp.tombstone
          AND (LOWER(pt.type) = 'ecom' OR LOWER(pt.name) = 'ecom')
        GROUP BY 1, 2
      )
      SELECT t.*,
             (e.sale_id IS NOT NULL) AS has_ecom_tender
      FROM source_lightspeed_official.ls_sales t
      LEFT JOIN ecom_tenders e
        ON e.tenant_id = t.tenant_id AND e.sale_id = t.sale_id
      WHERE NOT t.tombstone

    joins:
      - name: customers
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {customers}.tenant_id
          AND {CUBE}.customer_id = {customers}.customer_id
      - name: employees
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {employees}.tenant_id
          AND {CUBE}.employee_id = {employees}.employee_id
      - name: shops
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {shops}.tenant_id
          AND {CUBE}.shop_id = {shops}.shop_id
      - name: registers
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {registers}.tenant_id
          AND {CUBE}.register_id = {registers}.register_id
      - name: discounts
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {discounts}.tenant_id
          AND {CUBE}.discount_id = {discounts}.discount_id
      - name: tax_categories
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {tax_categories}.tenant_id
          AND {CUBE}.tax_category_id = {tax_categories}.tax_category_id

    dimensions:
      - name: row_key
        sql: namespaced_source_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: sale_id
        sql: sale_id
        type: number
        title: Sale ID
        description: Lightspeed's numeric identifier for the sale (ticket number in the POS).
      - name: completed
        sql: completed
        type: boolean
        description: True once the sale has been finalised at the register. Open tickets are false.
      - name: voided
        sql: voided
        type: boolean
        description: True when the sale was voided/cancelled. Voided sales must be excluded from revenue.
      - name: archived
        sql: archived
        type: boolean
        description: True when the sale has been archived in Lightspeed.
      - name: sale_type
        title: Sale type
        type: string
        sql: >
          CASE
            WHEN COALESCE({CUBE}.voided, false) THEN 'Voided'
            WHEN COALESCE({CUBE}.completed, false) = false
                 AND COALESCE({CUBE}.calc_payments, 0) > 0 THEN 'Open layaway'
            WHEN COALESCE({CUBE}.completed, false) = false THEN 'Open ticket'
            WHEN {CUBE}.calc_total < 0 THEN 'Refund'
            ELSE 'Sale'
          END
        description: >
          Classifies each transaction: Sale (completed, positive), Refund (completed,
          negative total), Open layaway (not completed but a payment has been
          taken), Open ticket (not completed, nothing paid: a parked or abandoned
          register ticket) or Voided.
        meta:
          ai_context: Use this to separate refunds, layaways and abandoned tickets from regular sales in breakdowns.
      - name: completed_at
        sql: complete_time
        type: time
        title: Completed at (business date)
        description: When the sale was finalised. This is the business date for all revenue reporting.
      - name: completed_weekday
        sql: "to_char({CUBE}.complete_time, 'FMDay')"
        type: string
        title: Day of week (completed)
        description: Weekday name of the completion time (Monday ... Sunday) in the store's time zone.
        meta:
          ai_context: >
            For "busiest day" / "which day of the week sells most" group
            transactions or gross_takings by this in one query and order by
            completed_weekday_number; never sum daily rows by hand.
      - name: completed_weekday_number
        sql: "EXTRACT(ISODOW FROM {CUBE}.complete_time)"
        type: number
        title: Day of week number (1 = Monday)
        description: ISO weekday number of the completion time (1 = Monday ... 7 = Sunday), for ordering weekday breakdowns.
      - name: completed_hour_of_day
        sql: "EXTRACT(HOUR FROM {CUBE}.complete_time)"
        type: number
        title: Hour of day (completed)
        description: Hour of the day (0-23) the sale was completed, in the store's time zone.
        meta:
          ai_context: >
            For "busiest hour" / "peak trading times" group transactions or
            gross_takings by this (optionally with completed_weekday) in one
            query; never sum hourly rows by hand.
      - name: created_at
        sql: create_time
        type: time
        description: When the ticket was first opened at the register. Not the revenue date.
      - name: updated_at
        sql: time_stamp
        type: time
        description: When Lightspeed last modified this sale record.
      - name: vendor_updated_at
        sql: updatetime
        type: time
        public: false
        description: Vendor updateTime field; updated_at (timeStamp) is the canonical modification time.
      - name: vendor_total
        sql: total
        type: number
        format: currency
        public: false
        description: Vendor-computed total snapshot; use gross takings measures for revenue.
      - name: displayable_total
        sql: displayable_total
        type: number
        format: currency
        public: false
        description: Receipt display total; use gross takings measures for revenue.
      - name: reference_number
        sql: reference_number
        type: string
        description: External reference number attached to the sale (for example an ecommerce order id).
      - name: reference_number_source
        sql: reference_number_source
        type: string
        description: System that supplied the reference number (for example an ecommerce integration).
      - name: tax1_rate
        sql: tax1_rate
        type: number
        description: Primary tax rate applied to the sale, as a fraction (0.1 = 10% GST).
      - name: tax2_rate
        sql: tax2_rate
        type: number
        description: Secondary tax rate applied to the sale, as a fraction. Usually 0 in Australia.
      - name: tip_enabled
        sql: tip_enabled
        type: boolean
        description: Whether tipping was enabled on this sale.
      - name: promotions_enabled
        sql: enable_promotions
        type: boolean
        description: Whether automatic promotions were allowed to apply to this sale.
      - name: discount_percent
        sql: discount_percent
        type: number
        description: Whole-sale discount percentage applied at the header level, as a fraction.
      - name: total_due
        sql: total_due
        type: number
        format: currency
        description: Amount still due on the sale at last sync.
      - name: balance
        sql: balance
        type: number
        format: currency
        description: Outstanding balance on the sale (unpaid remainder, for example on layaways or on-account sales).
      - name: customer_id
        sql: customer_id
        type: number
        public: false
      - name: employee_id
        sql: employee_id
        type: number
        public: false
      - name: tip_employee_id
        sql: tip_employee_id
        type: number
        public: false
        description: Employee credited with the tip.
      - name: register_id
        sql: register_id
        type: number
        public: false
      - name: shop_id
        sql: shop_id
        type: number
        public: false
      - name: quote_id
        sql: quote_id
        type: number
        description: Quote this sale was created from, when the sale converted a quote.
      - name: discount_id
        sql: discount_id
        type: number
        public: false
      - name: tax_category_id
        sql: tax_category_id
        type: number
        public: false
      - name: ship_to_id
        sql: ship_to_id
        type: number
        public: false
        description: Shipping destination attached to the sale, when shipped.
      - name: has_customer
        type: boolean
        sql: "({CUBE}.customer_id IS NOT NULL AND {CUBE}.customer_id <> 0)"
        title: Has attached customer
        description: True when the sale was rung up against a customer profile rather than anonymously.
      - name: sales_channel
        type: string
        title: Sales channel
        sql: "CASE WHEN COALESCE({CUBE}.has_ecom_tender, false) THEN 'Online' ELSE 'In store' END"
        description: >
          Online when the sale was settled with Lightspeed's eCom tender (the
          web-store integration's payment type), otherwise In store. This tenant
          runs a single register ("Counter") for both channels, so the tender,
          not the register, identifies online orders.
        meta:
          ai_context: >
            "Online sales", "web orders", "ecommerce revenue": filter or group by
            sales_channel (Online / In store) with gross_takings and
            transactions. The same population is the eCom tender in
            payments_analytics.
      - name: is_online_sale
        type: boolean
        sql: "COALESCE({CUBE}.has_ecom_tender, false)"
        title: Online sale
        description: True when the sale carries an eCom tender (see sales_channel).

    measures:
      - name: transactions
        type: count
        title: Transactions
        description: >
          Number of completed, non-voided sale transactions (refund transactions included).
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: purchase_transactions
        type: count
        title: Positive purchase transactions
        description: Completed, non-voided transactions with a positive tax-inclusive total. Refunds and zero-value activity are excluded.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.calc_total, 0) > 0"
      - name: identified_transactions
        type: count
        title: Transactions with a customer
        description: Completed, non-voided transactions attributed to a non-zero customer profile; purchases and refunds both reconcile to transactions.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND {CUBE}.customer_id IS NOT NULL AND {CUBE}.customer_id <> 0"
      - name: anonymous_transactions
        type: count
        title: Transactions without a customer
        description: Completed, non-voided transactions with no attached customer profile. identified_transactions plus anonymous_transactions equals transactions.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND ({CUBE}.customer_id IS NULL OR {CUBE}.customer_id = 0)"
      - name: identified_transaction_coverage_pct
        type: number
        sql: "100.0 * {identified_transactions} / NULLIF({transactions}, 0)"
        format: percent
        title: Customer attribution coverage %
        description: Share of completed, non-voided transactions carrying a customer profile.
      - name: anonymous_transaction_coverage_pct
        type: number
        sql: "100.0 * {anonymous_transactions} / NULLIF({transactions}, 0)"
        format: percent
        title: Anonymous transaction share %
        description: Share of completed, non-voided transactions with no attached customer profile.
      - name: gross_takings
        type: sum
        sql: calc_total
        format: currency
        title: Gross takings (inc tax)
        description: >
          Tax-inclusive revenue across completed, non-voided sales. Refunds subtract.
          This is what "revenue", "sales" or "takings" means by default.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: identified_gross_takings
        type: sum
        sql: calc_total
        format: currency
        title: Takings with a customer
        description: Signed tax-inclusive takings on completed, non-voided transactions with an attached customer; refunds subtract.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND {CUBE}.customer_id IS NOT NULL AND {CUBE}.customer_id <> 0"
      - name: anonymous_gross_takings
        type: sum
        sql: calc_total
        format: currency
        title: Takings without a customer
        description: Signed tax-inclusive takings on completed, non-voided anonymous transactions; refunds subtract. This plus identified_gross_takings equals gross_takings.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND ({CUBE}.customer_id IS NULL OR {CUBE}.customer_id = 0)"
      - name: identified_revenue_coverage_pct
        type: number
        sql: "100.0 * {identified_gross_takings} / NULLIF({gross_takings}, 0)"
        format: percent
        title: Customer-attributed takings share %
        description: Signed gross takings attached to customer profiles as a share of all signed gross takings for the same selection.
      - name: anonymous_revenue_coverage_pct
        type: number
        sql: "100.0 * {anonymous_gross_takings} / NULLIF({gross_takings}, 0)"
        format: percent
        title: Anonymous takings share %
        description: Signed anonymous gross takings as a share of all signed gross takings for the same selection.
      - name: net_sales_ex_tax
        type: sum
        sql: "COALESCE({CUBE}.calc_total, 0) - COALESCE({CUBE}.calc_tax1, 0) - COALESCE({CUBE}.calc_tax2, 0)"
        format: currency
        title: Net sales (ex tax, after discounts)
        description: >
          Ex-tax revenue actually paid on completed, non-voided sales: the
          tax-inclusive total less tax, so discounts are already deducted
          (it equals calc_taxable + calc_non_taxable). Refunds subtract. Use
          this side of any margin calculation because cost fields are also ex
          tax.
        meta:
          ai_context: >
            "Net sales", "sales ex GST", "revenue ex tax" = this measure. It is
            post-discount; net_sales_before_discounts is the pre-discount list
            value (Lightspeed's calc_subtotal) and the difference is
            discounts_given.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: net_sales_before_discounts
        type: sum
        sql: calc_subtotal
        format: currency
        title: Net sales before discounts (ex tax)
        description: >
          Ex-tax value of completed, non-voided sales at list price, before any
          discount (Lightspeed's calc_subtotal). net_sales_ex_tax is this less
          discounts_given.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: tax_collected
        type: sum
        sql: "COALESCE({CUBE}.calc_tax1, 0) + COALESCE({CUBE}.calc_tax2, 0)"
        format: currency
        title: Tax collected
        description: Total tax (tax1 + tax2, for example GST) on completed, non-voided sales.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: tax1_collected
        type: sum
        sql: calc_tax1
        format: currency
        description: Primary tax (tax1) collected on completed, non-voided sales.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: tax2_collected
        type: sum
        sql: calc_tax2
        format: currency
        description: Secondary tax (tax2) collected on completed, non-voided sales.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: taxable_amount
        type: sum
        sql: calc_taxable
        format: currency
        description: Portion of completed, non-voided sales that was subject to tax.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: non_taxable_amount
        type: sum
        sql: calc_non_taxable
        format: currency
        description: Portion of completed, non-voided sales that was tax exempt.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: discounts_given
        type: sum
        sql: calc_discount
        format: currency
        title: Discounts given (ex tax)
        description: Total ex-tax discount value given away on completed, non-voided sales; net_sales_before_discounts less this equals net_sales_ex_tax.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: tips_collected
        type: sum
        sql: calc_tips
        format: currency
        description: Tips collected on completed, non-voided sales. Tips are not merchandise revenue.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: payments_received
        type: sum
        sql: calc_payments
        format: currency
        description: Total tender applied to completed, non-voided sales (may differ from takings when change is given).
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: change_given
        type: sum
        sql: '{CUBE}."change"'
        format: currency
        description: Change handed back to customers on completed, non-voided sales.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: cost_of_goods
        type: sum
        sql: >
          CASE
            WHEN COALESCE({CUBE}.calc_fifo_cost, 0) = 0 AND COALESCE({CUBE}.calc_subtotal, 0) <> 0
              THEN COALESCE({CUBE}.calc_avg_cost, 0)
            ELSE COALESCE({CUBE}.calc_fifo_cost, 0)
          END
        format: currency
        title: Cost of goods sold
        description: >
          Ex-tax cost of goods for completed, non-voided sales. Uses FIFO cost and
          falls back to average cost when FIFO is zero on a sale with real revenue
          (early or migrated data often lacks FIFO layers).
        meta:
          ai_context: >
            Cost is ex tax. Only ever compare against net_sales_ex_tax, never
            against tax-inclusive gross_takings.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
      - name: gross_profit
        type: number
        sql: "{net_sales_ex_tax} - {cost_of_goods}"
        format: currency
        title: Gross profit
        description: >
          Net sales (ex tax, after discounts) minus cost of goods sold. This is
          gross profit; Lightspeed carries no operating expenses, so "profit"
          questions can only be answered at gross margin level and answers
          should say so.
      - name: gross_margin_pct
        type: number
        sql: "100.0 * ({net_sales_ex_tax} - {cost_of_goods}) / NULLIF({net_sales_ex_tax}, 0)"
        format: percent
        title: Gross margin %
        description: Gross profit as a percentage of net sales (ex tax, after discounts).
      - name: average_sale_value
        type: number
        sql: "{gross_takings} / NULLIF({transactions}, 0)"
        format: currency
        title: Average sale value
        description: Gross takings divided by transaction count (tax inclusive AOV).
      - name: refund_transactions
        type: count
        title: Refund transactions
        description: Completed, non-voided transactions whose total is negative (refunds/returns).
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND {CUBE}.calc_total < 0"
      - name: refund_value
        type: sum
        sql: calc_total
        format: currency
        title: Refund value
        description: >
          Tax-inclusive value of refund transactions. Negative by construction;
          multiply by -1 when presenting "refund dollars".
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND {CUBE}.calc_total < 0"
      - name: voided_transactions
        type: count
        description: Transactions that were voided/cancelled. Never part of revenue.
        filters:
          - sql: "COALESCE({CUBE}.voided, false) = true"
      - name: open_tickets
        type: count
        title: Open register tickets
        description: >
          Tickets that are neither completed nor voided. For this tenant these
          are parked or abandoned register tickets going back to 2018 (12.9k as
          at September 2026, almost all with nothing paid), not layaways.
        meta:
          ai_context: >
            Not a layaway or deposit count and not money owed: for layaways in
            progress use open_layaways and layaway_balance.
        filters:
          - sql: "COALESCE({CUBE}.completed, false) = false AND COALESCE({CUBE}.voided, false) = false"
      - name: outstanding_balance
        type: sum
        sql: balance
        format: currency
        title: Outstanding balance (tickets with a payment)
        description: >
          Net balance across non-voided tickets on which a payment has been
          taken (layaways and deposits). Negative means customers have paid more
          than the ticket currently totals (deposits held); positive means money
          is still owed. Abandoned tickets with nothing paid are excluded.
        filters:
          - sql: "COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.calc_payments, 0) > 0"
      - name: open_layaways
        type: count
        title: Open layaways
        description: >
          Open tickets (not completed, not voided, not archived) on which a
          payment has been taken: layaways and deposits still in progress.
        meta:
          ai_context: >
            "Layaways", "deposits held", "lay-bys in progress" = this count with
            layaway_balance; filter created_at to a recent window when the
            question is about current layaways (the all-time population
            includes stale tickets back to 2018).
        filters:
          - sql: >
              COALESCE({CUBE}.completed, false) = false AND COALESCE({CUBE}.voided, false) = false
              AND COALESCE({CUBE}.archived, false) = false AND COALESCE({CUBE}.calc_payments, 0) > 0
      - name: layaway_balance
        type: sum
        sql: balance
        format: currency
        title: Layaway balance
        description: >
          Net balance across open layaways (see open_layaways). Negative =
          deposits held ahead of the goods; positive = still owed by customers.
        filters:
          - sql: >
              COALESCE({CUBE}.completed, false) = false AND COALESCE({CUBE}.voided, false) = false
              AND COALESCE({CUBE}.archived, false) = false AND COALESCE({CUBE}.calc_payments, 0) > 0
      - name: online_transactions
        type: count
        title: Online transactions
        description: Completed, non-voided sales settled with the eCom tender (sales_channel = Online); refund transactions included.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.has_ecom_tender, false) = true"
      - name: online_gross_takings
        type: sum
        sql: calc_total
        format: currency
        title: Online takings (inc tax)
        description: Tax-inclusive takings on completed, non-voided online sales (sales_channel = Online); refunds subtract.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.has_ecom_tender, false) = true"
      - name: purchasing_customers
        type: count_distinct
        sql: customer_id
        title: Distinct purchasing customers
        description: Distinct customer profiles attached to positive completed, non-voided purchases. Refund-only activity and anonymous sales are not counted.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.calc_total, 0) > 0 AND {CUBE}.customer_id IS NOT NULL AND {CUBE}.customer_id <> 0"
      - name: first_sale_at
        type: min
        sql: complete_time
        public: false
        description: Earliest positive completed purchase time for an attached customer; retained as a private compatibility measure.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.calc_total, 0) > 0 AND {CUBE}.customer_id IS NOT NULL AND {CUBE}.customer_id <> 0"
      - name: last_sale_at
        type: max
        sql: complete_time
        public: false
        description: Latest positive completed purchase time for an attached customer; retained as a private compatibility measure.
        filters:
          - sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.calc_total, 0) > 0 AND {CUBE}.customer_id IS NOT NULL AND {CUBE}.customer_id <> 0"

    segments:
      - name: completed_sales
        sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false"
        description: Completed, non-voided transactions (the default revenue population).
      - name: refunds
        sql: "{CUBE}.completed = true AND COALESCE({CUBE}.voided, false) = false AND {CUBE}.calc_total < 0"
        description: Completed transactions with a negative total, i.e. refunds/returns.
      - name: voided_sales
        sql: "COALESCE({CUBE}.voided, false) = true"
        description: Voided/cancelled transactions.
      - name: open_sales
        sql: "COALESCE({CUBE}.completed, false) = false AND COALESCE({CUBE}.voided, false) = false"
        description: Open tickets not yet completed (mostly parked or abandoned register tickets; use layaway_sales for the ones with money down).
      - name: layaway_sales
        sql: "COALESCE({CUBE}.completed, false) = false AND COALESCE({CUBE}.voided, false) = false AND COALESCE({CUBE}.archived, false) = false AND COALESCE({CUBE}.calc_payments, 0) > 0"
        description: Open layaways and deposit tickets (not completed, not voided, with a payment taken).
      - name: online_sales
        sql: "COALESCE({CUBE}.has_ecom_tender, false) = true"
        description: Sales settled with the eCom tender (online orders).
      - name: customer_attached_sales
        sql: "{CUBE}.customer_id IS NOT NULL AND {CUBE}.customer_id <> 0"
        description: Sales rung up against a customer profile (excludes anonymous walk-ins).
