  # One row per connected Lightspeed R-Series account (tenant), derived from
  # the account record with the customer and credit-account tables as
  # fallbacks so it exists as soon as any of them has synced. It carries no
  # business members: it exists so a multi-grain view can own its tenant pin
  # on a cube that EVERY grain reaches through a tenant-only many_to_one join.
  # customer_analytics pins here rather than on customers because gift cards
  # sold to walk-ins have no customer row and would otherwise be dropped from
  # liability totals by the injected tenant filter.
  - name: lightspeed_r_tenant
    title: Lightspeed account (tenant scope)
    public: false
    description: >
      One row per connected Lightspeed R-Series account. Used only as the
      tenant anchor for multi-grain views; it has no business measures.
    sql: >
      SELECT u.tenant_id
      FROM (
        SELECT a.tenant_id FROM source_lightspeed_official.ls_account a WHERE NOT a.tombstone
        UNION
        SELECT c.tenant_id FROM source_lightspeed_official.ls_customers c WHERE NOT c.tombstone
        UNION
        SELECT k.tenant_id FROM source_lightspeed_official.ls_credit_accounts k WHERE NOT k.tombstone
      ) u

    dimensions:
      - name: tenant_id
        sql: tenant_id
        type: string
        primary_key: true
        public: false
