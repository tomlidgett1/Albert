  - name: credit_accounts
    title: Credit accounts (store credit and gift cards)
    public: false
    description: >
      One row per credit account: customer store-credit/on-account facilities and
      gift cards (gift_card = true). balance is the current position at last sync,
      signed the Lightspeed way: NEGATIVE when the shop owes the customer (store
      credit or gift card value still to be redeemed), positive when the customer
      owes the shop.
    meta:
      ai_context: >
        "Gift card liability" / "outstanding gift cards" = gift_card_liability
        (already sign-flipped to a positive amount) with outstanding_gift_cards.
        "Store credit customers hold" = store_credit_owed_to_customers. "Money
        owed to us on account" = on_account_receivable. total_balance,
        gift_card_balance and on_account_balance are the raw signed sums
        (negative = owed to customers), so never present them as amounts owed
        to the shop. Gift cards sold to walk-ins have no customer profile,
        which is why the liability measures are queried on their own rather
        than through a customer breakdown.
    sql: >
      SELECT t.* FROM source_lightspeed_official.ls_credit_accounts t
      WHERE NOT t.tombstone

    joins:
      # Tenant anchor for multi-grain views: every credit account, including
      # gift cards with no customer, reaches the tenant row.
      - name: lightspeed_r_tenant
        relationship: many_to_one
        sql: "{CUBE}.tenant_id = {lightspeed_r_tenant}.tenant_id"

    dimensions:
      - name: row_key
        sql: namespaced_source_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: credit_account_id
        sql: credit_account_id
        type: number
        description: Lightspeed's identifier for the credit account.
      - name: name
        sql: '{CUBE}."name"'
        type: string
        description: Account display name.
      - name: code
        sql: code
        type: string
        description: Account code (gift cards carry the card number here).
      - name: description
        sql: description
        type: string
        public: false
        description: Free-text description of the account.
      - name: is_gift_card
        sql: gift_card
        type: boolean
        title: Is gift card
        description: True for gift cards, false for customer credit/on-account facilities.
      - name: archived
        sql: archived
        type: boolean
        description: True when the account has been archived.
      - name: balance
        sql: balance
        type: number
        format: currency
        description: Signed balance at last sync. Negative = the shop owes the customer (store credit / gift card value remaining); positive = the customer owes the shop.
      - name: customer_id
        sql: customer_id
        type: number
        public: false
        description: Customer who owns the account, when customer-linked.
      - name: contact_id
        sql: contact_id
        type: number
        public: false
      - name: updated_at
        sql: time_stamp
        type: time
        public: false

    measures:
      - name: account_count
        type: count
        title: Credit accounts
        description: Number of credit accounts (gift cards included).
      - name: total_balance
        type: sum
        sql: balance
        format: currency
        title: Total balance (signed)
        description: Raw signed sum of balances across the selected accounts (negative = owed to customers).
      - name: on_account_balance
        type: sum
        sql: balance
        format: currency
        title: On-account balance (signed, non gift card)
        description: Raw signed sum across customer credit accounts, excluding gift cards; negative = store credit owed to customers. store_credit_owed_to_customers and on_account_receivable split it into its two sides.
        filters:
          - sql: "COALESCE({CUBE}.gift_card, false) = false"
      - name: gift_card_balance
        type: sum
        sql: balance
        format: currency
        title: Gift card balance (signed)
        description: Raw signed sum across gift cards; negative = value still loaded. gift_card_liability is the same figure as a positive amount.
        filters:
          - sql: "COALESCE({CUBE}.gift_card, false) = true"
      - name: gift_card_liability
        type: sum
        sql: "-COALESCE({CUBE}.balance, 0)"
        format: currency
        title: Gift card liability
        description: Value still loaded on gift cards and owed to their holders - the sign-flipped sum of gift-card balances, so a positive number is the liability.
        filters:
          - sql: "COALESCE({CUBE}.gift_card, false) = true"
      - name: outstanding_gift_cards
        type: count
        title: Gift cards with value remaining
        description: Gift cards whose balance is still negative (value not yet redeemed).
        filters:
          - sql: "COALESCE({CUBE}.gift_card, false) = true AND COALESCE({CUBE}.balance, 0) < 0"
      - name: store_credit_owed_to_customers
        type: sum
        sql: "-COALESCE({CUBE}.balance, 0)"
        format: currency
        title: Store credit owed to customers
        description: Store credit held by customers on non-gift-card credit accounts (accounts in credit, sign flipped so the figure is positive).
        filters:
          - sql: "COALESCE({CUBE}.gift_card, false) = false AND COALESCE({CUBE}.balance, 0) < 0"
      - name: on_account_receivable
        type: sum
        sql: balance
        format: currency
        title: On-account receivable
        description: Money customers still owe the shop on non-gift-card credit accounts (accounts with a positive balance).
        filters:
          - sql: "COALESCE({CUBE}.gift_card, false) = false AND COALESCE({CUBE}.balance, 0) > 0"

    segments:
      - name: gift_cards
        sql: "COALESCE({CUBE}.gift_card, false) = true"
        description: Gift card accounts.
      - name: customer_credit_accounts
        sql: "COALESCE({CUBE}.gift_card, false) = false"
        description: Customer credit / on-account facilities (not gift cards).

