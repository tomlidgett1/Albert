cubes:
  # ---------------------------------------------------------------------------
  # Deputy efficiency cubes: grains that are only safe when built inside one
  # SQL statement (Omni runs one governed query per topic and never joins
  # results, so "rostered vs actual" and "labour vs sales" need a pre-joined
  # row grain).
  #
  # TIMESTAMP TRAP: dp_rosters stores shift_date / starts_at / ends_at as
  # VARCHAR (see the column list at the top of deputy_workforce.yml). Every
  # roster instant below is cast with ::timestamptz before it is compared,
  # coalesced or bucketed. dp_timesheets and ls_sales instants are timestamptz.
  #
  # TIME ZONE: local dates, weekdays and hours render in the Postgres session
  # time zone, which cube.js pins to the business zone (storeTimezone =
  # ALBERT_CUBE_SESSION_TIMEZONE, ADR 0107). The SQL makes that explicit with
  # AT TIME ZONE current_setting('TimeZone') rather than hard-coding a zone.
  # ---------------------------------------------------------------------------

  - name: deputy_shift_reconciliation
    title: Shift reconciliation (Deputy roster vs timesheet)
    public: false
    description: >
      One row per rostered shift or unrostered worked timesheet: Deputy
      rosters FULL OUTER JOINed to worked timesheets on the timesheet's
      roster_id (leave-generated timesheets excluded; several timesheets on
      one roster are summed into that roster's row). Each row carries the
      scheduled and actual hours and cost, the lateness in minutes and an
      attendance_status: 'as rostered', 'late' (clocked on more than 5
      minutes after the rostered start), 'no-show' (an assigned past shift
      with no timesheet), 'unfilled' (a past shift nobody was assigned to and
      nobody worked), 'unrostered' (a worked timesheet with no roster),
      'no clock-on yet' (the rostered span covers now and no timesheet has
      landed), 'upcoming' (rostered start still ahead) or 'matched to
      another day' (Deputy linked the timesheet to a roster more than 12
      hours away - a matching quirk, not lateness).
    meta:
      ai_context: >
        The only grain that holds rosters AND timesheets: rostered vs actual
        hours and cost, late arrivals, no-shows, unfilled shifts and
        unrostered work come from this cube in ONE query - never combine the
        roster cube's rostered_* measures with the timesheet cube's worked
        measures instead. Grain is per shift, so rostered_hours and
        worked_hours here reconcile to the roster and timesheet cubes for
        the same dates. shift_date is the business date (the rostered date,
        or the worked date for unrostered timesheets); group by
        employee_name, unit_name, attendance_status or shift_date. "Who was
        late / didn't show last week" = attendance_status = 'late' /
        'no-show' with employee_name, shift_date and late_minutes. 'matched
        to another day' rows (Deputy linked a timesheet to a roster on a
        different date) still carry both hours but are neither late nor
        as rostered - mention them as a roster/timesheet mismatch. Costs are
        Deputy's pay-rate estimates (costed shifts only, no super or
        on-costs). FRESHNESS: timesheets land through a daily sync, so a
        shift in the last 1-2 days can read as 'no-show' until its timesheet
        arrives - say so for recent no-shows. LINK QUALITY: rosters and
        timesheets are linked reliably from 2024 (90%+ of rosters carry a
        timesheet link each quarter); earlier years hold many unlinked
        timesheets, so no-show and unrostered figures before 2024 are data
        gaps, not attendance evidence.
    sql: >
      WITH rostered AS (
        SELECT r.tenant_id, r.roster_id, NULLIF(r.employee_id, 0) AS employee_id, r.employee_name,
               (r.shift_date)::timestamptz AS shift_date,
               (r.starts_at)::timestamptz AS starts_at,
               (r.ends_at)::timestamptz AS ends_at,
               r.scheduled_hours, r.scheduled_cost, r.published, r.open_shift,
               r.operational_unit_id, r.unit_name, r.company_name
        FROM source_deputy.dp_rosters r
      ), worked AS (
        SELECT t.tenant_id, NULLIF(t.roster_id, 0) AS roster_id,
               MIN(t.timesheet_id) AS timesheet_id, COUNT(*) AS timesheet_count,
               MIN(t.employee_id) AS employee_id, MIN(t.employee_name) AS employee_name,
               MIN(t.shift_date) AS shift_date, MIN(t.started_at) AS started_at, MAX(t.ended_at) AS ended_at,
               SUM(t.paid_hours) AS paid_hours, SUM(t.wage_cost) AS wage_cost,
               BOOL_OR(COALESCE(t.in_progress, false)) AS in_progress,
               BOOL_AND(COALESCE(t.time_approved, false)) AS time_approved,
               MIN(t.operational_unit_id) AS operational_unit_id, MIN(t.unit_name) AS unit_name, MIN(t.company_name) AS company_name
        FROM source_deputy.dp_timesheets t
        WHERE NOT COALESCE(t.is_leave, false)
        GROUP BY t.tenant_id, NULLIF(t.roster_id, 0), CASE WHEN NULLIF(t.roster_id, 0) IS NULL THEN t.timesheet_id END
      )
      SELECT COALESCE(r.tenant_id, w.tenant_id) || ':' || COALESCE('roster:' || r.roster_id::text, 'timesheet:' || w.timesheet_id::text) AS row_key,
             COALESCE(r.tenant_id, w.tenant_id) AS tenant_id,
             r.roster_id,
             w.timesheet_id,
             COALESCE(w.timesheet_count, 0) AS timesheet_count,
             COALESCE(w.employee_id, r.employee_id) AS employee_id,
             COALESCE(w.employee_name, r.employee_name) AS employee_name,
             COALESCE(r.shift_date, w.shift_date) AS shift_date,
             r.starts_at AS rostered_starts_at,
             r.ends_at AS rostered_ends_at,
             w.started_at AS worked_started_at,
             w.ended_at AS worked_ended_at,
             COALESCE(r.scheduled_hours, 0) AS rostered_hours,
             COALESCE(w.paid_hours, 0) AS worked_hours,
             COALESCE(r.scheduled_cost, 0) AS rostered_cost,
             COALESCE(w.wage_cost, 0) AS actual_cost,
             COALESCE(r.operational_unit_id, w.operational_unit_id) AS operational_unit_id,
             COALESCE(r.unit_name, w.unit_name) AS unit_name,
             COALESCE(r.company_name, w.company_name) AS company_name,
             COALESCE(r.published, false) AS published,
             COALESCE(r.open_shift, false) AS open_shift,
             COALESCE(w.in_progress, false) AS in_progress,
             CASE WHEN r.roster_id IS NOT NULL AND w.timesheet_id IS NOT NULL
                  THEN ROUND((EXTRACT(EPOCH FROM (w.started_at - r.starts_at)) / 60.0)::numeric, 1) END AS late_minutes,
             CASE
               WHEN r.roster_id IS NULL THEN 'unrostered'
               WHEN w.timesheet_id IS NOT NULL THEN
                 CASE
                   WHEN ABS(EXTRACT(EPOCH FROM (w.started_at - r.starts_at))) > 12 * 3600 THEN 'matched to another day'
                   WHEN w.started_at > r.starts_at + interval '5 minutes' THEN 'late'
                   ELSE 'as rostered'
                 END
               WHEN r.starts_at > NOW() THEN 'upcoming'
               WHEN COALESCE(r.ends_at, r.starts_at + interval '12 hours') >= NOW() THEN 'no clock-on yet'
               WHEN r.employee_id IS NULL OR COALESCE(r.open_shift, false) THEN 'unfilled'
               ELSE 'no-show'
             END AS attendance_status
      FROM rostered r
      FULL OUTER JOIN worked w
        ON w.tenant_id = r.tenant_id AND w.roster_id = r.roster_id

    joins:
      - name: deputy_business
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_business}.tenant_id
      - name: deputy_employees
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_employees}.tenant_id
          AND {CUBE}.employee_id = {deputy_employees}.employee_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: roster_id
        sql: roster_id
        type: number
        public: false
      - name: timesheet_id
        sql: timesheet_id
        type: number
        public: false
      - name: employee_id
        sql: employee_id
        type: number
        public: false
      - name: employee_name
        sql: employee_name
        type: string
        title: Staff member
        description: The person who worked the shift, otherwise the person it was rostered for. Null on unfilled open shifts.
      - name: shift_date
        sql: shift_date
        type: time
        title: Shift date
        description: Business date of the shift - the rostered date, or the worked date for unrostered timesheets.
      - name: rostered_starts_at
        sql: rostered_starts_at
        type: time
        title: Rostered start
        description: Scheduled start (local time). Null for unrostered timesheets.
      - name: rostered_ends_at
        sql: rostered_ends_at
        type: time
        title: Rostered end
        description: Scheduled end (local time). Null for unrostered timesheets.
      - name: worked_started_at
        sql: worked_started_at
        type: time
        title: Actual clock-on
        description: When the person clocked on (local time). Null when no timesheet exists.
      - name: worked_ended_at
        sql: worked_ended_at
        type: time
        title: Actual clock-off
        description: When the person clocked off (local time). Null while still on shift or when no timesheet exists.
      - name: attendance_status
        sql: attendance_status
        type: string
        title: Attendance status
        description: >
          'as rostered', 'late', 'no-show', 'unfilled', 'unrostered',
          'no clock-on yet', 'upcoming' or 'matched to another day' (see the
          cube description for the exact rules; late means clocking on more
          than 5 minutes after the rostered start).
        meta:
          ai_context: >
            Filter with equals on these lower-case values. 'no-show' is an
            assigned person's past shift with no timesheet; 'unfilled' is a
            past shift nobody was assigned to; 'no clock-on yet' is a shift
            underway right now with no timesheet landed; 'matched to
            another day' is a timesheet Deputy linked to a roster on a
            different date (report as a mismatch, not lateness).
      - name: late_minutes
        sql: late_minutes
        type: number
        title: Minutes late
        description: Clock-on minus rostered start, in minutes (negative = clocked on early). Null when the shift has no roster or no timesheet.
      - name: unit_name
        sql: unit_name
        type: string
        title: Work area
        description: The Deputy area of the shift (rostered area, or worked area for unrostered timesheets).
      - name: company_name
        sql: company_name
        type: string
        title: Workplace
        description: The Deputy workplace (location) of the shift.
      - name: open_shift
        sql: open_shift
        type: boolean
        title: Was an open shift
        description: True when the rostered shift was offered for pickup rather than assigned.
      - name: published
        sql: published
        type: boolean
        title: Roster published
        public: false
      - name: weekday
        sql: "to_char(({CUBE}.shift_date AT TIME ZONE current_setting('TimeZone')), 'FMDay')"
        type: string
        title: Day of week
        description: Weekday name of the shift date (Monday ... Sunday), in the business time zone.
      - name: weekday_number
        sql: "EXTRACT(ISODOW FROM ({CUBE}.shift_date AT TIME ZONE current_setting('TimeZone')))"
        type: number
        title: Day of week (1 = Monday)
        description: ISO weekday number, for ordering weekday breakdowns Monday to Sunday.

    measures:
      - name: shift_count
        type: count
        title: Shifts
        description: Rows in the selection - rostered shifts plus unrostered worked timesheets.
      - name: rostered_shift_count
        type: count
        title: Rostered shifts
        description: Rows that have a roster (any attendance status except 'unrostered').
        filters:
          - sql: "{CUBE}.roster_id IS NOT NULL"
      - name: worked_shift_count
        type: count
        title: Worked shifts
        description: Rows that have a worked timesheet ('as rostered', 'late' or 'unrostered').
        filters:
          - sql: "{CUBE}.timesheet_id IS NOT NULL"
      - name: rostered_hours
        type: sum
        sql: rostered_hours
        title: Rostered hours
        description: Scheduled hours on the rostered shifts in the selection (0 for unrostered timesheets).
      - name: worked_hours
        type: sum
        sql: worked_hours
        title: Worked hours
        description: Paid hours actually worked on the same shifts (0 for no-shows, unfilled and upcoming shifts).
      - name: hours_variance
        type: number
        sql: "{worked_hours} - {rostered_hours}"
        title: Hours variance (worked minus rostered)
        description: Worked hours minus rostered hours; negative means less was worked than scheduled.
      - name: rostered_cost
        type: sum
        sql: rostered_cost
        format: currency
        title: Rostered wage cost
        description: Deputy's planned cost of the rostered shifts at contract pay rates (costed shifts only; equals the loaded cost when Deputy has no on-cost rules, as for this tenant).
      - name: actual_cost
        type: sum
        sql: actual_cost
        format: currency
        title: Actual wage cost
        description: Deputy's wage cost of the worked timesheets on the same shifts (costed shifts only, no super or on-costs).
      - name: cost_variance
        type: number
        sql: "{actual_cost} - {rostered_cost}"
        format: currency
        title: Cost variance (actual minus rostered)
        description: Actual wage cost minus rostered wage cost.
      - name: as_rostered_count
        type: count
        title: Shifts worked as rostered
        description: Rostered shifts clocked on within 5 minutes of (or before) the rostered start.
        filters:
          - sql: "{CUBE}.attendance_status = 'as rostered'"
      - name: late_count
        type: count
        title: Late arrivals
        description: Rostered shifts clocked on more than 5 minutes after the rostered start.
        filters:
          - sql: "{CUBE}.attendance_status = 'late'"
      - name: no_show_count
        type: count
        title: No-shows
        description: Assigned rostered shifts in the past with no timesheet at all.
        filters:
          - sql: "{CUBE}.attendance_status = 'no-show'"
      - name: unfilled_count
        type: count
        title: Unfilled shifts
        description: Past rostered shifts that were never assigned to anyone and were not worked.
        filters:
          - sql: "{CUBE}.attendance_status = 'unfilled'"
      - name: unrostered_count
        type: count
        title: Unrostered shifts worked
        description: Worked timesheets with no matching roster.
        filters:
          - sql: "{CUBE}.attendance_status = 'unrostered'"
      - name: avg_late_minutes
        type: avg
        sql: late_minutes
        title: Average minutes late (late shifts)
        description: Mean lateness over shifts classified 'late'.
        filters:
          - sql: "{CUBE}.attendance_status = 'late'"

  - name: deputy_lightspeed_daily_labour_sales
    title: Daily labour-to-sales (Deputy x Lightspeed)
    public: false
    description: >
      One row per tenant and local calendar day: Lightspeed completed,
      non-voided sales (transaction count, tax-inclusive takings, ex-tax net
      sales) and Deputy worked timesheets (hours, costed hours, wage cost)
      aggregated independently to the day and FULL OUTER JOINed, so
      labour-to-sales ratios are safe in one query. Both sides bucket by the
      business time zone; the tenant has one workplace and one shop, so no
      location split is modelled.
    meta:
      ai_context: >
        Use for labour cost as a percentage of sales, sales per labour hour
        and transactions per labour hour by day, week or month: "labour cost
        as % of sales by week" = labour_cost_pct with business_date at week
        granularity. Ratios divide period totals (never average daily
        percentages). labour_cost_pct is against ex-GST net sales
        (tax-inclusive total minus tax); labour_cost_pct_of_takings is
        against tax-inclusive gross_takings - say which basis you used.
        Wage cost is Deputy's pay-rate estimate for worked, costed shifts
        (no super or on-costs; uncosted shifts add hours but $0), so the
        percentage understates the true wage bill, which lives in Xero.
        Sales here are whole-business per day; sales per staff member are
        not here (sales_analytics).
    sql: >
      WITH sales_rows AS (
        SELECT s.tenant_id,
               (s.complete_time AT TIME ZONE current_setting('TimeZone'))::date AS business_date,
               s.calc_total,
               s.calc_total - COALESCE(s.calc_tax1, 0) - COALESCE(s.calc_tax2, 0) AS net_ex_tax
        FROM source_lightspeed_official.ls_sales s
        WHERE s.tenant_id = (SELECT ingestion.current_tenant_id())
          AND NOT COALESCE(s.tombstone, false)
          AND s.completed = true
          AND COALESCE(s.voided, false) = false
          AND s.complete_time IS NOT NULL
      ), sales_by_day AS (
        SELECT tenant_id, business_date,
               COUNT(*) AS transaction_count,
               SUM(calc_total) AS gross_takings,
               SUM(net_ex_tax) AS net_sales_ex_tax
        FROM sales_rows
        GROUP BY tenant_id, business_date
      ), labour_rows AS (
        SELECT t.tenant_id,
               (t.shift_date AT TIME ZONE current_setting('TimeZone'))::date AS business_date,
               t.paid_hours, t.wage_cost
        FROM source_deputy.dp_timesheets t
        WHERE NOT COALESCE(t.is_leave, false)
      ), labour_by_day AS (
        SELECT tenant_id, business_date,
               COUNT(*) AS worked_shift_count,
               SUM(paid_hours) AS hours_worked,
               SUM(paid_hours) FILTER (WHERE COALESCE(wage_cost, 0) > 0) AS costed_hours,
               SUM(wage_cost) AS wage_cost
        FROM labour_rows
        GROUP BY tenant_id, business_date
      )
      SELECT COALESCE(s.tenant_id, l.tenant_id) || ':' || COALESCE(s.business_date, l.business_date)::text AS row_key,
             COALESCE(s.tenant_id, l.tenant_id) AS tenant_id,
             COALESCE(s.business_date, l.business_date) AS business_date,
             COALESCE(s.transaction_count, 0) AS transaction_count,
             COALESCE(s.gross_takings, 0) AS gross_takings,
             COALESCE(s.net_sales_ex_tax, 0) AS net_sales_ex_tax,
             COALESCE(l.worked_shift_count, 0) AS worked_shift_count,
             COALESCE(l.hours_worked, 0) AS hours_worked,
             COALESCE(l.costed_hours, 0) AS costed_hours,
             COALESCE(l.wage_cost, 0) AS wage_cost
      FROM sales_by_day s
      FULL OUTER JOIN labour_by_day l
        ON l.tenant_id = s.tenant_id AND l.business_date = s.business_date

    joins:
      - name: deputy_business
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {deputy_business}.tenant_id

    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: business_date
        sql: business_date
        type: time
        title: Business date
        description: Local calendar day the sales were completed and the shifts were worked.
      - name: weekday
        sql: "to_char({CUBE}.business_date, 'FMDay')"
        type: string
        title: Day of week
        description: Weekday name of the business date (Monday ... Sunday).
      - name: weekday_number
        sql: "EXTRACT(ISODOW FROM {CUBE}.business_date)"
        type: number
        title: Day of week (1 = Monday)
        description: ISO weekday number, for ordering weekday breakdowns Monday to Sunday.

    measures:
      - name: transaction_count
        type: sum
        sql: transaction_count
        title: Transactions
        description: Completed, non-voided Lightspeed sale transactions (refund transactions included).
      - name: gross_takings
        type: sum
        sql: gross_takings
        format: currency
        title: Gross takings (tax inclusive)
        description: Tax-inclusive takings on completed, non-voided sales (refunds subtract) - the sales_analytics gross_takings basis.
      - name: net_sales_ex_tax
        type: sum
        sql: net_sales_ex_tax
        format: currency
        title: Net sales (ex tax)
        description: Takings minus GST on completed, non-voided sales, after discounts (refunds subtract).
      - name: hours_worked
        type: sum
        sql: hours_worked
        title: Hours worked
        description: Paid hours on worked Deputy timesheets that day (leave excluded).
      - name: costed_hours
        type: sum
        sql: costed_hours
        title: Costed hours
        description: Worked hours on timesheets that carry a wage cost.
      - name: wage_cost
        type: sum
        sql: wage_cost
        format: currency
        title: Wage cost
        description: Deputy wage cost of the worked timesheets that day (costed shifts only, no super or on-costs).
      - name: labour_cost_pct
        type: number
        sql: "100.0 * {wage_cost} / NULLIF({net_sales_ex_tax}, 0)"
        format: percent
        title: Labour cost % of net sales (ex tax)
        description: Wage cost as a percentage of ex-tax net sales over the selected period.
      - name: labour_cost_pct_of_takings
        type: number
        sql: "100.0 * {wage_cost} / NULLIF({gross_takings}, 0)"
        format: percent
        title: Labour cost % of gross takings
        description: Wage cost as a percentage of tax-inclusive takings over the selected period.
      - name: sales_per_labour_hour
        type: number
        sql: "{net_sales_ex_tax} / NULLIF({hours_worked}, 0)"
        format: currency
        title: Net sales per labour hour
        description: Ex-tax net sales divided by hours worked over the selected period.
      - name: transactions_per_labour_hour
        type: number
        sql: "{transaction_count} / NULLIF({hours_worked}, 0)"
        title: Transactions per labour hour
        description: Completed transactions divided by hours worked over the selected period.
