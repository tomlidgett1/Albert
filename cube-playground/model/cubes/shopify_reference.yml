  - name: shopify_metafield_values
    title: Shopify metafield observations
    public: false
    description: >
      One row per observed metafield. Literal values are deliberately replaced
      with null inside Cube because any merchant namespace can contain personal
      or confidential data; identity, type, size and freshness remain queryable.
    meta:
      ai_context: >
        Report whether a metafield exists, where it is attached, its type and
        freshness. Never claim or reveal its literal through Cube; safe literal
        interpretation requires a separately approved classification.
    sql: >
      SELECT t.tenant_id, t.namespaced_source_key, t.connection_id,
             t.external_account_reference, t.source_record_id,
             t.source_version, t.source_updated_at, t.payload_hash,
             t.payload_batch_id, t.sync_run_id, t.tombstone,
             t.id, t.legacy_resource_id, t.definition_id, t.owner_id,
             t.owner_type, t.owner_graphql_type, t.namespace, t.key,
             t.metafield_type, t.size_in_bytes, t.compare_digest,
             t.created_at, t.updated_at,
             NULL::text AS value,
             NULL::jsonb AS json_value,
             NULL::numeric AS numeric_value,
             NULL::boolean AS boolean_value,
             NULL::timestamptz AS datetime_value
      FROM source_shopify.shopify_metafield_values t
      WHERE NOT t.tombstone
        AND NOT EXISTS (
          SELECT 1 FROM quality.shopify_connection_queryability_blocks b
          WHERE b.tenant_id=t.tenant_id AND b.connection_id=t.connection_id
        )
    joins:
      - name: shopify_metafield_definitions
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {shopify_metafield_definitions}.tenant_id
          AND {CUBE}.connection_id = {shopify_metafield_definitions}.connection_id
          AND {CUBE}.definition_id = {shopify_metafield_definitions}.definition_id
    dimensions:
      - name: row_key
        sql: namespaced_source_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: connection_id
        sql: connection_id
        type: string
        public: false
      - name: metafield_id
        sql: id
        type: string
      - name: legacy_resource_id
        sql: legacy_resource_id
        type: string
      - name: definition_id
        sql: definition_id
        type: string
      - name: owner_id
        sql: owner_id
        type: string
      - name: owner_type
        sql: owner_type
        type: string
      - name: owner_graphql_type
        sql: owner_graphql_type
        type: string
      - name: namespace
        sql: namespace
        type: string
      - name: key
        sql: key
        type: string
      - name: metafield_type
        sql: metafield_type
        type: string
      - name: value
        sql: value
        type: string
        public: false
        description: Always null in Cube; literal values are unclassified sensitive data.
      - name: json_value
        sql: json_value::text
        type: string
        public: false
        description: Always null in Cube; literal values are unclassified sensitive data.
      - name: numeric_value
        sql: numeric_value
        type: number
        public: false
      - name: boolean_value
        sql: boolean_value
        type: boolean
        public: false
      - name: datetime_value
        sql: datetime_value
        type: time
        public: false
      - name: size_in_bytes
        sql: size_in_bytes
        type: number
      - name: compare_digest
        sql: compare_digest
        type: string
        public: false
      - name: created_at
        sql: created_at
        type: time
      - name: updated_at
        sql: updated_at
        type: time
      - name: value_state
        sql: "'Observed — literal redacted'"
        type: string
    measures:
      - name: metafield_count
        type: count
      - name: owners_with_metafields
        type: count_distinct
        sql: owner_id
