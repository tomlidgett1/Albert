      - name: uploaded_by
        sql: uploaded_by
        type: string
      - name: created_at
        sql: created_at
        type: time
        title: Uploaded
      - name: updated_at
        sql: updated_at
        type: time
        public: false
    measures:
      - name: file_count
        type: count
        title: Files
      - name: total_size_bytes
        type: sum
        sql: size_bytes
        title: Total size (bytes)

  - name: xero_file_associations
    title: File associations (Xero)
    public: false
    description: One row per link between a library file and a document (invoice, contact...).
    sql: SELECT * FROM source_xero_official.xo_file_associations
    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_files
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_files}.tenant_id
          AND {CUBE}.file_id = {xero_files}.file_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: file_id
        sql: file_id
        type: string
        public: false
      - name: object_id
        sql: object_id
        type: string
        public: false
      - name: object_type
        sql: object_type
        type: string
        description: The kind of record the file is attached to.
