      - name: user_count
        type: count
        title: Users with access

  - name: xero_branding_themes
    title: Branding themes (Xero)
    public: false
    description: One row per invoice branding theme.
    sql: SELECT * FROM source_xero_official.xo_branding_themes

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: branding_theme_id
        sql: branding_theme_id
        type: string
        public: false
      - name: theme_name
        sql: theme_name
        type: string
        title: Branding theme
      - name: theme_type
        sql: theme_type
        type: string
        public: false
      - name: sort_order
        sql: sort_order
        type: number
        public: false
      - name: created_at
        sql: created_at
        type: time
        public: false
    measures:
      - name: theme_count
        type: count

  - name: xero_budgets
    title: Budgets (Xero)
    public: false
    description: >
      One row per budget defined in Xero (the overall budget and any tracking
      budgets).
    sql: SELECT * FROM source_xero_official.xo_budgets

    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: budget_id
        sql: budget_id
        type: string
        public: false
      - name: budget_type
        sql: budget_type
        type: string
        description: OVERALL or TRACKING.
      - name: description
        sql: description
        type: string
        title: Budget
      - name: status
        sql: status
        type: string
        public: false
      - name: updated_at
        sql: updated_at
        type: time
        public: false
    measures:
      - name: budget_count
        type: count

  - name: xero_assets
    title: Fixed assets (Xero)
    public: false
    description: >
      One row per fixed asset registered in Xero: purchase date and price,
      current book value, accumulated depreciation and depreciation settings.
    meta:
      ai_context: >
        The fixed asset register. "What assets do I own", "asset value",
        "depreciation" = purchase_price / book_value / accumulated
        depreciation here. status: DRAFT, REGISTERED or DISPOSED.
    sql: SELECT * FROM source_xero_official.xo_assets
    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
      - name: xero_asset_types
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_asset_types}.tenant_id
          AND {CUBE}.asset_type_id = {xero_asset_types}.asset_type_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: asset_id
        sql: asset_id
        type: string
        public: false
      - name: asset_name
        sql: asset_name
        type: string
        title: Asset
      - name: asset_number
        sql: asset_number
        type: string
      - name: status
        sql: status
        type: string
        description: >
          Exactly 'Registered', 'Draft' or 'Disposed' (mixed case, NOT
          uppercase). Filter with these exact values.
      - name: purchased_on
        sql: purchased_on
        type: time
        title: Purchase date
      - name: purchase_price_value
        sql: purchase_price
        type: number
        title: Purchase price
      - name: disposal_price_value
        sql: disposal_price
        type: number
      - name: book_value_amount
        sql: book_value
        type: number
        title: Current book value
      - name: asset_type_id
        sql: asset_type_id
        type: string
        public: false
      - name: depreciation_method
        sql: depreciation_method
        type: string
        description: StraightLine, DiminishingValue100/150/200, FullDepreciation or NoDepreciation.
      - name: depreciation_calculation_method
        sql: depreciation_calculation_method
        type: string
        public: false
      - name: depreciation_started_on
        sql: depreciation_started_on
        type: time
        public: false
      - name: prior_accumulated_depreciation
        sql: prior_accumulated_depreciation
        type: number
        public: false
      - name: current_accumulated_depreciation
        sql: current_accumulated_depreciation
        type: number
        title: Accumulated depreciation (current FY)
      - name: current_gain_loss
        sql: current_gain_loss
        type: number
        public: false
    measures:
      - name: asset_count
        type: count
        title: Assets
      - name: total_purchase_price
        type: sum
        sql: purchase_price
        format: currency
        title: Total purchase cost
      - name: total_book_value
        type: sum
        sql: book_value
        format: currency
        title: Total book value
      - name: total_accumulated_depreciation
        type: sum
        sql: current_accumulated_depreciation
        format: currency
        title: Accumulated depreciation
    segments:
      - name: registered_assets
        sql: "{CUBE}.status = 'Registered'"

  - name: xero_asset_types
    title: Asset types (Xero)
    public: false
    description: One row per fixed asset type with its default depreciation settings.
    sql: SELECT * FROM source_xero_official.xo_asset_types

    joins:
