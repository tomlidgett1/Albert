    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: asset_type_id
        sql: asset_type_id
        type: string
        public: false
      - name: asset_type_name
        sql: asset_type_name
        type: string
        title: Asset type
      - name: fixed_asset_account_id
        sql: fixed_asset_account_id
        type: string
        public: false
      - name: depreciation_expense_account_id
        sql: depreciation_expense_account_id
        type: string
        public: false
      - name: accumulated_depreciation_account_id
        sql: accumulated_depreciation_account_id
        type: string
        public: false
      - name: depreciation_method
        sql: depreciation_method
        type: string
      - name: depreciation_rate
        sql: depreciation_rate
        type: number
        description: Annual depreciation rate percentage.
    measures:
      - name: asset_type_count
        type: count

