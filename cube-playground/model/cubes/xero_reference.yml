    joins:
      - name: xero_organisation
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {xero_organisation}.tenant_id
    dimensions:
      - name: row_key
        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: user_id
        sql: user_id
        type: string
        public: false
      - name: first_name
        sql: first_name
        type: string
        public: false
      - name: last_name
        sql: last_name
        type: string
        public: false
      - name: email
        sql: email
        type: string
        public: false
      - name: organisation_role
        sql: organisation_role
        type: string
        title: Role
        description: STANDARD, ADMIN, READONLY, INVOICEONLY...
      - name: is_subscriber
        sql: is_subscriber
        type: boolean
        description: True for the user who owns the Xero subscription.
      - name: updated_at
        sql: updated_at
        type: time
        public: false
