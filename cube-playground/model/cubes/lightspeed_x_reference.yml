  - name: lightspeed_x_price_books
    title: Lightspeed X-Series price books
    public: false
    description: Price-book definitions and their date, platform, outlet and customer-group scope.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_price_books t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: price_book_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: price_book_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Price book }
      - { name: price_book_type, sql: "{CUBE}.payload_json->>'type'", type: string }
      - { name: platform_scope, sql: "{CUBE}.payload_json->>'restrict_to_platform_label'", type: string }
      - { name: outlet_count, sql: "jsonb_array_length(COALESCE({CUBE}.payload_json->'outlets', '[]'::jsonb))", type: number }
      - { name: customer_group_count, sql: "jsonb_array_length(COALESCE({CUBE}.payload_json->'customer_group_ids', '[]'::jsonb))", type: number }
      - { name: valid_from, sql: "({CUBE}.payload_json->>'valid_from')::timestamptz", type: time }
      - { name: valid_to, sql: "({CUBE}.payload_json->>'valid_to')::timestamptz", type: time }
      - { name: created_at, sql: "({CUBE}.payload_json->>'created_at')::timestamptz", type: time }
      - { name: updated_at, sql: "({CUBE}.payload_json->>'updated_at')::timestamptz", type: time }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
      - name: is_currently_valid
        sql: >
          ({CUBE}.payload_json->>'deleted_at' IS NULL
           AND ({CUBE}.payload_json->>'valid_from' IS NULL OR ({CUBE}.payload_json->>'valid_from')::timestamptz <= NOW())
           AND ({CUBE}.payload_json->>'valid_to' IS NULL OR ({CUBE}.payload_json->>'valid_to')::timestamptz >= NOW()))
        type: boolean
    measures:
      - { name: price_books, type: count }
      - name: currently_valid_price_books
        type: count
        filters:
          - sql: >
              {CUBE}.payload_json->>'deleted_at' IS NULL
              AND ({CUBE}.payload_json->>'valid_from' IS NULL OR ({CUBE}.payload_json->>'valid_from')::timestamptz <= NOW())
              AND ({CUBE}.payload_json->>'valid_to' IS NULL OR ({CUBE}.payload_json->>'valid_to')::timestamptz >= NOW())

  - name: lightspeed_x_price_book_products
    title: Lightspeed X-Series price-book product prices
    public: false
    description: One current price rule per price-book/product association.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_price_book_products t
      WHERE NOT t.tombstone
    joins:
      - name: lightspeed_x_price_books
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_price_books}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_price_books}.connection_id
          AND {CUBE}.payload_json->>'price_book_id' = {lightspeed_x_price_books}.payload_json->>'id'
      - name: lightspeed_x_products
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_products}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_products}.connection_id
          AND {CUBE}.payload_json->>'product_id' = {lightspeed_x_products}.payload_json->>'id'
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: price_book_product_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: price_book_id, sql: "{CUBE}.payload_json->>'price_book_id'", type: string, public: false }
      - { name: product_id, sql: "{CUBE}.payload_json->>'product_id'", type: string, public: false }
      - { name: adjustment_type, sql: "{CUBE}.payload_json->>'adjustment_type'", type: string }
      - { name: rounding, sql: "{CUBE}.payload_json->>'rounding'", type: string }
      - { name: price, sql: "NULLIF({CUBE}.payload_json->>'price', '')::numeric", type: number, format: currency }
      - { name: default_display_price, sql: "NULLIF({CUBE}.payload_json->>'default_display_price', '')::numeric", type: number, format: currency }
      - { name: adjustment, sql: "NULLIF({CUBE}.payload_json->>'adjustment', '')::numeric", type: number }
      - { name: discount, sql: "NULLIF({CUBE}.payload_json->>'discount', '')::numeric", type: number, format: currency }
      - { name: retail_tax, sql: "NULLIF({CUBE}.payload_json->>'retail_tax', '')::numeric", type: number, format: currency }
      - { name: loyalty_value, sql: "NULLIF({CUBE}.payload_json->>'loyalty_value', '')::numeric", type: number }
      - { name: min_units, sql: "NULLIF({CUBE}.payload_json->>'min_units', '')::numeric", type: number }
      - { name: max_units, sql: "NULLIF({CUBE}.payload_json->>'max_units', '')::numeric", type: number }
      - { name: created_at, sql: "({CUBE}.payload_json->>'created_at')::timestamptz", type: time }
      - { name: updated_at, sql: "({CUBE}.payload_json->>'updated_at')::timestamptz", type: time }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
    measures:
      - { name: price_book_product_rules, type: count }
      - { name: average_price_book_price, sql: "NULLIF({CUBE}.payload_json->>'price', '')::numeric", type: avg, format: currency }
      - { name: minimum_price_book_price, sql: "NULLIF({CUBE}.payload_json->>'price', '')::numeric", type: min, format: currency }
      - { name: maximum_price_book_price, sql: "NULLIF({CUBE}.payload_json->>'price', '')::numeric", type: max, format: currency }

  - name: lightspeed_x_taxes
    title: Lightspeed X-Series taxes
    public: false
    description: Tax groups with potentially multiple component rates.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_taxes t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: tax_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: tax_name, sql: "COALESCE({CUBE}.payload_json->>'display_name', {CUBE}.payload_json->>'name')", type: string, title: Tax }
      - { name: is_default, sql: "COALESCE(({CUBE}.payload_json->>'is_default')::boolean, false)", type: boolean }
      - { name: component_rate_count, sql: "jsonb_array_length(COALESCE({CUBE}.payload_json->'rates', '[]'::jsonb))", type: number }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
    measures:
      - { name: tax_groups, type: count }

  - name: lightspeed_x_tax_rates
    title: Lightspeed X-Series tax component rates
    public: false
    description: One row per component rate nested under an X-Series tax group.
    sql: >
      SELECT CONCAT(t.namespaced_source_key, ':rate:', COALESCE(rate.value->>'id', rate.ordinality::text)) AS row_key,
             t.tenant_id, t.connection_id, t.payload_json AS tax_payload, rate.value AS rate_payload
      FROM source_lightspeed_x.lx_taxes t
      CROSS JOIN LATERAL jsonb_array_elements(COALESCE(t.payload_json->'rates', '[]'::jsonb))
        WITH ORDINALITY AS rate(value, ordinality)
      WHERE NOT t.tombstone
    joins:
      - name: lightspeed_x_taxes
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_taxes}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_taxes}.connection_id
          AND {CUBE}.tax_payload->>'id' = {lightspeed_x_taxes}.payload_json->>'id'
    dimensions:
      - { name: row_key, sql: row_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: tax_id, sql: "tax_payload->>'id'", type: string, public: false }
      - { name: tax_rate_id, sql: "rate_payload->>'id'", type: string, public: false }
      - { name: tax_rate_name, sql: "COALESCE(rate_payload->>'display_name', rate_payload->>'name')", type: string, title: Tax rate }
      - { name: tax_rate_pct, sql: "100.0 * NULLIF(rate_payload->>'rate', '')::numeric", type: number, format: percent, description: Source rate converted from fraction to percent. }
    measures:
      - { name: tax_rates, type: count }
      - { name: average_tax_rate_pct, sql: "100.0 * NULLIF(rate_payload->>'rate', '')::numeric", type: avg, format: percent }

