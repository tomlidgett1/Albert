cubes:
  - name: lightspeed_x_retailer
    title: Lightspeed X-Series retailer
    public: false
    description: One row per connected X-Series retailer account and its reporting defaults.
    meta:
      ai_context: >
        Account configuration only. Currency values elsewhere are already decimal
        major units in this retailer's/outlet's currency. Outlet timezone overrides
        the retailer timezone for outlet-associated business dates.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_retailer t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: retailer_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: retailer_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Retailer }
      - { name: account_status, sql: "{CUBE}.payload_json->>'account_status'", type: string }
      - { name: account_type, sql: "{CUBE}.payload_json->>'account_type'", type: string }
      - { name: country_code, sql: "{CUBE}.payload_json->>'country'", type: string }
      - { name: culture, sql: "{CUBE}.payload_json->>'culture'", type: string }
      - { name: currency_code, sql: "jsonb_extract_path_text({CUBE}.payload_json, 'currency', 'code')", type: string }
      - { name: currency_symbol, sql: "jsonb_extract_path_text({CUBE}.payload_json, 'currency', 'symbol')", type: string }
      - { name: retailer_timezone, sql: "{CUBE}.payload_json->>'timezone'", type: string }
      - { name: domain_prefix, sql: "{CUBE}.payload_json->>'domain_prefix'", type: string, public: false }
      - { name: tax_exclusive, sql: "COALESCE(({CUBE}.payload_json->>'tax_exclusive')::boolean, false)", type: boolean }
      - { name: gift_cards_enabled, sql: "COALESCE((jsonb_extract_path_text({CUBE}.payload_json, 'gift_cards', 'enabled'))::boolean, false)", type: boolean }
      - { name: gift_cards_never_enabled, sql: "COALESCE((jsonb_extract_path_text({CUBE}.payload_json, 'gift_cards', 'never_enabled'))::boolean, false)", type: boolean }
      - { name: loyalty_enabled, sql: "COALESCE((jsonb_extract_path_text({CUBE}.payload_json, 'loyalty', 'enabled'))::boolean, false)", type: boolean }
      - { name: loyalty_ratio, sql: "NULLIF(jsonb_extract_path_text({CUBE}.payload_json, 'loyalty', 'ratio'), '')::numeric", type: number }
      - { name: store_credit_enabled, sql: "COALESCE(({CUBE}.payload_json->>'store_credit')::boolean, false)", type: boolean }
      - { name: automatic_sku_enabled, sql: "COALESCE((jsonb_extract_path_text({CUBE}.payload_json, 'sku_sequence', 'enabled'))::boolean, false)", type: boolean }
      - { name: created_at, sql: "({CUBE}.payload_json->>'created_at')::timestamptz", type: time }
      - { name: activated_at, sql: "({CUBE}.payload_json->>'activated_at')::timestamptz", type: time }
    measures:
      - { name: retailer_accounts, type: count }

  - name: lightspeed_x_outlets
    title: Lightspeed X-Series outlets
    public: false
    description: One row per X-Series outlet, including deleted lifecycle records.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_outlets t
      WHERE NOT t.tombstone
    joins:
      - name: lightspeed_x_retailer
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_retailer}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_retailer}.connection_id
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: outlet_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: outlet_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Outlet }
      - { name: currency_code, sql: "{CUBE}.payload_json->>'currency'", type: string }
      - { name: currency_symbol, sql: "{CUBE}.payload_json->>'currency_symbol'", type: string }
      - { name: display_prices, sql: "{CUBE}.payload_json->>'display_prices'", type: string, description: inclusive or exclusive. }
      - { name: outlet_timezone, sql: "{CUBE}.payload_json->>'time_zone'", type: string }
      - { name: city, sql: "{CUBE}.payload_json->>'physical_city'", type: string }
      - { name: suburb, sql: "{CUBE}.payload_json->>'physical_suburb'", type: string }
      - { name: state, sql: "{CUBE}.payload_json->>'physical_state'", type: string }
      - { name: postcode, sql: "{CUBE}.payload_json->>'physical_postcode'", type: string }
      - { name: country_code, sql: "{CUBE}.payload_json->>'physical_country_id'", type: string }
      - { name: latitude, sql: "NULLIF({CUBE}.payload_json->>'latitude', '')::numeric", type: number }
      - { name: longitude, sql: "NULLIF({CUBE}.payload_json->>'longitude', '')::numeric", type: number }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
      - { name: is_active, sql: "({CUBE}.payload_json->>'deleted_at' IS NULL)", type: boolean }
      - { name: email, sql: "{CUBE}.payload_json->>'email'", type: string, public: false }
      - { name: phone, sql: "{CUBE}.payload_json->>'phone'", type: string, public: false }
      - { name: physical_address_1, sql: "{CUBE}.payload_json->>'physical_address_1'", type: string, public: false }
      - { name: physical_address_2, sql: "{CUBE}.payload_json->>'physical_address_2'", type: string, public: false }
    measures:
      - { name: outlets, type: count }
      - name: active_outlets
        type: count
        filters: [{ sql: "{CUBE}.payload_json->>'deleted_at' IS NULL" }]

  - name: lightspeed_x_registers
    title: Lightspeed X-Series registers
    public: false
    description: One row per register and its current open/closed state.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_registers t
      WHERE NOT t.tombstone
    joins:
      - name: lightspeed_x_outlets
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_outlets}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_outlets}.connection_id
          AND {CUBE}.payload_json->>'outlet_id' = {lightspeed_x_outlets}.payload_json->>'id'
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: register_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: outlet_id, sql: "{CUBE}.payload_json->>'outlet_id'", type: string, public: false }
      - { name: register_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Register }
      - { name: is_open, sql: "COALESCE(({CUBE}.payload_json->>'is_open')::boolean, false)", type: boolean }
      - { name: invoice_prefix, sql: "{CUBE}.payload_json->>'invoice_prefix'", type: string }
      - { name: invoice_suffix, sql: "{CUBE}.payload_json->>'invoice_suffix'", type: string }
      - { name: invoice_sequence, sql: "NULLIF({CUBE}.payload_json->>'invoice_sequence', '')::numeric", type: number }
      - { name: print_receipt, sql: "COALESCE(({CUBE}.payload_json->>'print_receipt')::boolean, false)", type: boolean }
      - { name: email_receipt, sql: "COALESCE(({CUBE}.payload_json->>'email_receipt')::boolean, false)", type: boolean }
      - { name: ask_for_user_on_sale, sql: "COALESCE(({CUBE}.payload_json->>'ask_for_user_on_sale')::boolean, false)", type: boolean }
      - { name: opened_at, sql: "({CUBE}.payload_json->>'register_open_time')::timestamptz", type: time }
      - { name: closed_at, sql: "({CUBE}.payload_json->>'register_close_time')::timestamptz", type: time }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
      - { name: is_active, sql: "({CUBE}.payload_json->>'deleted_at' IS NULL)", type: boolean }
    measures:
      - { name: registers, type: count }
      - name: active_registers
        type: count
        filters: [{ sql: "{CUBE}.payload_json->>'deleted_at' IS NULL" }]
      - name: open_registers
        type: count
        filters: [{ sql: "COALESCE(({CUBE}.payload_json->>'is_open')::boolean, false)" }]

  - name: lightspeed_x_users
    title: Lightspeed X-Series users
    public: false
    description: >
      One row per X-Series user. Curated members omit login and contact details;
      those remain tenant-scoped in the source explorer for explicit requests.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_users t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: user_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: display_name, sql: "{CUBE}.payload_json->>'display_name'", type: string, title: User }
      - { name: account_type, sql: "{CUBE}.payload_json->>'account_type'", type: string }
      - { name: enabled, sql: "COALESCE(({CUBE}.payload_json->>'enabled')::boolean, false)", type: boolean }
      - { name: is_primary_user, sql: "COALESCE(({CUBE}.payload_json->>'is_primary_user')::boolean, false)", type: boolean }
      - { name: mfa_enabled, sql: "({CUBE}.payload_json->'enabled_mfa' IS NOT NULL AND {CUBE}.payload_json->'enabled_mfa' <> 'null'::jsonb)", type: boolean }
      - { name: restricted_outlet_count, sql: "jsonb_array_length(COALESCE({CUBE}.payload_json->'restricted_outlet_ids', '[]'::jsonb))", type: number }
      - { name: daily_sales_target, sql: "NULLIF({CUBE}.payload_json->>'target_daily', '')::numeric", type: number, format: currency }
      - { name: weekly_sales_target, sql: "NULLIF({CUBE}.payload_json->>'target_weekly', '')::numeric", type: number, format: currency }
      - { name: monthly_sales_target, sql: "NULLIF({CUBE}.payload_json->>'target_monthly', '')::numeric", type: number, format: currency }
      - { name: created_at, sql: "({CUBE}.payload_json->>'created_at')::timestamptz", type: time }
      - { name: updated_at, sql: "({CUBE}.payload_json->>'updated_at')::timestamptz", type: time }
      - { name: last_seen_at, sql: "({CUBE}.payload_json->>'seen_at')::timestamptz", type: time }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
      - { name: email, sql: "{CUBE}.payload_json->>'email'", type: string, public: false }
      - { name: username, sql: "{CUBE}.payload_json->>'username'", type: string, public: false }
    measures:
      - { name: users, type: count }
      - name: enabled_users
        type: count
        filters: [{ sql: "COALESCE(({CUBE}.payload_json->>'enabled')::boolean, false) AND {CUBE}.payload_json->>'deleted_at' IS NULL" }]
      - name: mfa_enabled_users
        type: count
        filters: [{ sql: "{CUBE}.payload_json->'enabled_mfa' IS NOT NULL AND {CUBE}.payload_json->'enabled_mfa' <> 'null'::jsonb" }]

  - name: lightspeed_x_product_categories
    title: Lightspeed X-Series product categories
    public: false
    description: Hierarchical product categories, including root and parent relationships.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_product_categories t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: category_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: category_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Product category }
      - { name: parent_category_id, sql: "{CUBE}.payload_json->>'parent_category_id'", type: string, public: false }
      - { name: root_category_id, sql: "{CUBE}.payload_json->>'root_category_id'", type: string, public: false }
      - { name: is_leaf_category, sql: "COALESCE(({CUBE}.payload_json->>'leaf_category')::boolean, false)", type: boolean }
      - { name: category_path, sql: "CAST({CUBE}.payload_json->'category_path' AS text)", type: string }
    measures:
      - { name: categories, type: count }
      - name: leaf_categories
        type: count
        filters: [{ sql: "COALESCE(({CUBE}.payload_json->>'leaf_category')::boolean, false)" }]

  - name: lightspeed_x_product_types
    title: Lightspeed X-Series product types
    public: false
    description: X-Series product type hierarchy.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_product_types t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: product_type_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: product_type_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Product type }
      - { name: is_leaf_type, sql: "COALESCE(({CUBE}.payload_json->>'leaf_category')::boolean, false)", type: boolean }
      - { name: category_path, sql: "CAST({CUBE}.payload_json->'category_path' AS text)", type: string }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
    measures:
      - { name: product_types, type: count }

  - name: lightspeed_x_brands
    title: Lightspeed X-Series brands
    public: false
    description: Merchant product brands/manufacturers.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_brands t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: brand_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: brand_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Brand }
      - { name: description, sql: "{CUBE}.payload_json->>'description'", type: string }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
    measures:
      - { name: brands, type: count }

  - name: lightspeed_x_suppliers
    title: Lightspeed X-Series suppliers
    public: false
    description: Supplier master data; supplier contact details are deliberately private.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_suppliers t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: supplier_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: supplier_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Supplier }
      - { name: source, sql: "{CUBE}.payload_json->>'source'", type: string }
      - { name: description, sql: "{CUBE}.payload_json->>'description'", type: string }
      - { name: default_markup_pct, sql: "NULLIF({CUBE}.payload_json->>'default_markup', '')::numeric", type: number, format: percent }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
      - { name: contact_json, sql: "CAST({CUBE}.payload_json->'contact' AS text)", type: string, public: false }
    measures:
      - { name: suppliers, type: count }
      - name: active_suppliers
        type: count
        filters: [{ sql: "{CUBE}.payload_json->>'deleted_at' IS NULL" }]

  - name: lightspeed_x_products
    title: Lightspeed X-Series products and variants
    public: false
    description: >
      One row per X-Series Product object. A row may be a family/root or sellable
      variant; variant_parent_id and family_id preserve those relationships.
      Prices and supply cost are current catalogue snapshots, not revenue flows.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_products t
      WHERE NOT t.tombstone
    joins:
      - name: lightspeed_x_product_categories
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_product_categories}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_product_categories}.connection_id
          AND COALESCE(jsonb_extract_path_text({CUBE}.payload_json, 'product_category', 'id'), jsonb_extract_path_text({CUBE}.payload_json, 'categories', '0', 'id')) = {lightspeed_x_product_categories}.payload_json->>'id'
      - name: lightspeed_x_product_types
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_product_types}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_product_types}.connection_id
          AND {CUBE}.payload_json->>'product_type_id' = {lightspeed_x_product_types}.payload_json->>'id'
      - name: lightspeed_x_brands
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_brands}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_brands}.connection_id
          AND {CUBE}.payload_json->>'brand_id' = {lightspeed_x_brands}.payload_json->>'id'
      - name: lightspeed_x_suppliers
        relationship: many_to_one
        sql: >
          {CUBE}.tenant_id = {lightspeed_x_suppliers}.tenant_id
          AND {CUBE}.connection_id = {lightspeed_x_suppliers}.connection_id
          AND {CUBE}.payload_json->>'supplier_id' = {lightspeed_x_suppliers}.payload_json->>'id'
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
      - { name: product_id, sql: "{CUBE}.payload_json->>'id'", type: string, public: false }
      - { name: family_id, sql: "{CUBE}.payload_json->>'family_id'", type: string, public: false }
      - { name: variant_parent_id, sql: "{CUBE}.payload_json->>'variant_parent_id'", type: string, public: false }
      - { name: product_name, sql: "{CUBE}.payload_json->>'name'", type: string, title: Product }
      - { name: variant_name, sql: "{CUBE}.payload_json->>'variant_name'", type: string }
      - { name: sku, sql: "{CUBE}.payload_json->>'sku'", type: string }
      - { name: handle, sql: "{CUBE}.payload_json->>'handle'", type: string }
      - { name: supplier_code, sql: "{CUBE}.payload_json->>'supplier_code'", type: string }
      - { name: source, sql: "{CUBE}.payload_json->>'source'", type: string }
      - { name: source_id, sql: "{CUBE}.payload_json->>'source_id'", type: string }
      - { name: active, sql: "COALESCE(({CUBE}.payload_json->>'active')::boolean, false)", type: boolean }
      - { name: is_variant, sql: "({CUBE}.payload_json->>'variant_parent_id' IS NOT NULL)", type: boolean }
      - { name: has_variants, sql: "COALESCE(({CUBE}.payload_json->>'has_variants')::boolean, false)", type: boolean }
      - { name: tracks_inventory, sql: "COALESCE(({CUBE}.payload_json->>'has_inventory')::boolean, false)", type: boolean }
      - { name: is_composite, sql: "COALESCE(({CUBE}.payload_json->>'is_composite')::boolean, false)", type: boolean }
      - { name: tax_category, sql: "{CUBE}.payload_json->>'tax_category'", type: string }
      - { name: description, sql: "{CUBE}.payload_json->>'description'", type: string }
      - { name: retail_price_including_tax, sql: "NULLIF({CUBE}.payload_json->>'price_including_tax', '')::numeric", type: number, format: currency }
      - { name: retail_price_excluding_tax, sql: "NULLIF({CUBE}.payload_json->>'price_excluding_tax', '')::numeric", type: number, format: currency }
      - { name: supply_price, sql: "NULLIF({CUBE}.payload_json->>'supply_price', '')::numeric", type: number, format: currency }
      - { name: catalogue_margin, sql: "NULLIF({CUBE}.payload_json->>'price_excluding_tax', '')::numeric - NULLIF({CUBE}.payload_json->>'supply_price', '')::numeric", type: number, format: currency }
      - { name: catalogue_margin_pct, sql: "100.0 * (NULLIF({CUBE}.payload_json->>'price_excluding_tax', '')::numeric - NULLIF({CUBE}.payload_json->>'supply_price', '')::numeric) / NULLIF(NULLIF({CUBE}.payload_json->>'price_excluding_tax', '')::numeric, 0)", type: number, format: percent }
      - { name: loyalty_amount, sql: "NULLIF({CUBE}.payload_json->>'loyalty_amount', '')::numeric", type: number }
      - { name: weight, sql: "NULLIF({CUBE}.payload_json->>'weight', '')::numeric", type: number }
      - { name: weight_unit, sql: "{CUBE}.payload_json->>'weight_unit'", type: string }
      - { name: created_at, sql: "({CUBE}.payload_json->>'created_at')::timestamptz", type: time }
      - { name: updated_at, sql: "({CUBE}.payload_json->>'updated_at')::timestamptz", type: time }
      - { name: deleted_at, sql: "({CUBE}.payload_json->>'deleted_at')::timestamptz", type: time }
    measures:
      - { name: products_and_variants, type: count }
      - name: active_products_and_variants
        type: count
        filters: [{ sql: "COALESCE(({CUBE}.payload_json->>'active')::boolean, false) AND {CUBE}.payload_json->>'deleted_at' IS NULL" }]
      - name: sellable_variants
        type: count
        filters: [{ sql: "COALESCE(({CUBE}.payload_json->>'active')::boolean, false) AND ({CUBE}.payload_json->>'variant_parent_id' IS NOT NULL OR COALESCE(({CUBE}.payload_json->>'has_variants')::boolean, false) = false)" }]
      - name: inventory_tracked_products
        type: count
        filters: [{ sql: "COALESCE(({CUBE}.payload_json->>'has_inventory')::boolean, false)" }]
      - { name: average_retail_price_including_tax, sql: "NULLIF({CUBE}.payload_json->>'price_including_tax', '')::numeric", type: avg, format: currency }
      - { name: average_supply_price, sql: "NULLIF({CUBE}.payload_json->>'supply_price', '')::numeric", type: avg, format: currency }

  - name: lightspeed_x_customer_groups
    title: Lightspeed X-Series customer groups
    public: false
    description: Merchant-defined customer groups used by price books and promotions.
    sql: >
      SELECT t.namespaced_source_key, t.tenant_id, t.connection_id, t.payload_json
      FROM source_lightspeed_x.lx_customer_groups t
      WHERE NOT t.tombstone
    dimensions:
      - { name: row_key, sql: namespaced_source_key, type: string, primary_key: true, public: false }
      - { name: tenant_id, sql: tenant_id, type: string, public: false }
      - { name: connection_id, sql: connection_id, type: string, public: false }
