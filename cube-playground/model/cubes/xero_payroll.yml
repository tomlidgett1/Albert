        sql: row_key
        type: string
        primary_key: true
        public: false
      - name: tenant_id
        sql: tenant_id
        type: string
        public: false
      - name: account_id
        sql: account_id
        type: string
        public: false
      - name: account_purpose
        sql: account_purpose
