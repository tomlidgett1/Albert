name: Legacy release dispatcher (disabled)

on:
  workflow_dispatch:

# Production releases are authorized exclusively by release-authority.yml from
# an immutable, protected release-authority tag. This retained workflow exists
# only to fail closed for stale bookmarks and API clients.
permissions: {}

jobs:
  retired:
    name: Reject the retired mutable release path
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Direct operators to the immutable authority
        shell: bash
        run: |
          echo "::error title=Legacy release workflow disabled::Dispatch .github/workflows/release-authority.yml from a protected albert-release-authority-v* tag."
          exit 1
