name: Deploy independent vendor connection attestor

on:
  workflow_dispatch:
    inputs:
      trusted_tag:
        description: Reviewed immutable vendor-attestor-v* tag
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vendor-connection-attestor-trust
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      startsWith(github.ref, 'refs/tags/vendor-attestor-v') &&
      github.ref_name == inputs.trusted_tag &&
      github.run_attempt == 1
    environment: vendor-attestor-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prove signed tag, signer, workflow ref, and environment policy
        env:
          GH_TOKEN: ${{ secrets.ALBERT_GITHUB_CONFIGURATION_AUDIT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_TAG: ${{ inputs.trusted_tag }}
          AUTHORITY_SHA: ${{ vars.ALBERT_VENDOR_ATTESTOR_AUTHORITY_SHA }}
          EXPECTED_SIGNER_EMAIL: ${{ vars.ALBERT_VENDOR_ATTESTOR_TAG_SIGNER_EMAIL }}
          TAG_ISSUER_APP_ID: ${{ vars.ALBERT_VENDOR_ATTESTOR_TAG_ISSUER_APP_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const required = (name) => {
            const value = process.env[name]?.trim();
            assert.ok(value, `${name} is required`);
            return value;
          };
          const repository = required("REPOSITORY");
          const tag = required("TRUSTED_TAG");
          const authoritySha = required("AUTHORITY_SHA");
          const expectedSignerEmail = required("EXPECTED_SIGNER_EMAIL");
          const tagIssuerAppId = Number(required("TAG_ISSUER_APP_ID"));
          assert.ok(Number.isSafeInteger(tagIssuerAppId) && tagIssuerAppId > 0);
          const token = required("GH_TOKEN");
          assert.match(tag, /^vendor-attestor-v[0-9]+\.[0-9]+\.[0-9]+$/u);
          assert.match(authoritySha, /^[a-f0-9]{40}$/u);
          assert.equal(process.env.GITHUB_REF, `refs/tags/${tag}`);
          assert.equal(process.env.GITHUB_REF_TYPE, "tag");
          assert.equal(process.env.GITHUB_REF_NAME, tag);
          assert.equal(process.env.GITHUB_RUN_ATTEMPT, "1", "trust deployment cannot be re-run");
          assert.equal(required("GITHUB_SHA"), authoritySha);
          assert.equal(
            required("GITHUB_WORKFLOW_REF"),
            `${repository}/.github/workflows/vendor-connection-attestor.yml@refs/tags/${tag}`,
          );
          const api = async (path, init = {}) => {
            const response = await fetch(`https://api.github.com${path}`, {
              ...init,
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "x-github-api-version": "2022-11-28",
                ...(init.headers ?? {}),
              },
            });
            assert.equal(response.ok, true, `GitHub API ${path} returned ${response.status}`);
            return await response.json();
          };
          const tagRef = await api(`/repos/${repository}/git/ref/tags/${encodeURIComponent(tag)}`);
          assert.equal(tagRef.object?.type, "tag", "trust tag must be annotated, not lightweight");
          const tagObject = await api(`/repos/${repository}/git/tags/${tagRef.object.sha}`);
          assert.equal(tagObject.tag, tag, "annotated tag object name does not match the protected ref");
          assert.equal(tagObject.object?.type, "commit");
          assert.equal(tagObject.object?.sha, authoritySha);
          assert.equal(tagObject.verification?.verified, true, "annotated tag signature is not verified");
          assert.equal(tagObject.verification?.reason, "valid", "annotated tag signature is not valid");
          assert.equal(
            tagObject.tagger?.email,
            expectedSignerEmail,
            "annotated tag tagger is not the approved signing identity",
          );
          const environment = await api(`/repos/${repository}/environments/vendor-attestor-trust`);
          assert.equal(
            environment.can_admins_bypass,
            false,
            "trust environment must disable administrator protection-rule bypass",
          );
          assert.deepEqual(environment.deployment_branch_policy, {
            protected_branches: false,
            custom_branch_policies: true,
          });
          const reviewerRule = environment.protection_rules?.find(
            (rule) => rule.type === "required_reviewers",
          );
          assert.equal(reviewerRule?.prevent_self_review, true);
          assert.ok(reviewerRule?.reviewers?.length >= 1, "trust environment needs a reviewer");
          const policies = await api(
            `/repos/${repository}/environments/vendor-attestor-trust/deployment-branch-policies?per_page=100`,
          );
          assert.deepEqual(
            policies.branch_policies?.map(({ name: policy, type }) => ({ name: policy, type })),
            [{ name: "vendor-attestor-v*", type: "tag" }],
            "trust environment must admit only vendor-attestor-v* tags",
          );
          const rulesets = await api(`/repos/${repository}/rulesets?includes_parents=true&per_page=100`);
          const tagRulesets = [];
          for (const summary of rulesets) {
            const detail = await api(`/repos/${repository}/rulesets/${summary.id}`);
            if (
              detail.target === "tag" && detail.enforcement === "active" &&
              JSON.stringify(detail.conditions?.ref_name?.include) ===
                JSON.stringify(["refs/tags/vendor-attestor-v*"]) &&
              JSON.stringify(detail.conditions?.ref_name?.exclude) === JSON.stringify([])
            ) tagRulesets.push(detail);
          }
          assert.equal(tagRulesets.length, 2, "authority tag namespace needs two exact active rulesets");
          const creationRulesets = tagRulesets.filter((ruleset) =>
            ruleset.rules?.some(({ type }) => type === "creation"));
          const immutableRulesets = tagRulesets.filter((ruleset) =>
            ruleset.rules?.some(({ type }) => type === "update"));
          assert.equal(creationRulesets.length, 1, "authority tag creation ruleset is missing");
          assert.equal(
            Object.hasOwn(creationRulesets[0], "bypass_actors"),
            true,
            "audit principal cannot inspect creation bypass actors",
          );
          assert.deepEqual(
            creationRulesets[0].rules?.map(({ type }) => type).sort(),
            ["creation"],
            "tag-issuer bypass must apply only to creation",
          );
          assert.deepEqual(creationRulesets[0].bypass_actors, [{
            actor_id: tagIssuerAppId,
            actor_type: "Integration",
            bypass_mode: "always",
          }], "only the protected tag-issuer GitHub App may create authority tags");
          assert.equal(immutableRulesets.length, 1, "authority tag immutability ruleset is missing");
          assert.equal(
            Object.hasOwn(immutableRulesets[0], "bypass_actors"),
            true,
            "audit principal cannot inspect immutability bypass actors",
          );
          assert.deepEqual(
            immutableRulesets[0].rules?.map(({ type }) => type).sort(),
            ["deletion", "update"],
          );
          assert.deepEqual(
            immutableRulesets[0].bypass_actors,
            [],
            "authority tag update/deletion restrictions must have no bypass, including admins",
          );
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove the protected tag resolves to the reviewed trust commit
        env:
          TRUSTED_TAG: ${{ inputs.trusted_tag }}
          AUTHORITY_SHA: ${{ vars.ALBERT_VENDOR_ATTESTOR_AUTHORITY_SHA }}
        run: |
          [[ "$TRUSTED_TAG" =~ ^vendor-attestor-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$AUTHORITY_SHA"
          test "$(git rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "$(git rev-list -n 1 "refs/tags/$TRUSTED_TAG")" = "$AUTHORITY_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.61
      - run: npm ci --ignore-scripts
      - run: npm run build:vendor-connection-attestor
      - run: node --check .albert-build/vendor-connection-attestor/main.js
      - run: node --import tsx --test services/vendor-connection-attestor/*.test.ts
      - name: Build and push the immutable trusted-tooling image
        id: image
        env:
          APP_NAME: ${{ vars.FLY_VENDOR_ATTESTOR_APP }}
          AUTHORITY_SHA: ${{ vars.ALBERT_VENDOR_ATTESTOR_AUTHORITY_SHA }}
          FLY_API_TOKEN: ${{ secrets.FLY_VENDOR_ATTESTOR_API_TOKEN }}
        run: |
          test -n "$APP_NAME"
          flyctl auth docker
          image="registry.fly.io/$APP_NAME:vendor-attestor-$AUTHORITY_SHA"
          docker build --pull --file Dockerfile.vendor-connection-attestor --tag "$image" .
          push_output="$(docker push "$image")"
          printf '%s\n' "$push_output"
          pushed_digest="$(printf '%s\n' "$push_output" | sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}).*$/\1/p' | tail -1)"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$digest" = "$pushed_digest"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Provision the isolated database login and pinned verifier
        env:
          CONTROL_PLANE_ADMIN_DATABASE_URL: ${{ secrets.CONTROL_PLANE_ADMIN_DATABASE_URL }}
          ALBERT_VENDOR_ATTESTOR_DB_PASSWORD: ${{ secrets.ALBERT_VENDOR_ATTESTOR_DB_PASSWORD }}
          ALBERT_VENDOR_ATTESTOR_ED25519_PUBLIC_KEY_BASE64: ${{ secrets.ALBERT_VENDOR_ATTESTOR_ED25519_PUBLIC_KEY_BASE64 }}
          ALBERT_VENDOR_ATTESTOR_ADMISSION_HMAC_KEY_BASE64: ${{ secrets.ALBERT_VENDOR_ATTESTOR_ADMISSION_HMAC_KEY_BASE64 }}
          ALBERT_VENDOR_ATTESTOR_KEY_ID: ${{ vars.ALBERT_VENDOR_ATTESTOR_KEY_ID }}
          ALBERT_VENDOR_ATTESTOR_TOOL_REF: ${{ github.repository }}@${{ vars.ALBERT_VENDOR_ATTESTOR_AUTHORITY_SHA }}
          ALBERT_VENDOR_ATTESTOR_BUILD_DIGEST: ${{ steps.image.outputs.digest }}
        run: npm run provision:vendor-connection-attestor
      - name: Stage only trust-domain runtime material
        env:
          APP_NAME: ${{ vars.FLY_VENDOR_ATTESTOR_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_VENDOR_ATTESTOR_API_TOKEN }}
          DATABASE_URL: ${{ secrets.ALBERT_VENDOR_ATTESTOR_DATABASE_URL }}
          PRIVATE_KEY: ${{ secrets.ALBERT_VENDOR_ATTESTOR_ED25519_PRIVATE_KEY_BASE64 }}
          ADMISSION_KEY: ${{ secrets.ALBERT_VENDOR_ATTESTOR_ADMISSION_HMAC_KEY_BASE64 }}
          TLS_KEY: ${{ secrets.ALBERT_VENDOR_ATTESTOR_TLS_KEY_BASE64 }}
          TLS_CERT: ${{ secrets.ALBERT_VENDOR_ATTESTOR_TLS_CERT_BASE64 }}
          TLS_CLIENT_CA: ${{ secrets.ALBERT_VENDOR_ATTESTOR_TLS_CLIENT_CA_BASE64 }}
          SYNC_FINGERPRINT: ${{ vars.ALBERT_VENDOR_ATTESTOR_SYNC_CLIENT_SHA256 }}
          KEY_ID: ${{ vars.ALBERT_VENDOR_ATTESTOR_KEY_ID }}
          TOOL_REF: ${{ github.repository }}@${{ vars.ALBERT_VENDOR_ATTESTOR_AUTHORITY_SHA }}
          BUILD_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          flyctl secrets set --app "$APP_NAME" --stage \
            ALBERT_VENDOR_ATTESTOR_DATABASE_URL="$DATABASE_URL" \
            ALBERT_VENDOR_ATTESTOR_ED25519_PRIVATE_KEY_BASE64="$PRIVATE_KEY" \
            ALBERT_VENDOR_ATTESTOR_ADMISSION_HMAC_KEY_BASE64="$ADMISSION_KEY" \
            ALBERT_VENDOR_ATTESTOR_TLS_KEY_BASE64="$TLS_KEY" \
            ALBERT_VENDOR_ATTESTOR_TLS_CERT_BASE64="$TLS_CERT" \
            ALBERT_VENDOR_ATTESTOR_TLS_CLIENT_CA_BASE64="$TLS_CLIENT_CA" \
            ALBERT_VENDOR_ATTESTOR_SYNC_CLIENT_SHA256="$SYNC_FINGERPRINT" \
            ALBERT_VENDOR_ATTESTOR_KEY_ID="$KEY_ID" \
            ALBERT_VENDOR_ATTESTOR_TOOL_REF="$TOOL_REF" \
            ALBERT_VENDOR_ATTESTOR_BUILD_DIGEST="$BUILD_DIGEST"
      - name: Deploy the exact pushed digest without public ingress
        env:
          APP_NAME: ${{ vars.FLY_VENDOR_ATTESTOR_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_VENDOR_ATTESTOR_API_TOKEN }}
        run: |
          flyctl config validate --strict --app "$APP_NAME" --config deploy/vendor-attestor/vendor-connection-attestor.reference.toml
          flyctl deploy --app "$APP_NAME" \
            --config deploy/vendor-attestor/vendor-connection-attestor.reference.toml \
            --image "${{ steps.image.outputs.image }}" --strategy rolling --yes
          flyctl scale count 2 --app "$APP_NAME" --yes
