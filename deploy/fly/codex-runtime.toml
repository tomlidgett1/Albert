primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../../Dockerfile.services"

[env]
  ALBERT_ANALYTICAL_REGION = "ap-southeast-2"
  ALBERT_CODEX_MAX_CONCURRENT_TURNS = "1"
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  ALBERT_RUNTIME_IDENTITY = "codex-runtime"
  NODE_ENV = "production"
  PORT = "8792"

[processes]
  app = "node --enable-source-maps services/codex-runtime.js"

[http_service]
  internal_port = 8792
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 2

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "10s"

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/livez"
    timeout = "3s"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]
