app = "albert-semantic-query-dogfood"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../../Dockerfile.services"

[env]
  ALBERT_RUNTIME_IDENTITY = "semantic-query"
  ALBERT_SEMANTIC_HOST = "0.0.0.0"
  ALBERT_SEMANTIC_PORT = "8788"
  ALBERT_SEMANTIC_RELAY_WORKER_ID = "semantic-promotion-relay"
  ALBERT_SEMANTIC_RELAY_POLL_INTERVAL_MS = "5000"
  ALBERT_SEMANTIC_RELAY_TENANT_BATCH_SIZE = "10"
  ALBERT_SEMANTIC_RELAY_CANDIDATE_BATCH_SIZE = "20"
  ALBERT_SEMANTIC_RELAY_LEASE_SECONDS = "90"
  NODE_ENV = "development"

[processes]
  app = "node --enable-source-maps services/semantic-query.js"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "8s"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]
