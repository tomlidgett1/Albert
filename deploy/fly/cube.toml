primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../../cube-playground/Dockerfile"

[env]
  # Production mode: JWT verification is enforced with CUBEJS_API_SECRET and
  # the playground is disabled. Single-node memory cache/queue driver; no
  # pre-aggregations are used, so no Cube Store cluster is needed yet.
  CUBEJS_DEV_MODE = "false"
  CUBEJS_CACHE_AND_QUEUE_DRIVER = "memory"
  CUBEJS_DB_TYPE = "postgres"
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  ALBERT_ANALYTICAL_REGION = "ap-southeast-2"
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "8s"

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
