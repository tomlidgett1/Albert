primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.services"

[env]
  ALBERT_ANALYTICAL_REGION = "ap-southeast-2"
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  ALBERT_MODEL_DATA_RESIDENCY_REGION = "au"
  ALBERT_RUNTIME_IDENTITY = "semantic-query"
  ALBERT_SEMANTIC_HOST = "0.0.0.0"
  ALBERT_SEMANTIC_PORT = "8788"
  ALBERT_SEMANTIC_RELAY_WORKER_ID = "semantic-promotion-relay"
  ALBERT_SEMANTIC_RELAY_POLL_INTERVAL_MS = "5000"
  ALBERT_SEMANTIC_RELAY_TENANT_BATCH_SIZE = "10"
  ALBERT_SEMANTIC_RELAY_CANDIDATE_BATCH_SIZE = "20"
  ALBERT_SEMANTIC_RELAY_LEASE_SECONDS = "90"
  NODE_ENV = "production"

[processes]
  app = "node --enable-source-maps services/semantic-query.js"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[checks]
  [checks.readiness]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/readyz"
    port = 8788
    timeout = "5s"
    type = "http"
    processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]
