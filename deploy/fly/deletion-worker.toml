primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "../../Dockerfile.services"

[env]
  ALBERT_ANALYTICAL_REGION = "ap-southeast-2"
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  ALBERT_DELETION_WORKER_ID = "deletion-worker"
  ALBERT_RUNTIME_IDENTITY = "deletion-worker"
  DELETION_WORKER_PORT = "8083"
  NODE_ENV = "production"
  SUPABASE_STORAGE_S3_REGION = "ap-southeast-2"

[processes]
  app = "node --enable-source-maps services/deletion-worker.js"

[checks]
  [checks.readiness]
    grace_period = "45s"
    interval = "15s"
    method = "get"
    path = "/readyz"
    port = 8083
    timeout = "8s"
    type = "http"
    processes = ["app"]

  [checks.liveness]
    grace_period = "15s"
    interval = "30s"
    method = "get"
    path = "/livez"
    port = 8083
    timeout = "5s"
    type = "http"
    processes = ["app"]

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["app"]
