primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.services"

[env]
  ALBERT_ANALYTICAL_REGION = "ap-southeast-2"
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  ALBERT_OPERATOR_DIAGNOSTIC_HOST = "0.0.0.0"
  ALBERT_RUNTIME_IDENTITY = "operator-diagnostic"
  ALBERT_OPERATOR_DIAGNOSTIC_PORT = "8790"
  NODE_ENV = "production"

[processes]
  app = "node --enable-source-maps services/operator-diagnostic.js"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "3s"

[checks]
  [checks.readiness]
    grace_period = "15s"
    interval = "15s"
    method = "get"
    path = "/readyz"
    port = 8790
    timeout = "3s"
    type = "http"
    processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/livez"
    timeout = "3s"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["app"]
