primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile.services"

[env]
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  NODE_ENV = "production"
  WEBHOOK_GATEWAY_PORT = "8081"
  ALBERT_WEBHOOK_WORKER_ID = "webhook-gateway"
  SUPABASE_STORAGE_S3_REGION = "ap-southeast-2"
  WEBHOOK_INBOX_ENCRYPTED_RETENTION_DAYS = "3"
  WEBHOOK_INBOX_METADATA_RETENTION_DAYS = "14"
  WEBHOOK_INBOX_PERSISTENCE_TIMEOUT_MS = "3500"
  WEBHOOK_INBOX_LEASE_SECONDS = "90"
  WEBHOOK_INBOX_POLL_MS = "500"
  WEBHOOK_INBOX_MAX_ATTEMPTS = "12"
  WEBHOOK_INBOX_RETRY_BASE_SECONDS = "5"
  WEBHOOK_INBOX_RETRY_MAX_SECONDS = "3600"

[processes]
  app = "node --enable-source-maps services/webhook-gateway.js"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "8s"

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/livez"
    timeout = "5s"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["app"]
