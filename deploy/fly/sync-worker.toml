primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "../../Dockerfile.services"

[env]
  ALBERT_ANALYTICAL_REGION = "ap-southeast-2"
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  ALBERT_METRICS_PORT = "9091"
  ALBERT_QUEUE_SLA_SECONDS = "300"
  ALBERT_RUNTIME_IDENTITY = "sync-worker"
  ALBERT_WORKER_CONCURRENCY = "8"
  ALBERT_WORKER_ID = "sync-worker"
  NODE_ENV = "production"
  PORT = "8080"
  SUPABASE_STORAGE_S3_REGION = "ap-southeast-2"

[metrics]
  port = 9091
  path = "/metrics"

[processes]
  app = "node --enable-source-maps services/sync-worker.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "8s"

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/livez"
    timeout = "5s"

[checks]
  [checks.readiness]
    grace_period = "45s"
    interval = "15s"
    method = "get"
    path = "/readyz"
    port = 8080
    timeout = "8s"
    type = "http"
    processes = ["app"]

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]
