primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../../Dockerfile.services"

[env]
  ALBERT_ANTHROPIC_HOST = "0.0.0.0"
  ALBERT_ANTHROPIC_PORT = "8791"
  ALBERT_ANTHROPIC_PROVIDER = "bedrock"
  ALBERT_CONTROL_PLANE_REGION = "ap-southeast-2"
  ALBERT_MODEL_DATA_RESIDENCY_REGION = "au"
  ALBERT_RUNTIME_IDENTITY = "anthropic-analytics"
  AWS_REGION = "ap-southeast-2"
  NODE_ENV = "production"

[processes]
  app = "node --enable-source-maps services/anthropic-analytics.js"

[http_service]
  internal_port = 8791
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "10s"

[checks]
  [checks.readiness]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/readyz"
    port = 8791
    timeout = "10s"
    type = "http"
    processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]
