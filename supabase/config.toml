project_id = "albert-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[edge_runtime]
enabled = false

[analytics]
enabled = false

# ADR 0144: the partner session broker authenticates partner API keys itself.
[functions.partner-session]
verify_jwt = false

# ADR 0151: partner provisioning authenticates partner platform keys itself.
[functions.partner-provision]
verify_jwt = false
